# Cheap one-shot Linux audit, no Rust compilation and no Windows hosted runner.
name: CodexDD 0.4.5 verify Bazel direct disk-cache flag observation (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f45-cache-arg-source-audit.yml"]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'e9e2f4627262abcc86113dfeab7da780abd476c9'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact branch source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify direct Bazel flag check and historical owner contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e9e2f4627262abcc86113dfeab7da780abd476c9'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f45_checkpoint_flag_verifier.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f44_checkpoint_contract.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f14_owner_matrix.py' -v
          command -v pwsh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile(".github/scripts/codexdd-045-3f44-checkpointed-opt-cache.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }; Write-Host "PASS: bounded cache checkpoint script parses"'
          test -z "$(git status --porcelain)"
