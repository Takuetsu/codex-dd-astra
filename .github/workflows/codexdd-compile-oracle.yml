name: CodexDD 3C.2 compile oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-compile-oracle.yml"
      - "codex-rs/**/*.rs"

permissions:
  contents: read

jobs:
  windows-tui-compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Compile codex-tui library tests on Windows
        run: cargo test -p codex-tui --lib --no-run --message-format short
