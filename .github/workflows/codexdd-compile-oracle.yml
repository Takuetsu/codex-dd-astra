name: CodexDD 3C.2 compile oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-compile-oracle.yml"
      - "codex-rs/**/*.rs"

permissions:
  contents: read

jobs:
  constructor-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scan adaptive state constructors
        shell: bash
        run: |
          printf '%s\n' '=== AdaptiveWorkflowStateSnapshot ==='
          grep -RIn --include='*.rs' 'AdaptiveWorkflowStateSnapshot {' codex-rs || true
          printf '%s\n' '=== ThreadAdaptiveWorkflowState ==='
          grep -RIn --include='*.rs' 'ThreadAdaptiveWorkflowState {' codex-rs || true
          printf '%s\n' '=== AdaptiveEvidenceRecord ==='
          grep -RIn --include='*.rs' 'AdaptiveEvidenceRecord {' codex-rs || true

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-core
          - codex-history
          - codex-tui
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Compile library tests
        run: cargo test -p ${{ matrix.package }} --lib --no-run --message-format short
