name: CodexDD PR45 exact Prettier oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-pr45-prettier-oracle.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact CI Prettier formatting
        run: |
          pnpm exec prettier --write \
            docs/codexdd-0.4.0-local-validation-orchestrator-design.md \
            docs/codexdd-0.4.0-validation-profile-contract.md \
            docs/codexdd-roadmap.md
      - name: Commit formatting and remove temporary oracle
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/codexdd-pr45-prettier-oracle.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet && git diff --quiet; then
            echo "No formatting diff."
            exit 0
          fi
          git add docs/codexdd-0.4.0-local-validation-orchestrator-design.md \
                  docs/codexdd-0.4.0-validation-profile-contract.md \
                  docs/codexdd-roadmap.md
          git commit -m "style: apply exact PR Prettier formatting"
          git push origin HEAD:dd/codexdd-v0.4.0-local-validation-orchestrator
