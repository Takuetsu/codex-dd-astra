name: codexdd-format-oracle

on:
  push:
    branches:
      - "dd/codexdd-v0.4.1-gpt-6.1-sol"
    paths:
      - ".github/workflows/codexdd-format-oracle.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format CodexDD 0.4.1 docs
        run: |
          pnpm exec prettier --write \
            docs/codexdd-0.4.1-packet-1a1-model-catalog-reconnaissance.md \
            docs/codexdd-0.4.1-packet-1a2-routing-surface-map.md \
            docs/codexdd-0.4.1-packet-1a3-persistence-regression-map.md \
            docs/codexdd-roadmap.md
          pnpm exec prettier --check \
            docs/codexdd-0.4.1-packet-1a1-model-catalog-reconnaissance.md \
            docs/codexdd-0.4.1-packet-1a2-routing-surface-map.md \
            docs/codexdd-0.4.1-packet-1a3-persistence-regression-map.md \
            docs/codexdd-roadmap.md

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            docs/codexdd-0.4.1-packet-1a1-model-catalog-reconnaissance.md \
            docs/codexdd-0.4.1-packet-1a2-routing-surface-map.md \
            docs/codexdd-0.4.1-packet-1a3-persistence-regression-map.md \
            docs/codexdd-roadmap.md; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/codexdd-0.4.1-packet-1a1-model-catalog-reconnaissance.md \
            docs/codexdd-0.4.1-packet-1a2-routing-surface-map.md \
            docs/codexdd-0.4.1-packet-1a3-persistence-regression-map.md \
            docs/codexdd-roadmap.md
          git commit -m "style: apply repository markdown formatting"
          git push origin HEAD:"${GITHUB_REF_NAME}"
