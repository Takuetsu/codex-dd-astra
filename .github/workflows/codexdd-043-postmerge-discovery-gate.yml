# Read-only CodexDD 0.4.3 original blocked discovery binding after PR #50.
# This is NOT v2 semantic acceptance, candidate publication, a release receipt or approval.
name: CodexDD 0.4.3 postmerge discovery evidence

on:
  push:
    branches:
      - dd/codexdd-v0.4.3-upstream-0.162.0-integration
    paths:
      - .github/workflows/codexdd-043-postmerge-discovery-gate.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  immutable-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROD_SHA: "16fdc9826e800ebabab920eadd8e1d976d2f645f"
      SOURCE_CHECKPOINT: "544a29516353cb1e416b6097c46d8c83b23c7eb9"
      RUN_ID: "38155514359"
      TAG: "rust-v0.162.0"
      TARGET_SHA: "c1382380de69521303b416720a52f42d51af6248"
      MANIFEST_DIGEST: "3286752a1f6c31dd2b4f0f9fcb0ccadb34bcf004e3bf686a8811c2dd2ff8ebb3"
      CONFLICTS_DIGEST: "c3456c3e93130126f8f6f6bc1366bdafcc0c11835244ba70c31b91a564a450a4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current isolated source, no stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source remained isolated and rebased only through approved production tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Takuetsu/codex-dd-astra'
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --heads origin refs/heads/dd/astra-policy-v2 | cut -f1)" = "$PROD_SHA"
          git merge-base --is-ancestor "$PROD_SHA" HEAD
          git merge-base --is-ancestor "$SOURCE_CHECKPOINT" HEAD
          git diff --quiet "$SOURCE_CHECKPOINT" HEAD -- codex-rs
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.3'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = "$TAG"

      - name: Verify original successful discovery run is pinned to approved production
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq \
            '[.name,.event,.head_branch,.head_sha,.conclusion] | @tsv' \
            | grep -Fx "upstream-codex-discovery"$'\t'"workflow_dispatch"$'\t'"dd/astra-policy-v2"$'\t'"$PROD_SHA"$'\t'"success"

      - name: Download and hash the exact original blocked discovery artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "upstream-candidate-rust-v0.162.0-$RUN_ID" \
            --dir "$RUNNER_TEMP/original"
          test -f "$RUNNER_TEMP/original/manifest.json"
          test -f "$RUNNER_TEMP/original/transplant-conflicts.txt"
          printf '%s  %s\n' "$MANIFEST_DIGEST" "$RUNNER_TEMP/original/manifest.json" | sha256sum --check --status
          printf '%s  %s\n' "$CONFLICTS_DIGEST" "$RUNNER_TEMP/original/transplant-conflicts.txt" | sha256sum --check --status

      - name: Crosscheck blocked original and complete historical 136-path ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "original"
          manifest = json.loads((root / "manifest.json").read_bytes())
          conflict_paths = (root / "transplant-conflicts.txt").read_text("utf-8").splitlines()
          history = json.loads(Path("docs/codexdd-0.4.3-packet-3a3-overlap-ownership.json").read_bytes())
          assert type(manifest.get("contract_version")) is int and manifest["contract_version"] == 1
          assert manifest["state"] == "blocked_transplant_conflict"
          assert manifest["transplant_dry_run"] == "conflict"
          assert manifest["production_sha"] == os.environ["PROD_SHA"]
          assert manifest["production_tree"] == "76ce3087f8808dc57ed3db809ea0b919076e5f65"
          assert manifest["target_upstream_tag"] == os.environ["TAG"]
          assert manifest["target_upstream_sha"] == os.environ["TARGET_SHA"]
          assert manifest["codexdd_product_version"] == "0.4.2"
          assert manifest["overlap_path_count"] == 136
          assert len(manifest["overlap_paths"]) == len(set(manifest["overlap_paths"])) == 136
          assert len(conflict_paths) == len(set(conflict_paths)) == 22
          assert set(conflict_paths).issubset(set(manifest["overlap_paths"]))
          assert len(history["rows"]) == 136
          assert [row["path"] for row in history["rows"]] == manifest["overlap_paths"]
          assert history["conflict_paths_in_original_order"] == conflict_paths
          overlap_digest = hashlib.sha256("\n".join(manifest["overlap_paths"]).encode("utf-8")).hexdigest()
          assert overlap_digest == history["overlap_paths_sha256"]
          assert history["original_conflict_report_sha256"] == os.environ["CONFLICTS_DIGEST"]
          assert history["production_sha"] == "4828e3b4232781963594cfaaebdc49c5531de8b1"
          assert all(row.get("packet_owner") and row.get("resolution_status") for row in history["rows"])
          print("PASS: fresh original blocked discovery, 136 ordered overlaps, 22 ordered conflicts, stable historical ownership")
          print("PASS: original manifest SHA-256", os.environ["MANIFEST_DIGEST"])
          print("PASS: original conflicts SHA-256", os.environ["CONFLICTS_DIGEST"])
          print("No v2 attestation, candidate, release receipt or semantic acceptance generated.")
          PY

      - name: Assert no Git changes were produced
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "Read-only identity gate PASS. No promotion or publication attempted."
