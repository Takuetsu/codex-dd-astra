# Read-only, nonrelease native Windows source compile and focused F2/elevation smoke.
# Does not publish a candidate, alter the source, install, sign off native SSH F2,
# or waive the 21-stage release profile and non-elevated detached-daemon acceptance.
name: CodexDD 0.4.3 Windows source and elevation smoke

on:
  push:
    branches:
      - dd/codexdd-v0.4.3-upstream-0.162.0-integration
    paths:
      - .github/workflows/codexdd-043-windows-source-smoke.yml

permissions:
  contents: read

jobs:
  windows-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout exact isolated integration source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert product and unchanged reanchored Rust source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Takuetsu/codex-dd-astra') { throw 'Unexpected repository' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration') { throw 'Unexpected branch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unpinned checkout' }
          git merge-base --is-ancestor 16fdc9826e800ebabab920eadd8e1d976d2f645f HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved tooling production is not an ancestor' }
          git diff --quiet 544a29516353cb1e416b6097c46d8c83b23c7eb9 HEAD -- codex-rs sdk/python/src/openai_codex/generated
          if ($LASTEXITCODE -ne 0) { throw 'Rust or SDK source changed since pinned runtime regression tests' }
          if ((Get-Content -Raw codex-rs/codexdd-version.txt).Trim() -ne '0.4.3') { throw 'Unexpected CodexDD product identity' }
          if ((Get-Content -Raw codex-rs/upstream-codex-release.txt).Trim() -ne 'rust-v0.162.0') { throw 'Unexpected upstream identity' }
          if ((git status --porcelain)) { throw 'Dirty source checkout' }

      - name: Configure standard Codex CI environment
        uses: ./.github/actions/setup-ci

      - name: Pin repository Rust 1.95.0 toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Verify official prebuilt Windows V8 binding and checksum
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Compile Windows daemon library and Windows-specific unit test sources
        shell: pwsh
        working-directory: codex-rs
        run: |
          cargo check --locked -p codex-app-server-daemon --lib --tests
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows daemon source or tests did not compile' }

      - name: Compile Windows TUI including elevated F2 regression test sources
        shell: pwsh
        working-directory: codex-rs
        run: |
          cargo check --locked -p codex-tui --lib --tests
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows TUI source or tests did not compile' }

      - name: Execute native Windows token probe and typed elevation-denial regression
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'backend::windows::tests::elevated_token_probe_and_daemon_guard_agree'
          $listing = & cargo test --locked -p codex-app-server-daemon --lib $test -- --list 2>&1
          if ($LASTEXITCODE -ne 0) { $listing | Out-Host; throw 'Cannot enumerate Windows elevation regression' }
          if (-not (($listing -join "`n") -match '1 test, 0 benchmarks')) { $listing | Out-Host; throw 'Windows elevation regression did not enumerate exactly one test' }
          & cargo test --locked -p codex-app-server-daemon --lib $test -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows elevation regression failed' }

      - name: Execute TUI implicit elevated startup no-F2-warning regression
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'elevated_windows_implicit_startup_uses_embedded_without_f2_warning'
          $listing = & cargo test --locked -p codex-tui --lib $test -- --list 2>&1
          if ($LASTEXITCODE -ne 0) { $listing | Out-Host; throw 'Cannot enumerate F2 regression' }
          if (-not (($listing -join "`n") -match '1 test, 0 benchmarks')) { $listing | Out-Host; throw 'F2 regression did not enumerate exactly one test' }
          & cargo test --locked -p codex-tui --lib $test -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows F2 regression failed' }

      - name: Verify read-only source and lockfile
        if: always()
        shell: pwsh
        run: |
          $changed = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Windows checkout' }
          if ($changed) { $changed | Out-Host; throw 'Native Windows smoke modified tracked or untracked files' }
          Write-Host 'This is an isolated source smoke only: no candidate, release receipt, production merge or SSH F2 acceptance.'
