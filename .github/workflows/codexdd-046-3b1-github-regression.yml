# CodexDD 0.4.6 Phase 3B.1 — nonproduction, source-matched GitHub verification.
# No release publishing, installation, runner-controlled worktree changes, or production merge.
# One-shot 3B.2n native CI diagnostic for noninteractive Core handler; no release or model authority changes.
name: CodexDD 0.4.6 3B.1 GitHub regression

on:
  push:
    branches:
      - dd/codexdd-v0.4.6-agent-reliability
    paths:
      - .github/workflows/codexdd-046-3b1-github-regression.yml
      - codex-rs/config/src/config_toml.rs
      - codex-rs/tui/src/adaptive_worker.rs
      # Owner-gate schema field compatibility across TUI startup/test surfaces.
      - codex-rs/tui/src/app/working_directory.rs
      - codex-rs/tui/src/adaptive_worker_tests.rs
      - codex-rs/tui/src/app/tests/session_lifecycle_requests.rs
      - codex-rs/tui/src/app_server_session/rollout_history_tests.rs
      - codex-rs/tui/src/adaptive_evidence.rs
      - codex-rs/tui/src/adaptive_evidence_tests.rs
      - codex-rs/tui/src/adaptive_gate_prerequisites.rs
      - codex-rs/tui/src/lib.rs
      - codex-rs/tui/src/app_server_session.rs
      - codex-rs/tui/src/app/app_server_event_targets.rs
      - codex-rs/tui/src/app/tests.rs
      - codex-rs/tui/src/chatwidget/tests/app_server.rs
      - codex-rs/tui/src/chatwidget/settings.rs
      - codex-rs/app-server/src/bespoke_event_handling.rs
      - codex-rs/app-server-protocol/src/protocol/common.rs
      - codex-rs/core/src/agent/control_tests.rs
      - codex-rs/core/src/session/session.rs
      - codex-rs/core/src/session/thread_settings.rs
      - codex-rs/core/src/session/turn_context.rs
      - codex-rs/core/src/tools/handlers/codexdd_validation.rs
      - codex-rs/core/src/tools/handlers/codexdd_validation_tests.rs
      - codex-rs/core/src/tools/registry.rs
      - codex-rs/core/src/tools/registry_tests.rs
      - codex-rs/core/src/session/worker_authority.rs
      - codex-rs/core/src/session/turn_input.rs
      - codex-rs/core/src/session/turn_input_tests.rs
      - codex-rs/protocol/src/protocol.rs
      - codex-rs/core/src/state/session.rs
      - codex-rs/core/src/session/mod.rs
      - codex-rs/core/src/thread_manager_tests.rs
      - codex-rs/tui/src/session_state.rs
      - codex-rs/tui/src/chatwidget/adaptive_effort.rs
      - codex-rs/tui/src/chatwidget/input_submission.rs
      - codex-rs/tui/src/chatwidget/tests/adaptive_effort_tests.rs
      - codex-rs/tui/src/chatwidget/adaptive_trusted_signal.rs
      - codex-rs/tui/src/chatwidget/adaptive_evidence.rs
      - codex-rs/history/src/lib.rs
      - codex-rs/history/src/tests.rs
      - codex-rs/app-server-protocol/src/protocol/v2/thread.rs
      - codex-rs/app-server/src/request_processors/thread_lifecycle.rs
      - codex-rs/app-server/src/request_processors/turn_processor.rs
      - codex-rs/app-server/src/request_processors/persisted_resume_settings_tests.rs
      - codex-rs/app-server/tests/suite/v2/mod.rs
      - codex-rs/app-server/tests/suite/v2/codexdd_candidate_native.rs
      - codex-rs/app-server/tests/suite/v2/codexdd_worker_handoff_native.rs
      - docs/regression-fixtures/codexdd-046-agent-reliability-cases.json
      # Native 3C.1b.2d profile/contract changes must trigger their own CI.
      - scripts/codexdd-validation-common.ps1
      - scripts/codexdd-test-independent.ps1
      - scripts/codexdd-independent-profile-contract-tests.ps1
      - scripts/codexdd-validation-contract-tests.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexdd-046-3b1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: 3B.1 source and regression-contract preflight
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.6-agent-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact WIP source without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact branch, SHA and nonproduction baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.6-agent-reliability'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          git merge-base --is-ancestor b25550dcb2c6e84a84074b603086c9db6f32a63b HEAD
      - name: Check scoped 25-case fixture and source integration (nonexecuting)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path("docs/regression-fixtures/codexdd-046-agent-reliability-cases.json").read_text(encoding="utf-8"))
          cases = fixture["cases"]
          assert len(cases) == 25
          assert len({case["id"] for case in cases}) == 25
          assert sum(case["priority"] == "P0" for case in cases) == 21
          assert sum(case["priority"] == "P1_conditional" for case in cases) == 4
          required = {
              "codex-rs/tui/src/adaptive_worker.rs": (
                  "preflight_mechanical_target",
                  "configured_worker_binding",
                  "pinned_worktree_identity_rejects_wrong_root_sha_and_dirty_edits",
              ),
              "codex-rs/tui/src/chatwidget/adaptive_effort.rs": (
                  "let assignment_preflight = self.assignment_preflight.clone()",
                  "source_pin_survives_adaptive_activation_and_new_model_route",
              ),
              "codex-rs/tui/src/app_server_session.rs": (
                  "configured_worker_authority",
                  "worker_assignment_locked = lock_assignment",
                  "pinned_startup_worker_source_is_transmitted_only_to_embedded_core",
              ),
              "codex-rs/core/src/tools/handlers/codexdd_validation.rs": (
                  "validate_native_authorized_target",
                  "source_identity_mismatch",
                  "source_identity_changed",
              ),
              "codex-rs/tui/src/session_state.rs": (
                  "persisted pinned source requires locked Worker role",
                  "cannot restore protected MechanicalValidation",
              ),
              "codex-rs/history/src/lib.rs": ("pub authorized_source_sha: Option<String>",),
              "codex-rs/app-server-protocol/src/protocol/v2/thread.rs": ("pub authorized_source_sha: Option<String>",),
          }
          for path, markers in required.items():
              content = Path(path).read_text(encoding="utf-8")
              for marker in markers:
                  assert marker in content, f"{path}: missing {marker}"
          print("Source markers and 25-case contract shape PASS (not an executable Rust test).")
          PY
      - name: Assert read-only checkout and unchanged Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

  rust-format:
    name: Rustfmt 3B.1 source review
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Validate Rust formatting without edits
        working-directory: codex-rs
        shell: bash
        run: cargo fmt -- --config imports_granularity=Item --check

  windows-3b2-native-focused:
    name: 3B.2i focused Windows Git-boundary, restart and TUI pin tests
    # An explicit commit-message opt-in runs only these narrow regressions.
    # Scoped 3B.2i-g retest after Core snapshot projection fix, source/format PASS #42867935907.
    # Revalidated after exact-source and Rustfmt PASS (#42859946221) for 3B.2i-g.
    # This is neither the full Windows gate nor a production/release action.
    if: github.event_name == 'push' && github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.6-agent-reliability' && contains(github.event.head_commit.message, '[3b2-focused-native]')
    needs: [source-contract, rust-format]
    runs-on: windows-2022
    timeout-minutes: 95
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout exact development commit with no write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up disposable native Windows build paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source mismatch' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.6-agent-reliability') { throw 'Wrong branch' }
          $root = Join-Path $env:RUNNER_TEMP 'codexdd-046-3b2-native'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'temp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CARGO_TARGET_DIR=$target"
            "CARGO_NET_GIT_FETCH_WITH_CLI=true"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git longpath configuration failed' }
      - name: Install pinned DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Expose DotSlash to Windows child processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dotslash = (Get-Command dotslash -ErrorAction Stop).Source
          $target = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\dotslash.exe'
          Copy-Item -LiteralPath $dotslash -Destination $target -Force
      - name: Use repository Rust 1.95 toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure repository-verified Windows V8 artifact
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Test bounded Git subprocess termination
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked -p codex-core --lib codexdd_046_3b2p_ -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw '3B.2i-f subprocess timeout/cleanup regression failed' }
      - name: Test real app-server candidate authorization and cold resume
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked -p codex-app-server --test all codexdd_046_3b2n_ -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw '3B.2i-e real-process candidate authorization or cold resume failed' }
      - name: Test embedded TUI pin reconciliation after cold resume
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked -p codex-tui --lib codexdd_046_3b2q_ -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw '3B.2i-g embedded TUI source pin reconciliation failed' }
      - name: Test TUI Git subprocess timeout and direct-child reap
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = 'codexdd_046_3b2r_'
          $listing = & cargo test --locked -p codex-tui --lib $filter -- --list 2>&1
          $listExit = $LASTEXITCODE
          $listing | Out-Host
          if ($listExit -ne 0 -or ($listing -join [Environment]::NewLine) -notmatch '1 test, 0 benchmarks') {
            throw '3B.2i-h expected exactly one bounded TUI Git subprocess regression'
          }
          & cargo test --locked -p codex-tui --lib $filter -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw '3B.2i-h TUI Git child timeout/cleanup regression failed' }
      - name: Confirm no source mutation or release activity
        if: always()
        shell: pwsh
        run: |
          Write-Host "Focused native test at $env:GITHUB_SHA only; no install, release, or merge."
          git status --short

  windows-3b2j-lvo-native:
    name: 3B.2j focused Windows native LVO Git bound and source identity
    # Opt-in only. Reuses exact-source checks and repo-pinned Windows setup.
    # No broad Windows regression suite, release, installation, or source mutation.
    if: github.event_name == 'push' && github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.6-agent-reliability' && contains(github.event.head_commit.message, '[3b2j-native]')
    needs: [source-contract, rust-format]
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout exact nonproduction source without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up isolated Windows Rust compilation paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw '3B.2j source mismatch' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.6-agent-reliability') { throw 'Wrong branch' }
          $root = Join-Path $env:RUNNER_TEMP 'codexdd-046-3b2j-native'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'temp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CARGO_TARGET_DIR=$target"
            "CARGO_NET_GIT_FETCH_WITH_CLI=true"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git longpath configuration failed' }
      - name: Install pinned DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Expose DotSlash to Windows subprocesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dotslash = (Get-Command dotslash -ErrorAction Stop).Source
          $target = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\dotslash.exe'
          Copy-Item -LiteralPath $dotslash -Destination $target -Force
      - name: Use repository Rust 1.95 toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure repository-verified Windows V8 artifact
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Run bounded native LVO Git timeout and authorized source regressions
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $filters = @(
            'codexdd_046_3b2s_',
            'native_authorized_target_checks_real_nested_git_worktree_and_candidate_sha'
          )
          foreach ($filter in $filters) {
            $listing = & cargo test --locked -p codex-core --lib $filter -- --list 2>&1
            $listExit = $LASTEXITCODE
            $listing | Out-Host
            if ($listExit -ne 0 -or ($listing -join [Environment]::NewLine) -notmatch '1 test, 0 benchmarks') {
              throw "3B.2j expected exactly one native Core test for $filter"
            }
            & cargo test --locked -p codex-core --lib $filter -- --test-threads=1 --nocapture
            if ($LASTEXITCODE -ne 0) { throw "3B.2j native Core regression failed: $filter" }
          }
      - name: Confirm no source mutation, merge, release, or installation
        if: always()
        shell: pwsh
        run: |
          Write-Host "3B.2j focused native tests at $env:GITHUB_SHA only; no production work."
          git status --short

  windows-3b2k-rust-native-profile:
    name: 3B.2k native Windows repo-owned Rust targeted profile
    # Explicit one-shot nonrelease smoke of the actual repository-owned PS1.
    # Does not claim live Core tool/Worker acceptance or Node profile acceptance.
    if: github.event_name == 'push' && github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.6-agent-reliability' && contains(github.event.head_commit.message, '[3b2k-native-rust]')
    needs: [source-contract, rust-format]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout exact nonproduction source without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated Windows test build paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw '3B.2k source mismatch' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.6-agent-reliability') { throw 'Wrong branch' }
          $root = Join-Path $env:RUNNER_TEMP 'codexdd-046-3b2k-native-rust'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'temp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CARGO_TARGET_DIR=$target"
            "CARGO_NET_GIT_FETCH_WITH_CLI=true"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git longpath setup failed' }
      - name: Install pinned DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Expose DotSlash to Windows subprocesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dotslash = (Get-Command dotslash -ErrorAction Stop).Source
          $target = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\dotslash.exe'
          Copy-Item -LiteralPath $dotslash -Destination $target -Force
      - name: Use repository Rust 1.95 toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure repository-verified Windows V8 artifact
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
      - name: Verify 16 MiB profile stack and isolate native detached-fork regression
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $profilePaths = @(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts\codexdd-test-targeted.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'scripts\codexdd-test-workpacket.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'scripts\codexdd-test-release.ps1')
          )
          foreach ($profilePath in $profilePaths) {
            $contents = Get-Content -LiteralPath $profilePath -Raw
            if ($contents -notmatch '\$env:RUST_MIN_STACK\s*=\s*"16777216"') {
              throw "Expected 16 MiB Rust stack in repo-owned profile: $profilePath"
            }
          }
          $env:RUST_MIN_STACK = '16777216'
          $filter = 'detached_fork_restores_persisted_adaptive_workflow_state'
          & cargo nextest run --locked -p codex-tui --lib --no-fail-fast --test-threads 1 $filter
          if ($LASTEXITCODE -ne 0) {
            throw '3B.2k isolated detached-fork test still fails; full Rust profile deliberately not executed'
          }
      - name: Execute real Rust targeted LVO script and verify contract-v1 stages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'codexdd-046-3b2k-rust-targeted.log'
          $profile = Join-Path $env:GITHUB_WORKSPACE 'scripts\codexdd-test-targeted.ps1'
          if (-not (Test-Path -LiteralPath $profile -PathType Leaf)) { throw 'Rust targeted profile unavailable' }
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $profile 2>&1 | Tee-Object -FilePath $log
          $nativeExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $prefix = 'CODEXDD_VALIDATION_JSON '
          $events = @(Get-Content -LiteralPath $log | Where-Object { $_.StartsWith($prefix) } | ForEach-Object {
            $_.Substring($prefix.Length) | ConvertFrom-Json
          })
          $begins = @($events | Where-Object { $_.event -eq 'profile_begin' })
          $ends = @($events | Where-Object { $_.event -eq 'profile_end' })
          $stageBegins = @($events | Where-Object { $_.event -eq 'stage_begin' })
          $stageEnds = @($events | Where-Object { $_.event -eq 'stage_end' })
          if ($begins.Count -ne 1 -or $ends.Count -ne 1) { throw 'Missing or repeated profile contract terminal' }
          if ($begins[0].contract_version -ne 1 -or $ends[0].contract_version -ne 1) { throw 'Wrong contract version' }
          if ($begins[0].profile -ne 'targeted' -or $ends[0].profile -ne 'targeted') { throw 'Wrong native profile' }
          if ($begins[0].stage_count -ne 3) { throw 'Expected three real Rust targeted stages' }
          if ($stageBegins.Count -ne 3 -or $stageEnds.Count -ne 3) { throw 'Missing real stages in contract' }
          $expected = @('diff-check', 'core-adaptive-tests', 'tui-adaptive-tests')
          for ($i = 0; $i -lt 3; $i++) {
            $ordinal = $i + 1
            if ($stageBegins[$i].stage -ne $expected[$i] -or $stageEnds[$i].stage -ne $expected[$i]) {
              throw "Wrong stage at ordinal $ordinal"
            }
            if ($stageBegins[$i].ordinal -ne $ordinal -or $stageEnds[$i].ordinal -ne $ordinal) {
              throw "Wrong ordinal at $ordinal"
            }
            if ($stageEnds[$i].status -ne 'pass' -or $stageEnds[$i].native_exit_code -ne 0) {
              throw "Rust native stage did not PASS: $($expected[$i])"
            }
          }
          if ($nativeExit -ne 0 -or $ends[0].status -ne 'pass' -or $ends[0].exit_code -ne 0 -or $ends[0].completed_stages -ne 3) {
            throw "Rust native targeted profile did not complete: process exit $nativeExit; contract status $($ends[0].status)"
          }
          Write-Host "3B.2k actual Rust targeted profile PASS: three native stages and matching exit/contract."
      - name: Confirm no source mutation or release activity
        if: always()
        shell: pwsh
        run: |
          Write-Host "3B.2k Rust profile evidence at $env:GITHUB_SHA; no release, install or merge."
          git status --short

  windows-3b2l-validator-negative:
    name: 3B.2l native Windows Validator and LVO refusal regressions
    # Negative policy only; does not simulate or authorize a live independent validator.
    if: github.event_name == 'push' && github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.6-agent-reliability' && contains(github.event.head_commit.message, '[3b2l-native]')
    needs: [source-contract, rust-format]
