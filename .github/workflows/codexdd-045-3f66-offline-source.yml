# 3F.66 source-only validation. Exact-source native Windows acceptance is separate.
name: CodexDD 0.4.5 3F.66 disconnected active-view input source preflight (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f66-offline-active-view-input]
    paths: [".github/workflows/codexdd-045-3f66-offline-source.yml"]
permissions:
  contents: read
jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'b407fe8e324c267bf3cd32b41306e7b87bc46129'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify all three offline guarded ownership paths and existing negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = 13bc15ff844e93dfaf7777c73bb7313b35bb3b81
          test "$(cat codex-rs/codexdd-version.txt)" = 0.4.4
          test "$(cat codex-rs/upstream-codex-release.txt)" = rust-v0.162.0
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          formal=json.loads((root/'docs/upstream-candidates/codexdd-045-3f55-formal-owner-approvals.json').read_text())
          assert len(formal['paths'])==109 and formal['approved_owner_count']==0
          assert len(formal['pending_native_or_semantic_restoration'])==13
          app=(root/'codex-rs/tui/src/app.rs').read_text()
          assert app.count('active_view_accepts_input_when_disconnected()')==3
          compact=re.sub(r'\s+', '', app)
          first=compact.index('ifself.reconnect.offline')
          assert compact.index('&&!self.chat_widget.active_view_accepts_input_when_disconnected()',first)<compact.index('letscreen_size=',first)
          assert 'handle_disconnected_view_key(*key, activation_key)' in app
          assert 'active_view_is(agents_overview::AGENTS_OVERVIEW_VIEW_ID)' in compact
          assert 'if self.reconnect.presentation == reconnect::ReconnectPresentation::Overview' in app
          assert 'let restrict_disconnected_input = self.reconnect.offline' in app
          assert '!self.chat_widget.active_view_accepts_input_when_disconnected();' in compact
          chat=(root/'codex-rs/tui/src/chatwidget/reconnect.rs').read_text()
          pane=(root/'codex-rs/tui/src/bottom_pane/mod.rs').read_text()
          assert 'fn active_view_accepts_input_when_disconnected' in chat
          assert 'fn active_view_accepts_input_when_disconnected' in pane
          tests=(root/'codex-rs/tui/src/app/tests/disconnect_tests.rs').read_text()
          assert 'async fn disconnected_config_panel_keeps_input()' in tests
          assert 'async fn lost_mutation_reply_preserves_work_without_resubmitting()' in tests
          print('PASS: offline view keyboard/paste ownership restored; 109/0, 13 risk holds')
          PY
          git diff --check HEAD~1 HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # pinned 1.95.0
        with:
          components: rustfmt
      - name: Full Rust workspace rustfmt; no native compilation
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check
