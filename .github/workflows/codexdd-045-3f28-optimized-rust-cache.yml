        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f28-realrust-restore-log
          path: ${{ runner.temp }}/codexdd045-3f28-real-rust-probe/*.log
          if-no-files-found: warn
          retention-days: 4
