# One-shot targeted native Core/TUI source acceptance. NO production release or signing.
name: CodexDD 0.4.5 3F.68 consolidated Windows TUI trust native acceptance (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f67-api-key-popup-compat]
    paths: [".github/workflows/codexdd-045-3f68-tui-native.yml"]
permissions:
  contents: read
jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'ecaa9461fb8d522615e58b92dc0a0279c228dbf8'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the 13 unwaived holds and 25 unique Rust TUI tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = 13bc15ff844e93dfaf7777c73bb7313b35bb3b81
          test "$(cat codex-rs/codexdd-version.txt)" = 0.4.4
          test "$(cat codex-rs/upstream-codex-release.txt)" = rust-v0.162.0
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          spec=json.loads((root/'docs/upstream-candidates/codexdd-045-3f68-native-test-cases.json').read_text())
          formal=json.loads((root/'docs/upstream-candidates/codexdd-045-3f55-formal-owner-approvals.json').read_text())
          assert spec['expected_core']==0 and spec['expected_tui']==25==len(spec['cases']['tui'])
          assert spec['release_approved'] is False
          assert spec['baseline_reviewed_head']=='ecaa9461fb8d522615e58b92dc0a0279c228dbf8'
          assert len(formal['paths'])==109 and formal['approved_owner_count']==0
          assert len(formal['pending_native_or_semantic_restoration'])==13
          app=(root/'codex-rs/tui/src/app.rs').read_text()
          routing=(root/'codex-rs/tui/src/app/thread_routing.rs').read_text()
          dispatch=(root/'codex-rs/tui/src/app/event_dispatch.rs').read_text()
          cfg=(root/'codex-rs/tui/src/app/config_persistence.rs').read_text()
          tests=(root/'codex-rs/tui/src/chatwidget/tests.rs').read_text()
          assert 'if self.startup_modal_input_needs_quarantine(&event)' in app
          assert 'if self.handle_rendered_selection_event(tui, &event)?' in app
          assert 'tui.discard_pending_input_before_interactive_screen()?' not in app
          assert 'tui.discard_pending_input_before_interactive_screen()?' not in routing
          assert 'if matches!(&event, AppEvent::OpenDaemonMenu | AppEvent::OpenWarnings)' in dispatch
          assert 'mod terminal_program_status;' in tests
          assert 'refresh_in_memory_config_from_disk_updates_live_widget_preferences' in cfg
          app_tests=(root/'codex-rs/tui/src/app/tests.rs').read_text()
          slash=(root/'codex-rs/tui/src/chatwidget/tests/slash_commands.rs').read_text()
          session=(root/'codex-rs/tui/src/app_server_session.rs').read_text()
          assert 'background_resolution_keeps_matching_foreground_user_input_visible' in app_tests
          assert 'shutdown_first_exit_unsubscribes_live_side_threads_before_leaving' in app_tests
          assert 'KeyCode::Insert, KeyModifiers::SHIFT' in slash
          assert 'Feature::ApiKeyCyberAccessPrograms' in slash
          assert 'api_key_cyber_access_programs' in session
          assert 'constrain_api_key_models' in session
          tests=(root/'codex-rs/tui/src/app/tests/disconnect_tests.rs').read_text()
          assert 'disconnected_config_panel_keeps_input' in tests
          assert 'lost_mutation_reply_preserves_work_without_resubmitting' in tests
          selector='api_key_model_popup_waits_for_filtered_catalog_and_ignores_changed_account'
          assert selector in app_tests
          case=app_tests[app_tests.index('async fn '+selector):]
          case=case[:case.index('\n#[tokio::test]',1)]
          # Prevent another 18-minute Windows compile for a test using private fields.
          assert 'app.chat_widget.status_account_display =' not in case
          assert case.count('app.chat_widget.update_account_state(')==2
          assert 'model_popup_request_is_current(stale_id)' in case
          assert 'account switch must invalidate' in case
          assert 'while events.try_recv().is_ok() {}' in case
          # The negative test must explicitly disable cyber forwarding, not
          # mistake an authorized feature for an authorization bypass.
          assert 'api_key_cyber_access_programs = false' in case
          assert 'ConfigBuilder::default()' in case
          assert 'Feature::ApiKeyCyberAccessPrograms' in case
          assert 'start_embedded_app_server_for_picker(&restricted_config)' in case
          assert 'start_thread(&restricted_config)' in case
          assert 'let mut app_server = crate::start_embedded_app_server_for_picker(&restricted_config).await?;' in case
          dispatch=(root/'codex-rs/tui/src/app/event_dispatch.rs').read_text()
          assert 'AppEvent::ApiKeyCompatModelsLoaded' in dispatch
          assert 'constrain_api_key_models(' in dispatch
          assert 'result: Ok(checked.await)' in dispatch
          snapshots=root/'codex-rs/tui/src/app/snapshots'
          for name in ['daemon_menu','daemon_disconnected','daemon_no_cli_handoff','daemon_remote_guidance','daemon_unpackaged_cli']:
            snap=(snapshots/('codex_tui__app__daemon_menu__tests__'+name+'.snap')).read_text()
            assert 'Restart background server' in snap
          daybreak=(root/'codex-rs/tui/src/chatwidget/snapshots/codex_tui__chatwidget__tests__slash_daybreak_api_key_help.snap').read_text()
          assert 'Enable broader access for cybersecurity work' in daybreak
          daemon_tests=(root/'codex-rs/tui/src/app/daemon_menu_tests.rs').read_text()
          assert 'InstallContext::current()' in daemon_tests
          assert '.map_or_else(\n' in daemon_tests
          assert '                    |manifest| manifest.version.to_string(),' in daemon_tests
          assert 'confirmation.contains(&actual)' in daemon_tests
          assert 'confirmation = confirmation.replace(&actual, "Use this CLI package v0.0.0 from ");' in daemon_tests
          runner=(root/'.github/scripts/codexdd-045-3f68-run-native-tests.ps1').read_text()
          assert 'PASS: PRECOMPILE_TUI_LIB' in runner
          assert '$failedSelectors += $selector' in runner
          assert 'Incomplete 25-selector native receipt' in runner
          files=list((root/'codex-rs/tui/src').rglob('*.rs'))
          texts=[p.read_text(encoding='utf-8') for p in files]
          seen=set()
          for item in spec['cases']['tui']:
            selector=item['selector']
            assert re.fullmatch(r'[a-z][a-z0-9_]+',selector)
            assert selector not in seen and item['rationale']
            seen.add(selector)
            pattern=re.compile(r'\b(?:async\s+)?fn\s+'+re.escape(selector)+r'\s*\(')
            hits=sum(len(pattern.findall(s)) for s in texts)
            assert hits==1,(selector,hits)
          print('PASS: 25 unique TUI selectors, public account lifecycle test API, 13 holds, 0 approvals')
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - name: Rustfmt only; do not compile on cheap preflight
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Parse native PowerShell without running Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $t=$null;$e=$null
          [System.Management.Automation.Language.Parser]::ParseFile('.github/scripts/codexdd-045-3f68-run-native-tests.ps1',[ref]$t,[ref]$e) | Out-Null
          if ($e.Count -ne 0) { $e | ForEach-Object { Write-Error $_ }; throw 'Native acceptance script syntax failed' }
          Write-Host 'PASS: one-shot source and native-selector preflight; Rust not compiled'

  windows-native:
    needs: cheap-source
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout exact reviewed source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm exact Git commit and secured immutable Rust graph
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Native source HEAD changed' }
          if ((git rev-parse 'HEAD:codex-rs/Cargo.lock').Trim() -cne '13bc15ff844e93dfaf7777c73bb7313b35bb3b81') { throw 'Cargo.lock drift' }
          if ((git rev-parse 'HEAD:codex-rs/Cargo.toml').Trim() -cne 'cfebd9b784ef9ff027b274aa9f7101c9c2496613') { throw 'Cargo.toml drift' }
          if ((git rev-parse 'HEAD:codex-rs/deny.toml').Trim() -cne 'f282c7c55d05201e308e60804f85754c8522d462') { throw 'Security policy drift' }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Production marker prematurely changed' }
          if ((Get-Content codex-rs/upstream-codex-release.txt -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Upstream marker prematurely changed' }
          if (git status --porcelain --untracked-files=no) { throw 'Tracked file drift' }
      - name: Setup bounded scratch and long Windows paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP 'codexdd045-3f68'
          New-Item -ItemType Directory -Force -Path (Join-Path $base 'target'),(Join-Path $base 'tmp'),(Join-Path $base 'logs') | Out-Null
          @(
            "CARGO_TARGET_DIR=$(Join-Path $base 'target')"
            "TEMP=$(Join-Path $base 'tmp')"
            "TMP=$(Join-Path $base 'tmp')"
            "CI_BUILD_ROOT=$base"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
          ) | Add-Content $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Install DotSlash for locked source tools
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Try cached Cargo sources only, never cache massive debug binary outputs
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-3f68-registry-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            codexdd045-3f12-source-
            codexdd045-crypto-msvc-
      - name: Configure repository-pinned Windows Rusty V8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Run 25 TUI native acceptance selectors without false greens
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .github/scripts/codexdd-045-3f68-run-native-tests.ps1 -ExpectedHead $env:GITHUB_SHA -Group Tui -LogRoot (Join-Path $env:RUNNER_TEMP 'codexdd045-3f68/logs')
          if ($LASTEXITCODE -ne 0) { throw 'One or more exact-source native acceptance cases failed' }
      - name: Always upload narrow Core/TUI native case logs and nonrelease receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f68-tui-native-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/codexdd045-3f68/logs/*
          if-no-files-found: warn
          compression-level: 3
          retention-days: 7
