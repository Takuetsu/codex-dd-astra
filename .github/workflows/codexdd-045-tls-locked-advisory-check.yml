# Read-only preview of precisely four inherited RustSec maintenance exceptions.
# A green PREVIEW is NOT a release waiver: the unmodified cargo-deny policy still governs.
name: CodexDD 0.4.5 patched TLS lock audit (nonrelease)

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-tls-root-security-remediation
    paths:
      - '.github/workflows/codexdd-045-tls-locked-advisory-check.yml'
      - 'codex-rs/Cargo.lock'

permissions:
  contents: read

jobs:
  isolated-advisory-preview:
    name: Temporary all-target advisory disposition probe (NONRELEASE)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-tls-root-security-remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read exact source without persisting credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Assert accepted lock, unchanged all-target policy and unreleased markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object codex-rs/Cargo.toml)" = 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'a6cd27b0b70fde2f2be9c1777f3666ad3fa318bb'
          test "$(git hash-object codex-rs/deny.toml)" = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test ! -e codex-rs/deny-preview.toml
          test -z "$(git status --porcelain)"
          echo 'PASS: approved lock and actual deny.toml unchanged'

      - name: Unmodified all-target baseline (may remain RED)
        id: baseline
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Construct scratch-only four-ID preview with strict TOML invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          source = pathlib.Path("codex-rs/deny.toml")
          preview = pathlib.Path("codex-rs/deny-preview.toml")
          raw = source.read_text(encoding="utf-8")
          baseline = tomllib.loads(raw)
          cargo = tomllib.loads(pathlib.Path("codex-rs/Cargo.lock").read_text(encoding="utf-8"))
          packages = cargo["package"]
          targets = {
              "rustls-webpki": "0.103.16",
              "webpki-roots": "1.0.10",
              "webpki-root-certs": "1.0.10",
          }
          for name, version in targets.items():
              matches = [p for p in packages if p["name"] == name]
              if len(matches) != 1 or matches[0]["version"] != version:
                  raise SystemExit("BLOCKED: patched TLS dependency mismatch: " + name)
          for name,version in (
              ("rustls", "0.23.46"),
              ("quinn-proto", "0.11.18"),
              ("noyalib-serde-yaml", "0.0.57"),
              ("zip", "9.0.5"),
          ):
              if not any(p["name"] == name and p["version"] == version for p in packages):
                  raise SystemExit("BLOCKED: protected dependency pin changed: " + name)
          print("PASS: three patched TLS security crate versions; retained security pins")
          ids = (
              "RUSTSEC-2026-0374",
              "RUSTSEC-2026-0371",
              "RUSTSEC-2026-0370",
              "RUSTSEC-2026-0372",
          )
          existing = [row["id"] for row in baseline["advisories"]["ignore"]]
          if len(set(existing)) != len(existing) or any(a in existing for a in ids):
              raise SystemExit("BLOCKED: unexpected existing advisory ignore IDs")
          start = raw.index("ignore = [", raw.index("[advisories]"))
          end = raw.index("\n]", start)
          added = "".join(
              f'\n    {{ id = "{advisory}", reason = "NONRELEASE PREVIEW ONLY; owner security acceptance and expiry pending" }},'
              for advisory in ids
          )
          trial = raw[:end] + added + raw[end:]
          parsed = tomllib.loads(trial)
          actual = [row["id"] for row in parsed["advisories"]["ignore"]]
          if actual != existing + list(ids):
              raise SystemExit("BLOCKED: preview ignore scope differs from exactly four IDs")
          for section in ("graph", "output", "licenses", "bans", "sources"):
              if parsed.get(section) != baseline.get(section):
                  raise SystemExit("BLOCKED: changed non-advisory policy " + section)
          for key in baseline["advisories"]:
              if key != "ignore" and parsed["advisories"].get(key) != baseline["advisories"].get(key):
                  raise SystemExit("BLOCKED: changed extra advisory policy option")
          preview.write_text(trial, encoding="utf-8")
          if subprocess.run(["git", "diff", "--quiet", "--", str(source)]).returncode:
              raise SystemExit("BLOCKED: actual deny.toml mutated")
          print("PASS: scratch policy adds only four INFO/unmaintained advisory IDs")
          PY

      - name: Preview all-target audit against scratch policy only
        id: preview
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features
          command-arguments: --config ./codex-rs/deny-preview.toml

      - name: Delete scratch policy and prove repository clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f codex-rs/deny-preview.toml
          test "$(git hash-object codex-rs/deny.toml)" = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'a6cd27b0b70fde2f2be9c1777f3666ad3fa318bb'
          test -z "$(git status --porcelain)"
          echo "Original all-target audit: ${{ steps.baseline.outcome }}"
          echo "Temporary four-ID preview: ${{ steps.preview.outcome }}"
          echo "No waiver, release acceptance, production edit, or publication authorized."
