# One-shot, bounded GitHub source audit. NO cargo, Bazel, Windows compilation or release.
name: CodexDD 0.4.5 3F.51 schema, protocol, core/TUI upstream delta audit (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f51-schema-protocol-core-tui]
    paths: [".github/workflows/codexdd-045-3f51-source-review.yml"]
permissions:
  contents: read
jobs:
  source-only:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '90d82a5eb1fd446b8305ce658d74809cdcff872e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source-frozen branch, no credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reconstructed upstream source and cross-language generated transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f51_exact_upstream_semantic_deltas.py' -v
          python3 -B -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f51_generated_protocol_parity.py' -v
          python3 -B -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f51_appserver_event_semantics.py' -v
          python3 -B -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f50_scoped_owner_review.py' -q
          python3 -B -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f50_distribution_gate.py' -q
          python3 -B scripts/codexdd_045_distribution_gate.py --source-only
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Nonrelease scope statement
        shell: bash
        run: |
          echo 'PASS: Source-only checks, ten upstream reverse-delta Git blobs, 86/88 generated method contract'
          echo 'NOT RUN: native Rust, schema regeneration, Daniel-CL 21 stages, production build or install'
