# Isolated analysis of the Windows Bazel release-profile graph; nonrelease.
# No Microsoft SDK/EULA acceptance, package build, install, PR or ref writes.
name: CodexDD 0.4.5 Windows Bazel release analysis

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - ".github/workflows/codexdd-045-windows-bazel-release-analysis.yml"
      - "patches/zstd-sys_windows_msvc_include_dirs.patch"

permissions:
  contents: read

concurrency:
  group: codexdd-045-bazel-release-analysis
  cancel-in-progress: true

jobs:
  native-release-analysis:
    name: Windows MSVC release transition graph (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout immutable integration SHA without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require exact nonrelease branch, source graph and unchanged security floor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Takuetsu/codex-dd-astra') { throw 'Wrong repository' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration') { throw 'Wrong branch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected HEAD' }
          $expected = @{
            'MODULE.bazel' = 'd178d9882169a5c06e42869338c99c4300e4e791'
            'MODULE.bazel.lock' = '40c46197d71c93d3ea7fbdea1930c9bf394ae6df'
            'patches/zstd-sys_windows_msvc_include_dirs.patch' = '866a458a2df4dd0d565f8066deadf73e2fdf8176'
            'defs.bzl' = 'b2f384d0687cbb81d0c2e8a257cc3d0d6aa469a4'
            'codex-rs/Cargo.toml' = 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4'
            'codex-rs/Cargo.lock' = 'a6cd27b0b70fde2f2be9c1777f3666ad3fa318bb'
            'codex-rs/deny.toml' = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          }
          foreach ($path in $expected.Keys) {
            if ((git rev-parse ("HEAD:" + $path)).Trim() -ne $expected[$path]) {
              throw "Unreviewed source identity: $path"
            }
          }
          if ((Get-Content 'codex-rs/codexdd-version.txt' -Raw).Trim() -ne '0.4.4') {
            throw 'Version marker advanced before acceptance'
          }
          if ((Get-Content 'codex-rs/upstream-codex-release.txt' -Raw).Trim() -ne 'rust-v0.162.0') {
            throw 'Upstream release marker advanced before acceptance'
          }
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock defs.bzl patches/zstd-sys_windows_msvc_include_dirs.patch codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/deny.toml
          if ($LASTEXITCODE -ne 0) { throw 'Protected working tree is modified' }
          if ($env:BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA) {
            throw 'Unexpected external MSVC runtime license override'
          }
          Write-Host 'PASS: pinned source, lock and no-release identity'

      - name: Install pinned Bazelisk and repository Bazel 9.2.0
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1

      - name: Expose preinstalled GitHub-hosted MSVC developer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Hosted VS discovery missing' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Hosted MSVC C++ toolchain missing' }
          $vsDevCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd)) { throw 'VsDevCmd missing' }
          $names = @('PATH','INCLUDE','LIB','LIBPATH','SystemRoot','WindowsSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsSDKVersion')
          $values = & cmd.exe /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $vsDevCmd)
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize preinstalled MSVC environment' }
          foreach ($line in $values) {
            if ($line -match '^(.*?)=(.*)$' -and $names -contains $matches[1]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          Write-Host 'PASS: preinstalled MSVC environment resolved; no EULA acceptance or SDK download performed'

      - name: Analyze native Windows MSVC CLI release transition then combined archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'codexdd045-bazel-release-analysis'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          function Invoke-FocusedBazel {
            param([string]$Name, [string[]]$BazelArgs, [string]$ExpectedLabel)
            $log = Join-Path $diagnostics ($Name + '.log')
            Write-Host "BEGIN: $Name"
            $ErrorActionPreference = 'Continue'
            & bazel @BazelArgs *> $log
            $rc = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 85 }
            if ($rc -ne 0) { throw "BLOCKED: $Name exit=$rc (see uploaded log)" }
            if ($ExpectedLabel -and -not (Select-String -LiteralPath $log -Pattern ([regex]::Escape($ExpectedLabel)) -Quiet)) {
              throw "No configured target matched: $ExpectedLabel"
            }
          }
          $bazelVersion = & bazel --version
          if ($LASTEXITCODE -ne 0 -or $bazelVersion -notmatch 'bazel 9\.2\.0') {
            throw "Unreviewed Bazel version: $bazelVersion"
          }
          $startup = @('--noexperimental_remote_repo_contents_cache')
          Invoke-FocusedBazel 'strict-lock' ($startup + @('mod','deps','--lockfile_mode=error')) ''
          $profile = @(
            '--lockfile_mode=error',
            '--config=ci-windows-msvc',
            '--platforms=//:windows_x86_64_msvc',
            '--//codex-rs:runtime_package_build_mode=debug',
            '--output=label'
          )
          Invoke-FocusedBazel 'cli-release-files' ($startup + @('cquery') + $profile + @('//codex-rs/cli:release_files')) '//codex-rs/cli:release_files'
          Invoke-FocusedBazel 'combined-runtime-archive' ($startup + @('cquery') + $profile + @('//codex-rs:runtime_package_combined')) '//codex-rs:runtime_package_combined'
          Write-Host 'PASS: native Windows release-profile graph analysis (NOT binary compilation or packaging)'
          if ((git status --porcelain --untracked-files=no)) { throw 'Source/lock drift in analysis' }

      - name: Upload only release analysis diagnostics, never binaries or credentials
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-windows-release-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexdd045-bazel-release-analysis/*.log
          if-no-files-found: warn
          retention-days: 7
