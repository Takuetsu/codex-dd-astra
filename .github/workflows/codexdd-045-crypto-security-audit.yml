# Exact-source 0.4.5 crypto security, original all-target policy; nonrelease.
name: CodexDD 0.4.5 integrated crypto original cargo-deny (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-crypto-integrated-staging]
    paths: [".github/workflows/codexdd-045-crypto-security-audit.yml"]
permissions:
  contents: read
jobs:
  static-crypto-guard:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '8d520f34d4268167e9c6d4db57223af5ffa24dd5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require exact committed Cargo and source identity
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/Cargo.lock)" = "13bc15ff844e93dfaf7777c73bb7313b35bb3b81"
          test "$(git hash-object codex-rs/Cargo.toml)" = "cfebd9b784ef9ff027b274aa9f7101c9c2496613"
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          python3 -m py_compile scripts/codexdd-045-inherited-risk-guard.py scripts/codexdd-045-dependency-security-check.py
          python3 scripts/codexdd-045-inherited-risk-guard.py
          python3 scripts/codexdd-045-dependency-security-check.py --mode staging
          git diff --exit-code
          echo 'PASS: immutable source guard; no waiver, release or nonreviewed security policy changes'
  original-all-target-cargo-deny:
    needs: static-crypto-guard
    if: github.repository == 'Takuetsu/codex-dd-astra'
    uses: ./.github/workflows/cargo-deny.yml
