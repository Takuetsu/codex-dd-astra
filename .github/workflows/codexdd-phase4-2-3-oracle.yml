name: CodexDD Phase 4.2-4.3 oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-phase4-2-3-oracle.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Exact format check
        shell: pwsh
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Infrastructure failure cannot authorize repair
        shell: pwsh
        run: cargo test -p codex-tui --lib infrastructure_validation_failure_cannot_authorize_source_repair
      - name: Changed fingerprint consumes global cycle two
        shell: pwsh
        run: cargo test -p codex-tui --lib second_repair_with_changed_fingerprint_consumes_global_cycle_two
