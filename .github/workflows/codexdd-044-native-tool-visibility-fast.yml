# Isolated, cheap Windows contract check for the Oct 14 native validator diagnosis.
# No Rust compilation, Node tests, native work_packet or release suite.
name: CodexDD 0.4.4 native tool visibility fast gate

on:
  push:
    branches:
      - dd/codexdd-0.4.4-native-tool-direct-guidance
    paths:
      - .github/workflows/codexdd-044-native-tool-visibility-fast.yml
      - codex-rs/core/src/tools/spec_plan_tests.rs
      - codex-rs/tui/src/chatwidget/adaptive_admission.rs

permissions:
  contents: read

concurrency:
  group: codexdd-044-native-visibility-fast
  cancel-in-progress: true

jobs:
  windows-static:
    name: Windows Rust format and protected-validator contract
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check SHA ancestry and precise scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'a79378618728a5ad63fbf7b204ae9a0ea1fecb29'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Validated PR #53 candidate is not ancestor' }
          $allowed = @(
            '.github/workflows/codexdd-044-native-tool-visibility-fast.yml'
            'codex-rs/core/src/tools/spec_plan_tests.rs'
            'codex-rs/tui/src/chatwidget/adaptive_admission.rs'
          )
          $changes = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect diff' }
          foreach ($name in $changes) {
            if ($allowed -notcontains $name) { throw "Unexpected modified source: $name" }
          }
          if ($changes.Count -ne $allowed.Count) { throw 'Unexpected candidate change set' }
          $identity = (Get-Content -Raw codex-rs/codexdd-version.txt).Trim()
          if ($identity -ne '0.4.4') { throw "Wrong candidate version $identity" }

      - name: Verify protected direct-only tool contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content -Raw codex-rs/core/src/tools/spec_plan.rs
          $registry = Get-Content -Raw codex-rs/core/src/tools/registry.rs
          $tests = Get-Content -Raw codex-rs/core/src/tools/spec_plan_tests.rs
          $continuations = Get-Content -Raw codex-rs/tui/src/chatwidget/adaptive_admission.rs
          if (-not $plan.Contains('if turn_trigger.as_deref() == Some(CODEXDD_ADAPTIVE_MECHANICAL_VALIDATION_TURN_TRIGGER)')) {
            throw 'Protected registration trigger missing'
          }
          if (-not $plan.Contains('registry.add_with_exposure(CodexDDValidationHandler, ToolExposure::DirectModelOnly)')) {
            throw 'Native validator did not retain direct-model-only exposure'
          }
          if (-not $registry.Contains('adaptive_mechanical_validation_rejection')) {
            throw 'Mechanical validation dispatch guard missing'
          }
          if (-not $tests.Contains('codexdd_validation_is_direct_only_in_code_mode_only_mechanical_turn')) {
            throw 'Missing Code Mode-only regression test'
          }
          foreach ($required in @('ToolMode::CodeModeOnly','ToolExposure::DirectModelOnly','assert_visible_lacks','run_codexdd_validation')) {
            if (-not $tests.Contains($required)) { throw "Regression test lacks $required" }
          }
          if (-not $continuations.Contains('direct top-level built-in run_codexdd_validation')) {
            throw 'Mechanical continuation lacks direct-tool guidance'
          }
          if (-not $continuations.Contains('NOT through code_mode exec or a nested tool call')) {
            throw 'Mechanical continuation lacks nested-tool warning'
          }
          Write-Host 'PROTECTED_VALIDATOR_DIRECT_ONLY_STATIC_PASS'

      - name: Install pinned Rust formatting toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Fail-fast Rust workspace formatting check
        working-directory: codex-rs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format check failed' }

      - name: Verify source remained clean
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { $dirty | Write-Host; throw 'Static check modified checkout' }
