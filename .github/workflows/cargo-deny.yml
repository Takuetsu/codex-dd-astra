name: cargo-deny

on:
  workflow_call:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Enforce expiry, target reachability and RustSec classification of approved INFO exceptions
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path Cargo.toml --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/codexdd045-info-windows.json"
          cargo metadata --manifest-path Cargo.toml --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/codexdd045-info-linux.json"
          python3 ../scripts/codexdd-045-inherited-risk-guard.py \
            --windows-metadata "$RUNNER_TEMP/codexdd045-info-windows.json" \
            --linux-metadata "$RUNNER_TEMP/codexdd045-info-linux.json" \
            --check-db

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
