# Exact-byte TLS lock candidate smoke on a disposable validation branch only.
# Not a release job; advisory disposition, install and marker promotion remain blocked.
name: CodexDD 0.4.5 patched TLS Windows regression (nonrelease)

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-tls-lock-windows-validation
    paths:
      - '.github/workflows/codexdd-045-tls-lock-windows-focused.yml'
      - 'codex-rs/Cargo.lock'

permissions:
  contents: read

jobs:
  patched-tls-windows:
    name: Native Windows HTTP TLS certificate regressions (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-tls-lock-windows-validation' && github.event.before == 'ff6a9a41eb4af1733ded73562aa04410ccc2f06a'
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_MIN_STACK: '16777216'
    steps:
      - name: Checkout exact candidate, no saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify source ancestry, three-crate lock and unchanged security floor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected checkout commit' }
          if ((git rev-parse HEAD^).Trim() -ne 'ff6a9a41eb4af1733ded73562aa04410ccc2f06a') { throw 'Unexpected one-shot parent' }
          $expected = @{
            'codex-rs/Cargo.toml' = 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4'
            'codex-rs/Cargo.lock' = 'a6cd27b0b70fde2f2be9c1777f3666ad3fa318bb'
            'codex-rs/deny.toml' = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          }
          foreach ($file in $expected.Keys) {
            $actual = (git hash-object -- $file).Trim()
            if ($actual -ne $expected[$file]) { throw "Unreviewed file $file has blob $actual" }
          }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Premature product marker' }
          if ((Get-Content codex-rs/upstream-codex-release.txt -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Premature upstream marker' }
          if (Test-Path codex-rs/deny-preview.toml) { throw 'Temporary advisory waiver leaked into source' }
          if (git status --porcelain) { throw 'Unclean candidate source' }
          Write-Host 'PASS: exact patched TLS lock, unchanged all-target deny policy and release markers'

      - name: Configure isolated Windows build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'codexdd045-tls'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CI_BUILD_ROOT=$root"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Windows long paths unavailable' }

      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Cache registry sources only, not unreviewed build products
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-tls-registry-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            codexdd045-tls-registry-${{ runner.os }}-

      - name: Verify locked dependency graph
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo graph invalid' }

      - name: Run only native Windows HTTP certificate and TLS regressions
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'codexdd045-tls-native.log'
          $command = 'cargo test --locked -p codex-http-client --lib tls -- --test-threads=1 > "' + $log + '" 2>&1'
          & cmd.exe /d /c $command
          $rc = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log)) { throw 'Missing HTTP TLS test log' }
          $tail = (Get-Content -LiteralPath $log -Tail 160) -join "`n"
          Write-Host $tail
          if ($rc -ne 0) { throw "Native TLS regressions failed ($rc); inspect uploaded log" }
          if ($tail -notmatch '(?m)^test result: ok\.\s+[1-9][0-9]* passed; 0 failed;') {
            throw 'No positive, zero-failure TLS test summary found'
          }
          Write-Host 'PASS: native Windows TLS regression filter on exact patched lock; security disposition still OPEN'

      - name: Verify no tracked source or security policy was modified
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git hash-object -- codex-rs/Cargo.lock).Trim() -ne 'a6cd27b0b70fde2f2be9c1777f3666ad3fa318bb') { throw 'Cargo.lock drift' }
          if ((git hash-object -- codex-rs/deny.toml).Trim() -ne 'ea7fdc149fc880c6b36d75c29851641034289a4e') { throw 'Security policy drift' }
          if (git status --porcelain) { throw 'Tracked or untracked source changed' }

      - name: Preserve focused Windows diagnostic log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-tls-patched-windows
          path: ${{ runner.temp }}/codexdd045-tls-native.log
          if-no-files-found: warn
          retention-days: 7
