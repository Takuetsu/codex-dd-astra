# One-shot source-only owner reconciliation. Never release, compile Rust, or change production.
name: CodexDD 0.4.5 core history fork semantics source-only (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f29-history-semantic-source.yml"]
permissions:
  contents: read
jobs:
  source-only:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '49bc278dfe31408f05c7bde949b6857f196d0984'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify pinned source, secure workspace and intentional fork semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '49bc278dfe31408f05c7bde949b6857f196d0984'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f29_history_semantics.py' -v
          test -z "$(git status --porcelain)"
