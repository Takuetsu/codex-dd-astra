name: upstream-codex-discovery

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Exact official stable tag (blank selects newest)
        required: false
        type: string
        default: ""
      expected_target_sha:
        description: Required peeled commit SHA with target_tag
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: upstream-codex-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover official Codex release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dd/astra-policy-v2
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve stable official release
        id: release
        shell: bash
        env:
          REQUESTED_TARGET_TAG: ${{ inputs.target_tag || '' }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha || '' }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/openai/codex.git
          git fetch upstream --tags --force --prune

          # Query canonical upstream refs rather than trusting origin/local tags.
          latest_tag="$(
            git ls-remote --tags --refs upstream 'refs/tags/rust-v*' |
              awk '{ if (index($2, "refs/tags/") == 1) print substr($2, 11) }' |
              python3 .github/scripts/upstream_sync.py \
                --latest-from-stdin --target-tag "$REQUESTED_TARGET_TAG"
          )"
          current_tag="$(tr -d '[:space:]' < codex-rs/upstream-codex-release.txt)"

          # The tracked baseline must also resolve in the official repository.
          if ! git ls-remote --exit-code --tags --refs upstream "refs/tags/$current_tag" >/dev/null; then
            echo "Tracked upstream release is not an official reachable tag: $current_tag" >&2
            exit 1
          fi

          # Explicitly pinned discovery must not fall back to latest or use a
          # tag with a different peeled commit than the owner selected.
          if [[ -n "$REQUESTED_TARGET_TAG" ]]; then
            if [[ ! "$EXPECTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Pinned discovery requires the exact lowercase 40-character commit SHA." >&2
              exit 1
            fi
            echo "selection_mode=pinned" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$EXPECTED_TARGET_SHA" ]]; then
              echo "A target SHA without a target tag is invalid." >&2
              exit 1
            fi
            echo "selection_mode=latest" >> "$GITHUB_OUTPUT"
          fi

          # A canonical tag NAME match is insufficient: verify both ref
          # object IDs (annotated tag objects or lightweight commit IDs).
          for tag in "$current_tag" "$latest_tag"; do
            canonical_oid="$(git ls-remote --exit-code --tags --refs upstream "refs/tags/$tag" | awk '{print $1}')"
            local_oid="$(git rev-parse "refs/tags/$tag")"
            if [[ -z "$canonical_oid" || "$local_oid" != "$canonical_oid" ]]; then
              echo "Canonical official tag ref differs from local fetched ref: $tag" >&2
              exit 1
            fi
          done

          # The expected pinned SHA is the peeled commit, never a tag object.
          if [[ -n "$REQUESTED_TARGET_TAG" ]]; then
            selected_commit="$(git rev-parse "${latest_tag}^{commit}")"
            if [[ "$selected_commit" != "$EXPECTED_TARGET_SHA" ]]; then
              echo "Pinned target mismatch: expected $EXPECTED_TARGET_SHA; got $selected_commit" >&2
              exit 1
            fi
          fi

          set +e
          python3 - "$current_tag" "$latest_tag" <<'PY'
          import sys

          sys.path.insert(0, ".github/scripts")
          from upstream_sync import stable_release_version

          current, latest = sys.argv[1:]
          current_version = stable_release_version(current)
          latest_version = stable_release_version(latest)
          if current_version is None:
              raise SystemExit(f"invalid tracked stable upstream release: {current}")
          if latest_version is None:
              raise SystemExit(f"invalid discovered stable upstream release: {latest}")
          if latest_version <= current_version:
              raise SystemExit(2)
          PY
          compare_status=$?
          set -e

          if [[ "$compare_status" -eq 2 ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"
            echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$compare_status" -ne 0 ]]; then
            exit "$compare_status"
          fi

          production_sha="$(git rev-parse HEAD)"
          current_sha="$(git rev-parse "${current_tag}^{commit}")"
          latest_sha="$(git rev-parse "${latest_tag}^{commit}")"

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "production_sha=${production_sha}" >> "$GITHUB_OUTPUT"
          echo "current_sha=${current_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_sha=${latest_sha}" >> "$GITHUB_OUTPUT"

      - name: Record up-to-date state
        if: steps.release.outputs.needed != 'true'
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.release.outputs.current_tag }}
          LATEST_TAG: ${{ steps.release.outputs.latest_tag }}
        run: |
          {
            echo "## CodexDD upstream discovery"
            echo
            echo "No newer selected official stable release was found relative to the tracked baseline."
            echo
            echo "- Tracked upstream: ${CURRENT_TAG}"
            echo "- Selected official stable release: ${LATEST_TAG}"
            echo
            echo "This discovery workflow is read-only and made no repository changes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build candidate manifest and dry-run transplant
        if: steps.release.outputs.needed == 'true'
        id: candidate
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.release.outputs.current_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.latest_tag }}
          PRODUCTION_SHA: ${{ steps.release.outputs.production_sha }}
          CURRENT_SHA: ${{ steps.release.outputs.current_sha }}
          RELEASE_SHA: ${{ steps.release.outputs.latest_sha }}
          SELECTION_MODE: ${{ steps.release.outputs.selection_mode }}
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/upstream-candidate"
          manifest_path="$output_dir/manifest.json"
          conflict_path="$output_dir/transplant-conflicts.txt"
          dry_run_dir="$RUNNER_TEMP/upstream-candidate-dry-run"
          mkdir -p "$output_dir"

          product_version="$(tr -d '[:space:]' < codex-rs/codexdd-version.txt)"
          production_tree="$(git rev-parse "${PRODUCTION_SHA}^{tree}")"
          current_tree="$(git rev-parse "${CURRENT_SHA}^{tree}")"
          release_tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"

          merge_base="$(git merge-base "$CURRENT_SHA" "$RELEASE_SHA" || true)"
          if git merge-base --is-ancestor "$CURRENT_SHA" "$RELEASE_SHA"; then
            ancestry_status="target_descends_from_tracked"
          else
            ancestry_status="diverged"
          fi

          export GIT_AUTHOR_NAME="codexdd-upstream-planner"
          export GIT_AUTHOR_EMAIL="codexdd-upstream-planner@example.invalid"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          synthetic_delta="$(
            printf '%s\n' "codexdd customization delta from ${CURRENT_TAG}" |
              git commit-tree "$production_tree" -p "$CURRENT_SHA"
          )"

          git worktree add --detach "$dry_run_dir" "$RELEASE_SHA"
          set +e
          git -C "$dry_run_dir" cherry-pick --no-commit "$synthetic_delta"             >"$RUNNER_TEMP/upstream-candidate-cherry-pick.log" 2>&1
          transplant_status=$?
          set -e

          if [[ "$transplant_status" -eq 0 ]]; then
            transplant_result="clean"
            : > "$conflict_path"
          else
            transplant_result="conflict"
            git -C "$dry_run_dir" diff --name-only --diff-filter=U |
              sed '/^$/d' > "$conflict_path"
          fi

          git -C "$dry_run_dir" reset --hard "$RELEASE_SHA" >/dev/null 2>&1 || true
          git worktree remove --force "$dry_run_dir"

          discovery_timestamp="$(
            python3 - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"))
          PY
          )"

          export DISCOVERY_TIMESTAMP="$discovery_timestamp"
          export PRODUCT_VERSION="$product_version"
          export PRODUCTION_TREE="$production_tree"
          export CURRENT_TREE="$current_tree"
          export RELEASE_TREE="$release_tree"
          export ANCESTRY_STATUS="$ancestry_status"
          export MERGE_BASE="$merge_base"
          export TRANSPLANT_RESULT="$transplant_result"
          export MANIFEST_PATH="$manifest_path"

          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from upstream_sync import (
              build_candidate_manifest,
              candidate_manifest_json,
              git_tree_entries,
          )

          repo = Path(".")
          merge_base = os.environ["MERGE_BASE"] or None
          manifest = build_candidate_manifest(
              discovery_timestamp=os.environ["DISCOVERY_TIMESTAMP"],
              production_branch="dd/astra-policy-v2",
              production_sha=os.environ["PRODUCTION_SHA"],
              production_tree=os.environ["PRODUCTION_TREE"],
              codexdd_product_version=os.environ["PRODUCT_VERSION"],
              tracked_upstream_tag=os.environ["CURRENT_TAG"],
              tracked_upstream_sha=os.environ["CURRENT_SHA"],
              tracked_upstream_tree=os.environ["CURRENT_TREE"],
              target_upstream_tag=os.environ["RELEASE_TAG"],
              target_upstream_sha=os.environ["RELEASE_SHA"],
              target_upstream_tree=os.environ["RELEASE_TREE"],
              ancestry_status=os.environ["ANCESTRY_STATUS"],
              merge_base_sha=merge_base,
              tracked_entries=git_tree_entries(repo, os.environ["CURRENT_SHA"]),
              production_entries=git_tree_entries(repo, os.environ["PRODUCTION_SHA"]),
              target_entries=git_tree_entries(repo, os.environ["RELEASE_SHA"]),
              transplant_result=os.environ["TRANSPLANT_RESULT"],
          )
          Path(os.environ["MANIFEST_PATH"]).write_text(
              candidate_manifest_json(manifest),
              encoding="utf-8",
          )
          PY

          python3 - "$manifest_path" "$conflict_path" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          conflicts = [
              line
              for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
              if line
          ]

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## CodexDD upstream candidate\n\n")
              summary.write(f"- Candidate: {manifest['candidate_key']}\n")
              summary.write(f"- Selection mode: {os.environ['SELECTION_MODE']}\n")
              summary.write(f"- State: {manifest['state']}\n")
              summary.write(
                  f"- Production: {manifest['production_sha']} "
                  f"(CodexDD {manifest['codexdd_product_version']})\n"
              )
              summary.write(
                  f"- Tracked upstream: {manifest['tracked_upstream_tag']} "
                  f"({manifest['tracked_upstream_sha']})\n"
              )
              summary.write(
                  f"- Target upstream: {manifest['target_upstream_tag']} "
                  f"({manifest['target_upstream_sha']})\n"
              )
              summary.write(f"- Ancestry: {manifest['ancestry_status']}\n")
              summary.write(
                  f"- CodexDD customization paths: {manifest['customization_path_count']}\n"
              )
              summary.write(
                  f"- Upstream-changed paths: {manifest['upstream_change_path_count']}\n"
              )
              summary.write(f"- Overlap paths: {manifest['overlap_path_count']}\n")
              summary.write(
                  f"- Sensitive overlap paths: {manifest['sensitive_overlap_count']}\n"
              )
              summary.write(
                  f"- Synthetic transplant dry run: "
                  f"{manifest['transplant_dry_run']}\n"
              )
              if conflicts:
                  summary.write(f"- Textual conflict paths: {len(conflicts)}\n")
              summary.write("\n")
              summary.write(
                  "Discovery is read-only. No product version was allocated, "
                  "no branch or PR was created, and no production state was changed.\n"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"state={manifest['state']}\n")
              output.write(f"candidate_key={manifest['candidate_key']}\n")
              output.write(f"overlap_count={manifest['overlap_path_count']}\n")
              output.write(
                  f"sensitive_overlap_count={manifest['sensitive_overlap_count']}\n"
              )
          PY

      - name: Upload candidate evidence
        if: steps.release.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-candidate-${{ steps.release.outputs.latest_tag }}-${{ github.run_id }}
          path: upstream-candidate/
          if-no-files-found: error
          retention-days: 30
