rface-reconciliation.md","docs/codexdd-0.4.5-packet-3c9i-native-library-compile-checkpoint.md","docs/codexdd-0.4.5-packet-3d1-resolved-lockfile-acceptance.md","docs/codexdd-0.4.5-packet-3d2-protected-tui-test-reconciliation.md","docs/codexdd-0.4.5-packet-3d3-generated-schema-acceptance.md","docs/codexdd-0.4.5-packet-3d5-dependency-advisory-triage.md","docs/codexdd-0.4.5-packet-3d6-zip-remediation-recon.md","docs/codexdd-0.4.5-packet-3d7-inherited-advisory-release-decision.md","docs/codexdd-0.4.5-packet-3d8-overlap-audit.md","docs/codexdd-0.4.5-packet-3d8-tls-inherited-advisory-preview.md","docs/codexdd-0.4.5-packet-3d9-core-integration-test-reconciliation.md","docs/codexdd-0.4.5-packet-3e10-renamed-yaml-consumer-inventory.md","docs/codexdd-0.4.5-packet-3e8-bazel-cargo-rename-aliases.md","docs/codexdd-0.4.5-packet-3f1-overlap-source-inventory.md","docs/codexdd-0.4.5-packet-3f10-crypto-owner-closure.md","docs/codexdd-0.4.5-packet-3f11-current-109-semantic-review.md","docs/codexdd-0.4.5-packet-3f2-upstream-conflict-replay.md","docs/codexdd-0.4.5-packet-3f3-native-core-conflict-regressions.md","docs/codexdd-0.4.5-packet-3f4-native-tui-conflict-regressions.md","docs/codexdd-0.4.5-packet-3f7-dependency-security-closure.md","docs/codexdd-0.4.5-packet-3f8-inherited-maintenance-decision.md","docs/codexdd-0.4.5-packet-3f9-linux-info-risk-acceptance.md","docs/codexdd-roadmap.md"])
          changed = set(filter(None, subprocess.check_output([
              "git", "diff", "--name-only", "--diff-filter=ACMRT", "-z"
          ]).decode().split("\0")))
          # Prettier also formats this temporary one-shot workflow. It must
          # never be included in the staged 90-file commit; remove it afterward.
          ephemeral = ".github/workflows/codexdd-045-one-shot-prettier-only.yml"
          if ephemeral not in changed or changed - {ephemeral} != expected:
              raise SystemExit("Unexpected persistent Prettier diff; missing="
                  + repr(sorted(expected - changed)) + ", extra="
                  + repr(sorted(changed - expected - {ephemeral})))
          dirty = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"], text=True
          ).splitlines()
          if len(dirty) != 91 or any(row[:2].strip() != "M" for row in dirty):
              raise SystemExit("Unexpected worktree changes: " + repr(dirty))
          # Code fences are opaque source snippets; never accept a changed block.
          fence = re.compile(r"(?ms)^ *```[^\n]*\n(.*?)^ *```[^\n]*$")
          for p in sorted(expected):
              before = subprocess.check_output(["git", "show", "HEAD:" + p]).decode("utf-8")
              after = Path(p).read_text(encoding="utf-8")
              if p.endswith(".md"):
                  original_blocks = fence.findall(before)
                  updated_blocks = fence.findall(after)
                  if original_blocks != updated_blocks:
                      raise SystemExit("Markdown code-fence payload changed: " + p)
                  def outside_fences(text: str) -> str:
                      return fence.sub("[IMMUTABLE_CODE]", text)
                  # Preserves all nonwhitespace prose, links, symbols and table cells.
                  def normalized(text):
                      lines = []
                      for line in outside_fences(text).splitlines():
                          cols = [x.strip() for x in line.strip().strip("|").split("|")]
                          if len(cols) > 1 and all(re.fullmatch(r":?-{3,}:?", x) for x in cols):
                              lines.append("|".join((":" if x.startswith(":") else "") + "---" + (":" if x.endswith(":") else "") for x in cols))
                          else:
                              lines.append(line)
                      return re.sub(r"\s+", "", "\n".join(lines))
                  original = normalized(before)
                  updated = normalized(after)
                  if original != updated:
                      raise SystemExit("Markdown nonwhitespace content changed: " + p)
          for p, blob in {
