# One-shot source-only Prettier reconciliation of exactly 90 CI-listed docs/workflows.
# Fail-closed semantic YAML parser equality, Markdown content protection, no shipping.
name: CodexDD 0.4.5 audited 90-path Prettier-only repair (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-prettier-only-90]
    paths: ['.github/workflows/codexdd-045-one-shot-prettier-only.yml']
permissions:
  contents: write
jobs:
  formatter:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'b64602e8a8a2e03f80e53e6f1b38a3322a9d4f95'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 'b64602e8a8a2e03f80e53e6f1b38a3322a9d4f95'
      EXPECTED_BRANCH: 'dd/codexdd-v0.4.5-prettier-only-90'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact isolated formatter source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Verify source, reviewed cargo graph and original release markers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object codex-rs/Cargo.toml)" = cfebd9b784ef9ff027b274aa9f7101c9c2496613
          test "$(git hash-object codex-rs/Cargo.lock)" = 13bc15ff844e93dfaf7777c73bb7313b35bb3b81
          test "$(git hash-object codex-rs/deny.toml)" = f282c7c55d05201e308e60804f85754c8522d462
          test "$(git rev-parse HEAD:codex-rs/vendor/aws-config-1.13.0)" = 5b1db93de9e14ab5c060794d23a567d907b66f21
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = 0.4.4
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = rust-v0.162.0
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pinned Node.js and pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Install locked Prettier only
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/codexdd045-prettier-install.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/codexdd045-prettier-install.log"
            exit 1
          }
      - name: Apply repository default Prettier formatting without changing dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:fix > "$RUNNER_TEMP/codexdd045-prettier-fix.log" 2>&1 || {
            tail -n 120 "$RUNNER_TEMP/codexdd045-prettier-fix.log"
            exit 1
          }
          tail -n 16 "$RUNNER_TEMP/codexdd045-prettier-fix.log"
      - name: Inventory all Markdown transformations needing normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import re
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(["git","diff","--name-only","--","docs"],text=True).splitlines()
          fence = re.compile(r"(?ms)^ *```[^\n]*\n(.*?)^ *```[^\n]*$")
          def normalized(text):
              text=fence.sub("[CODE]",text)
              parts=[]
              for line in text.splitlines():
                  cols=[x.strip() for x in line.strip().strip("|").split("|")]
                  if len(cols)>1 and all(re.fullmatch(r":?-{3,}:?",x) for x in cols):
                      parts.append("|".join((":" if x.startswith(":") else "")+"---"+(":" if x.endswith(":") else "") for x in cols))
                  else:
                      parts.append(line)
              return re.sub(r"\s+","","\n".join(parts))
          mismatches=[]
          for path in paths:
              before=normalized(subprocess.check_output(["git","show","HEAD:"+path],text=True))
              after=normalized(Path(path).read_text(encoding="utf-8"))
              if before!=after:
                  mismatches.append(path)
                  op=next((o for o in difflib.SequenceMatcher(None,before,after,autojunk=False).get_opcodes() if o[0]!="equal"),None)
                  if op:
                      _,a,b,c,d=op
                      print("MISMATCH",path,"old",repr(before[max(0,a-50):b+65]),"new",repr(after[max(0,c-50):d+65]))
          print("TOTAL_MISMATCHES",len(mismatches),"OF",len(paths))
          PY
      - name: Diagnose first Markdown-only formatter escape change
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=4 -- docs/codexdd-0.4.5-packet-1a1-upstream-0.163.0-reconnaissance.md | head -n 180
      - name: Verify exact 90-file roster and Markdown content-preserving transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
