# 3F.94 NONRELEASE. Prove Windows Task Scheduler can create a genuine
# non-elevated detached child free from the GitHub Actions runner job.
# No Cargo compilation, daemon or production installation is attempted.
name: CodexDD 0.4.5 3F.94 scheduled-task breakaway capability (NONRELEASE)
run-name: 3F.94 Cheap Windows detached-launch capability (NONRELEASE)
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-3f94-windows-managed-supervisor
    paths:
      - .github/workflows/codexdd-045-3f94-scheduled-task-breakaway-probe.yml
permissions:
  contents: read
concurrency:
  group: codexdd045-3f94-task-capability
  cancel-in-progress: false
jobs:
  windows-breakaway-probe:
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Pin no-production-change source and parse Windows test scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Probe is not on expected source' }
          if ((git rev-parse HEAD:.github/scripts/test_codexdd_045_3f94_breakaway_child.ps1).Trim() -cne '2b90840564dffb234f9df2618b2f13d61874ef77') { throw 'Breakaway child source changed' }
          if ((git rev-parse HEAD:.github/scripts/test_codexdd_045_3f94_scheduled_breakaway_probe.ps1).Trim() -cne '7a5418f4778a520f85eacc676cd5980e50c30d1b') { throw 'Scheduled-task source changed' }
          if ((git rev-parse HEAD:codex-rs/app-server-daemon/src/backend/windows.rs).Trim() -cne '1cc1889712a5daa85642739bc9d17869967f8ac5') { throw 'Native daemon Windows policy changed' }
          if ((git rev-parse HEAD:codex-rs/Cargo.lock).Trim() -cne '13bc15ff844e93dfaf7777c73bb7313b35bb3b81') { throw 'Dependency lock changed' }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Production version changed' }
          foreach ($name in @('test_codexdd_045_3f94_breakaway_child.ps1', 'test_codexdd_045_3f94_scheduled_breakaway_probe.ps1')) {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path (Join-Path '.github/scripts' $name)).Path,[ref]$tokens,[ref]$errors
            )
            if ($errors.Count) { $errors | ForEach-Object { Write-Host $_ }; throw "Probe source syntax error: $name" }
          }
          Write-Host '3F.94 CHEAP BREAKAWAY SOURCE AND POWERSHELL AST GREEN'
      - name: Check task-launched standard account can create suspended breakaway child
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/test_codexdd_045_3f94_scheduled_breakaway_probe.ps1'
          if (-not $?) { throw 'Task Scheduler breakaway capability probe failed' }
