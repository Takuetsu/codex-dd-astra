name: CodexDD rustfmt oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-rustfmt-oracle.yml"
      - "codex-rs/**/*.rs"

permissions:
  contents: read

jobs:
  rustfmt-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Format exact 3C.2 Rust surface
        shell: bash
        run: |
          cd codex-rs
          rustfmt --edition 2024 \
            app-server-protocol/src/protocol/v2/thread.rs \
            app-server/src/request_processors/turn_processor.rs \
            core/src/tools/handlers/codexdd_validation.rs \
            core/src/tools/handlers/codexdd_validation_tests.rs \
            history/src/lib.rs \
            history/src/tests.rs \
            tui/src/adaptive_evidence.rs \
            tui/src/adaptive_evidence_tests.rs \
            tui/src/app_server_session.rs \
            tui/src/chatwidget/adaptive_admission.rs \
            tui/src/chatwidget/adaptive_effort.rs \
            tui/src/chatwidget/adaptive_trusted_signal.rs \
            tui/src/chatwidget/tests/adaptive_effort_tests.rs \
            tui/src/chatwidget/tests/adaptive_pressure_tests.rs \
            tui/src/session_state.rs
          git diff --no-ext-diff --src-prefix=a/ --dst-prefix=b/ -- \
            app-server-protocol/src/protocol/v2/thread.rs \
            app-server/src/request_processors/turn_processor.rs \
            core/src/tools/handlers/codexdd_validation.rs \
            core/src/tools/handlers/codexdd_validation_tests.rs \
            history/src/lib.rs \
            history/src/tests.rs \
            tui/src/adaptive_evidence.rs \
            tui/src/adaptive_evidence_tests.rs \
            tui/src/app_server_session.rs \
            tui/src/chatwidget/adaptive_admission.rs \
            tui/src/chatwidget/adaptive_effort.rs \
            tui/src/chatwidget/adaptive_trusted_signal.rs \
            tui/src/chatwidget/tests/adaptive_effort_tests.rs \
            tui/src/chatwidget/tests/adaptive_pressure_tests.rs \
            tui/src/session_state.rs > ../codexdd-rustfmt.patch
          if [ ! -s ../codexdd-rustfmt.patch ]; then
            printf 'NO_DIFF\n' > ../codexdd-rustfmt.patch
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codexdd-rustfmt-oracle
          path: codexdd-rustfmt.patch
          if-no-files-found: error
          retention-days: 1
