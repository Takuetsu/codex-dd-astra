# Temporary, pinned 3E.2 dependency identity alignment with official rust-v0.162.0.
# Remove immediately after output is verified. No release/production writes.
name: CodexDD 0.4.3 upstream lock alignment

on:
  push:
    branches:
      - dd/codexdd-v0.4.3-upstream-0.162.0-integration
    paths:
      - .github/workflows/codexdd-043-lockfile-upstream-align.yml

permissions:
  contents: write

concurrency:
  group: codexdd-043-lockfile-upstream-align
  cancel-in-progress: false

jobs:
  align-lock:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact isolated integration HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify unpromoted isolated identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.2'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.159.2'
          test -z "$(git status --porcelain)"
      - name: Configure repository build tools
        uses: ./.github/actions/setup-ci
      - name: Use pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Pin the two third-party versions to official 0.162 lockfile
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo update -p h2 --precise 0.4.19
          cargo update -p process-wrap --precise 10.0.0
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Independently compare all external package identities with pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/openai/codex/c1382380de69521303b416720a52f42d51af6248/codex-rs/Cargo.lock' -o "$RUNNER_TEMP/upstream-0162.lock"
          test "$(git hash-object "$RUNNER_TEMP/upstream-0162.lock")" = '1cee1174c2e937758713df47683521233a36b4f7'
          python3 - "$RUNNER_TEMP/upstream-0162.lock" codex-rs/Cargo.lock <<'PY'
          import sys, tomllib
          from pathlib import Path

          def external(path):
              data = tomllib.loads(Path(path).read_text())
              return {(p['name'], p['version'], p.get('source'), p.get('checksum'))
                      for p in data['package'] if p.get('source')}

          upstream, generated = map(external, sys.argv[1:])
          if upstream != generated:
              print('Missing external crates:', sorted(upstream - generated))
              print('Unexpected external crates:', sorted(generated - upstream))
              raise SystemExit('Generated dependency identities differ from official upstream target')
          print('Pinned 0.162 external dependency identities match:', len(upstream))
          PY
          test "$(git diff --name-only)" = 'codex-rs/Cargo.lock'
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check
          git diff --stat -- codex-rs/Cargo.lock
      - name: Commit only the generator-owned lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -- codex-rs/Cargo.lock
          test "$(git diff --cached --name-only)" = 'codex-rs/Cargo.lock'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(codexdd 0.4.3): align generated lock with upstream 0.162 external crates'
          git push origin 'HEAD:refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
