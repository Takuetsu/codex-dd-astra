name: CodexDD Phase 4.5 daemon oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-phase4-5-daemon-oracle.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Exact format check
        shell: pwsh
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Restrictive/elevated automatic fallback smoke
        shell: pwsh
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test -p codex-cli --test daemon_startup restrictive_launcher_uses_embedded_if_daemon_cannot_start -- --nocapture
