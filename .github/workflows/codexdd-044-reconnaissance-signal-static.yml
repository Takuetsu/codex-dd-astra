# Temporary 0.4.4 diagnostic: static validation only, no compilation or native Worker.
name: CodexDD 0.4.4 reconnaissance-signal static gate

on:
  push:
    branches:
      - dd/codexdd-0.4.4-native-tool-direct-guidance
    paths:
      - .github/workflows/codexdd-044-reconnaissance-signal-static.yml
      - codex-rs/core/src/tools/mod.rs
      - codex-rs/core/src/tools/spec_plan_tests.rs
      - codex-rs/tui/src/chatwidget/tests/adaptive_effort_tests.rs

permissions:
  contents: read

concurrency:
  group: codexdd-044-reconnaissance-signal-static
  cancel-in-progress: true

jobs:
  windows-contract:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact branch scope and trusted-turn mechanics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'a79378618728a5ad63fbf7b204ae9a0ea1fecb29'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Wrong checkout' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PR #53 source ancestry lost' }
          if ((Get-Content -Raw codex-rs/codexdd-version.txt).Trim() -ne '0.4.4') { throw 'Wrong release version' }
          $allowed = @(
            '.github/workflows/codexdd-044-reconnaissance-signal-static.yml',
            'codex-rs/core/src/tools/mod.rs',
            'codex-rs/core/src/tools/spec_plan_tests.rs',
            'codex-rs/tui/src/chatwidget/adaptive_admission.rs',
            'codex-rs/tui/src/chatwidget/protocol.rs',
            'codex-rs/tui/src/chatwidget/tests/adaptive_effort_tests.rs',
            'docs/codexdd-0.4.4-dd-bl-006-reconnaissance.md',
            'scripts/codexdd-test-release.ps1'
          )
          $changes = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Diff failed' }
          foreach ($name in $changes) {
            if ($allowed -notcontains $name) { throw "Unexpected file $name" }
          }
          if ($changes.Count -ne $allowed.Count) { throw "Expected exactly $($allowed.Count) files, found $($changes.Count)" }
          $mode = Get-Content -Raw codex-rs/core/src/tools/mod.rs
          $hold = Get-Content -Raw codex-rs/tui/src/chatwidget/protocol.rs
          $tests = Get-Content -Raw codex-rs/tui/src/chatwidget/tests/adaptive_effort_tests.rs
          $coreTests = Get-Content -Raw codex-rs/core/src/tools/spec_plan_tests.rs
          $registry = Get-Content -Raw codex-rs/core/src/tools/registry.rs
          if ($mode -notmatch 'CODEXDD_ADAPTIVE_RECONNAISSANCE_TURN_TRIGGER' -or $mode -notmatch 'CODEXDD_ADAPTIVE_MECHANICAL_VALIDATION_TURN_TRIGGER' -or $mode -notmatch 'return ToolMode::Direct') {
            throw 'Protected direct-mode routing missing'
          }
          if ($hold -match 'awaiting_initial_complexity' -or $hold -notmatch 'if !reported_adaptive_signal') {
            throw 'Prose-only reconnaissance could still wait indefinitely'
          }
          if ($tests -notmatch 'first_reconnaissance_without_trusted_tool_receipt_does_not_wait_forever' -or
              $coreTests -notmatch 'codexdd_protected_turns_force_direct_tools_without_widening_other_turns') {
            throw 'Focused regression coverage missing'
          }
          if ($registry -notmatch 'adaptive_reconnaissance_rejection' -or $registry -notmatch 'adaptive_mechanical_validation_rejection') {
            throw 'Read-only tool enforcement missing'
          }
          $script = Get-Content -Raw scripts/codexdd-test-release.ps1
          if ([regex]::Matches($script, 'New-CodexDDValidationStage -Name').Count -ne 21) {
            throw 'Changed 21-stage release contract'
          }
          if ($script -notmatch '"codex-cli", "-p", "codex-code-mode-host", "--release", "--locked"') {
            throw 'Required release companion build missing'
          }
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
          Write-Host 'RECONNAISSANCE_SIGNAL_BOUNDARY_STATIC_PASS'

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Cheap complete Rust formatting check
        shell: pwsh
        working-directory: codex-rs
        run: |
          & cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failure' }

      - name: Verify clean source
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) { $dirty | Write-Host; throw 'Source changed during check' }
