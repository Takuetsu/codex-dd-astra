          if (-not (Test-Path $dev)) { throw 'VsDevCmd absent' }
          $names=@('PATH','INCLUDE','LIB','LIBPATH','SystemRoot','WindowsSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsSDKVersion')
          $envlines=& cmd.exe /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $dev)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enter hosted MSVC environment' }
          foreach ($line in $envlines) {
            if ($line -match '^(.*?)=(.*)$' -and $names -contains $matches[1]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:/_bazel-disk
          key: codexdd045-3f43-${{ github.run_id }}-warm
          fail-on-cache-miss: true
      - name: Build bounded core optimized Rust stage
        id: core
        shell: pwsh
        run: |
          & .github/scripts/codexdd-045-staged-optimized-windows.ps1 -Stage core -SoftMinutes 96 -MaxCacheBytes 3221225472 -ExpectedPathSha '${{ needs.warm.outputs.path_sha }}'
          if (-not $?) { throw 'core native build stage failed' }

      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:/_bazel-disk
          key: codexdd045-3f43-${{ github.run_id }}-core
      - name: Keep core nonrelease build diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f43-core-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/codexdd045-release-staged/*.log
          retention-days: 3
          if-no-files-found: warn
  final:
    needs: [warm, core]
    runs-on: windows-2022
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
