          fail-on-cache-miss: true
      - name: Build bounded cli optimized Rust stage
        id: cli
        shell: pwsh
        run: |
          & .github/scripts/codexdd-045-staged-optimized-windows.ps1 -Stage cli -SoftMinutes 165 -MaxCacheBytes 5368709120 -ExpectedPathSha '${{ needs.warm.outputs.path_sha }}'
          if (-not $?) { throw 'cli native build stage failed' }

      - name: Build bounded combined optimized Rust stage
        id: combined
        shell: pwsh
        run: |
          & .github/scripts/codexdd-045-staged-optimized-windows.ps1 -Stage combined -SoftMinutes 90 -MaxCacheBytes 6442450944 -ExpectedPathSha '${{ needs.warm.outputs.path_sha }}'
          if (-not $?) { throw 'combined native build stage failed' }

      - name: Verify actual combined archive integrity inventory
        shell: pwsh
        run: |
          $inventory=Join-Path $env:RUNNER_TEMP 'codexdd045-release-staged/combined-sha256-inventory.json'
          if (-not (Test-Path $inventory)) { throw 'No physical EXE/PDB combined archive inventory' }
          $result=Get-Content $inventory -Raw | ConvertFrom-Json
          if ($result.file_count -ne 10 -or $result.release_approved) { throw 'Wrong or prematurely released archive' }
          Write-Host ("NONRELEASE_10_FILE_ARCHIVE_SHA256={0}" -f $result.archive_sha256)
      - name: Keep final nonrelease build diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
