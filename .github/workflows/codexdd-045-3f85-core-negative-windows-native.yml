# NONRELEASE: source-pinned, one-selector 3F.85 Core negative acceptance.
# A cheap source/format gate must pass before native Windows compilation starts.
name: CodexDD 0.4.5 3F.85 Core terminalization native (NONRELEASE)
run-name: 3F.85 Core terminalization negatives on Windows (NONRELEASE)
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-3f85-core-negatives
    paths:
      - .github/workflows/codexdd-045-3f85-core-negative-windows-native.yml
permissions:
  contents: read
concurrency:
  group: codexdd045-3f85-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify frozen candidate, security graph and protected production version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.5-3f85-core-negatives'
          test "$(git rev-parse HEAD:codex-rs/core/src/client_tests.rs)" = 'c6fdbe47fe6cde917173dbdfc4fdd97a3e9c8a5a'
          test "$(git rev-parse HEAD:scripts/codexdd-045-3f85-core-negative-native.ps1)" = '6eb2e24b7e6eeaa70ac24b275a076d25e1a9dcbf'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path('docs/upstream-candidates/codexdd-045-3f85-core-owner-negatives.json').read_text())
          assert ledger['release_approved'] is False
          assert ledger['formal_owner_signoffs'] == 0
          assert ledger['high_risk_holds_remaining']['total'] == 13
          src = Path('codex-rs/core/src/client_tests.rs').read_text()
          for marker in ('report_adaptive_signal_not_real', 'tool_result_only', '"{}_untrusted"'):
              assert marker in src, marker
          print('PASS: exact source, Core negative assertions, secure dependency graph, release marker unchanged')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Rustfmt check only (no compilation)
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check

  windows-native:
    needs: cheap-source
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: "never"
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Configure bounded Windows logs and Cargo scratch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'codexdd045-3f85'
          $target=Join-Path $root 'target'
          $temp=Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force $target,$temp,'native-evidence' | Out-Null
          @(
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
          ) | Add-Content $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Restore Cargo sources only (no oversized target cache)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-3f73-source-static
          restore-keys: |
            codexdd045-3f12-source-
            codexdd045-crypto-msvc-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Run exactly one native Core terminalization regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ".\\scripts\\codexdd-045-3f85-core-negative-native.ps1" -ExpectedHead $env:GITHUB_SHA -LogDir "$env:GITHUB_WORKSPACE\\native-evidence"
          if ($LASTEXITCODE -ne 0) { throw '3F.85 native runner failed' }
      - name: Preserve focused native logs and nonrelease receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f85-core-terminalization-nonrelease
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
