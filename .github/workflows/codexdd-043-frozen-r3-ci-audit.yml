# Temporary read-only output oracle for exact pinned Prettier formatting.
# This replaces the now-completed frozen-tree audit job; do not publish edits
# from CI. The assistant applies inspected diff to the separate docs branch.
name: CodexDD 0.4.3 detached-runbook Prettier oracle
on:
  push:
    branches:
      - docs/codexdd-ssh-safe-release-validation
    paths:
      - .github/workflows/codexdd-043-frozen-r3-ci-audit.yml
permissions:
  contents: read
jobs:
  prettier-diff-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Install exact pinned repository formatter
        run: pnpm install --frozen-lockfile
      - name: Print exact non-persisted documentation formatting patch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write docs/codexdd-major-phase-work-packet-standard.md docs/codexdd-ssh-safe-native-release-validation.md
          echo '=== CODEXDD_PRETTIER_PATCH_BEGIN ==='
          git diff --no-ext-diff --unified=2 -- docs/codexdd-major-phase-work-packet-standard.md docs/codexdd-ssh-safe-native-release-validation.md
          echo '=== CODEXDD_PRETTIER_PATCH_END ==='
