# One-shot, artifact-bound import of a Cargo-generated lockfile into Git objects.
# No branch updates, checkout edits, installs, release markers, or deployments.
name: CodexDD 0.4.5 ZIP9 no-BZIP2 lock blob import (nonrelease)

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - '.github/workflows/codexdd-045-zip9-feature-lock-blob-import.yml'

permissions:
  contents: read

jobs:
  import-resolved-lock:
    name: Import sealed non-BZIP2 ZIP9 resolver Git blob only
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration' && github.event.before == 'a784f4f5eacd12cdb448037a77302307874834ad'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact import workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify branch ancestry, exact existing lock and nonrelease markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'a784f4f5eacd12cdb448037a77302307874834ad'
          test "$(git hash-object codex-rs/Cargo.toml)" = '43775319466241f34565fa2611172f2239b5bbdf'
          test "$(git hash-object codex-rs/Cargo.lock)" = '48ae4fb45a83de4d72dee6200b83a770dbf8f760'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'

      - name: Download exact prior green Windows resolver artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/zip9-resolver-12285200057.zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12285200057/zip" \
            --output "$out"
          echo "03624d85fb5e1d8e4e2d12fddea3cb4e1adfd4f2df5deabab12df20340eec975  $out" | sha256sum --check -

      - name: Validate archive exact bytes and create Git blob without changing branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"])
          archive = root / "zip9-resolver-12285200057.zip"
          with zipfile.ZipFile(archive) as z:
              expected = {"Cargo.lock", "Cargo.toml", "cargo-update.log", "lock-blob.txt", "lock-diff.patch", "source-sha.txt"}
              assert set(z.namelist()) == expected, "Unexpected artifact members"
              locked = z.read("Cargo.lock")
              manifest = z.read("Cargo.toml")
              assert z.read("source-sha.txt").strip() == b"a784f4f5eacd12cdb448037a77302307874834ad"
              assert z.read("lock-blob.txt").strip() == b"a8eb8a076276cb3db5674b33c67d743b1c3d21fc"

          def blob_id(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          assert blob_id(locked) == "a8eb8a076276cb3db5674b33c67d743b1c3d21fc", "Unreviewed lock bytes"
          assert blob_id(manifest) == "d5909f7df930a10830fc6e0ff722d04c81cb3b7f", "Unreviewed manifest"
          baseline = Path("codex-rs/Cargo.toml").read_bytes()
          needle = b'zip = "9.0.5"'
          assert baseline.count(needle) == 1, "Unexpected ZIP9 manifest baseline"
          replacement = b'zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "deflate64", "deflate", "lzma", "ppmd", "time", "zstd", "xz"] }'
          normalized = manifest.replace(b"\r\n", b"\n")
          assert blob_id(normalized) == "c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4"
          assert baseline.replace(needle, replacement) == normalized, "Preview manifest differs from exact one-line feature selection"
          text = locked.decode("utf-8")
          for name, version in [
              ("zip", "9.0.5"), ("rustls", "0.23.46"),
              ("quinn-proto", "0.11.18"), ("noyalib-serde-yaml", "0.0.57"),
          ]:
              import re
              pattern = r'\[\[package\]\]\nname = "' + re.escape(name) + r'"\nversion = "' + re.escape(version) + r'"'
              assert re.search(pattern, text), f"Missing reviewed version of {name}"
          assert b'[[package]]\nname = "bzip2"\n' not in locked, "BZIP2 must not be resolved"
          assert b'[[package]]\nname = "libbz2-rs-sys"\n' not in locked, "Disallowed BZIP2 license chain must not be present"
          assert b'"bzip2"' not in locked, "BZIP2 dependency must not remain in graph"
          payload = {"content": base64.b64encode(locked).decode("ascii"), "encoding": "base64"}
          (root / "git-blob-request.json").write_text(json.dumps(payload))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/git-blob-request.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" \
            > "$RUNNER_TEMP/blob-created.json"
          created="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "blob-created.json")))["sha"])')"
          test "$created" = 'a8eb8a076276cb3db5674b33c67d743b1c3d21fc'
          test -z "$(git status --porcelain)"
          echo "PASS: sealed 0.4.5 ZIP 9 lock blob imported: $created; GitHub branch unchanged."
