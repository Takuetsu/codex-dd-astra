# Narrow nonrelease proof of exactly three owner-approved Linux-only INFO exemptions.
name: CodexDD 0.4.5 Linux INFO accepted-risk guard (NONRELEASE)

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-linux-info-risk-accepted
    paths:
      - '.github/workflows/codexdd-045-linux-info-risk-guard.yml'
      - 'codex-rs/deny.toml'
      - 'codex-rs/.cargo/audit.toml'
      - 'codex-rs/Cargo.toml'
      - 'codex-rs/Cargo.lock'
      - 'scripts/codexdd-045-inherited-risk-guard.py'

permissions:
  contents: read

jobs:
  accepted-info-only:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-linux-info-risk-accepted'
    name: Verify accepted INFO scope (NOT full cargo-deny release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify exact source, version markers and approved policy boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object codex-rs/Cargo.toml)" = 'd46347640b6ca6e43e96a12ee14eec894178af4f'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'f19b0086eac09c6830c887be83db5ae4ae11587e'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test -z "$(git status --porcelain)"
          python3 scripts/codexdd-045-inherited-risk-guard.py

      - name: Install pinned Cargo toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Resolve Windows and Linux lock, validate current RustSec metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/codexdd-045-windows.json"
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/codexdd-045-linux.json"
          python3 scripts/codexdd-045-inherited-risk-guard.py \
            --windows-metadata "$RUNNER_TEMP/codexdd-045-windows.json" \
            --linux-metadata "$RUNNER_TEMP/codexdd-045-linux.json" \
            --check-db
          test -z "$(git status --porcelain)"
          echo 'PASS: accepted INFO scope only. Full all-target cargo-deny/crypto-bigint gate remains RED.'
