# One-shot read-only 0.163 direct-conflict replay, not a release gate.
# Based on the prepare workflow's three-way customization transplant.
name: CodexDD 0.4.5 original conflict replay

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - '.github/workflows/codexdd-045-original-conflict-recon.yml'

permissions:
  contents: read

concurrency:
  group: codexdd045-original-conflicts
  cancel-in-progress: false

jobs:
  verify-original-conflicts:
    name: Reproduce 0.163 original direct conflicts (source-only)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE: 'c1382380de69521303b416720a52f42d51af6248'
      TARGET: '83086188ae0614bd882818ff1aa23f3194962012'
      PRODUCTION: 'b25550dcb2c6e84a84074b603086c9db6f32a63b'
      SNAPSHOT: '6b52453d963d85810945ca71d3d7833a1f8b91a6'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout exact fork source without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact release/provenance boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Takuetsu/codex-dd-astra'
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SNAPSHOT" "$GITHUB_SHA"
          git cat-file -e "$PRODUCTION^{commit}"
          test "$(git hash-object codex-rs/Cargo.toml)" = 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'a8eb8a076276cb3db5674b33c67d743b1c3d21fc'
          test "$(git hash-object codex-rs/deny.toml)" = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Fetch only the two immutable official upstream commits
        shell: bash
        run: |
          set -euo pipefail
          git remote add official https://github.com/openai/codex.git
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=1 official "$BASE" "$TARGET"
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$TARGET^{commit}"
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"
          test "$(git rev-parse "$TARGET^{commit}")" = "$TARGET"
          echo "Pinned official 0.162 and 0.163 objects fetched for source-only merge simulation"

      - name: Compute exact three-way conflict set without checkout edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codexdd045-3f2"
          stdout="$RUNNER_TEMP/codexdd045-3f2/merge-tree.stdout"
          stderr="$RUNNER_TEMP/codexdd045-3f2/merge-tree.stderr"
          set +e
          git merge-tree --write-tree --name-only --no-messages --merge-base="$BASE" "$TARGET" "$PRODUCTION" > "$stdout" 2> "$stderr"
          rc=$?
          set -e
          echo "MERGE_TREE_EXIT_CODE=$rc"
          cat "$stderr"
          if (( rc > 1 )); then
            echo 'git merge-tree could not perform the source-only replay' >&2
            exit "$rc"
          fi
          python3 - "$stdout" "$rc" "$RUNNER_TEMP/codexdd045-3f2/conflicts.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          p, rc, out = Path(sys.argv[1]), int(sys.argv[2]), Path(sys.argv[3])
          lines = p.read_text(encoding="utf-8").splitlines()
          if not lines or not re.fullmatch(r"[0-9a-f]{40}", lines[0]):
              raise SystemExit("unexpected git merge-tree output; refusing invented conflict inventory")
          names = [line for line in lines[1:] if line.strip()]
          if (rc == 0 and names) or (rc == 1 and not names):
              raise SystemExit(f"merge-tree exit {rc} inconsistent with {len(names)} unmerged paths")
          if len(names) != len(set(names)) or names != sorted(names):
              names = sorted(set(names))
          for name in names:
              if name.startswith("/") or ".." in Path(name).parts:
                  raise SystemExit(f"unsafe path in conflict inventory: {name}")
          result = {
              "contract_version": 1,
              "type": "source-only-three-way-conflict-replay",
              "base": os.environ["BASE"],
              "target": os.environ["TARGET"],
              "production": os.environ["PRODUCTION"],
              "integration_head": os.environ["GITHUB_SHA"],
              "status": "merge-conflicts-expected-not-release-acceptance",
              "git_merge_tree_exit_code": rc,
              "conflict_count": len(names),
              "conflicts": names,
          }
          out.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print("ORIGINAL_DIRECT_CONFLICT_COUNT:", len(names))
          for name in names:
              print("ORIGINAL_CONFLICT_PATH:", name)
          if len(names) != 15:
              raise SystemExit(f"15 original direct conflicts expected in 0.4.5 plan, got {len(names)}; investigate before attesting")
          PY
          {
            echo "## 0.163 original transplant conflicts (source-only replay)"
            echo
            echo "- Production: \`$PRODUCTION\`"
            echo "- Old upstream base: \`$BASE\`"
            echo "- Official 0.163: \`$TARGET\`"
            echo "- Conflict count: **15** (source dry-run; not semantic acceptance)"
            echo
            sed -n 's/^ORIGINAL_CONFLICT_PATH: /- /p' /dev/null
          } >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'PASS: exact original conflict roster recorded; no repository files changed'

      - name: Upload immutable source conflict diagnostic
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-original-conflicts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexdd045-3f2/*
          if-no-files-found: warn
          retention-days: 14
