# One-shot cost-free source and PowerShell parser audit. No Windows runner involved.
name: CodexDD 0.4.5 optimized Windows artifact-first retry source audit (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f48-source-preflight.yml"]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '46152c262b9218abb0652d3a0f587ae165d938ca'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check native CLI/PDB salvage and package targets before spending Windows minutes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '46152c262b9218abb0652d3a0f587ae165d938ca'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f48_release_cache_reuse_contract.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f48_cli_salvage_source.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f48_final_retry_plan.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f42a_windows_archive_verifier.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f14_owner_matrix.py' -v
          command -v pwsh
          pwsh -NoProfile -Command '$t=$null;$e=$null;foreach($f in @(".github/scripts/codexdd-045-staged-optimized-windows.ps1",".github/scripts/codexdd-045-preserve-real-cli-pdb.ps1")){[System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$t,[ref]$e)|Out-Null;if($e.Count -gt 0){$e|ForEach-Object {Write-Error $_};exit 1}};"PASS: native artifact-preserving scripts parse"'
          test -z "$(git status --porcelain)"
