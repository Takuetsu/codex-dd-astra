name: CodexDD 3F.1 schema oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-3f1-schema-oracle.yml"
      - "codex-rs/app-server-protocol/src/**/*.rs"
      - "codex-rs/history/src/**/*.rs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Ensure uv
        shell: bash
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            python -m pip install uv
          fi
      - name: Generate and commit app-server schema and SDK artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          python app-server-protocol/scripts/write_schema_fixtures.py
          cd ..
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/app-server-protocol/schema sdk/python/src/openai_codex/generated/v2_all.py
          git commit -m "chore: regenerate 3F.1 LVO status schema artifacts"
          git push origin HEAD:dd/codexdd-v0.4.0-local-validation-orchestrator
