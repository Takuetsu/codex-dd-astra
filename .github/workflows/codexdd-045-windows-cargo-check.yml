# Branch-scoped, read-only native Windows compile feedback for CodexDD 0.4.5.
# This is NOT a release gate, package build, deploy, acceptance test or publisher.
name: CodexDD 0.4.5 Windows compile checkpoint

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - 'codex-rs/**'
      - '.github/workflows/codexdd-045-windows-cargo-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexdd-045-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui-native-compile:
    name: Windows Cargo TUI compile (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_MIN_STACK: '16777216'
    steps:
      - name: Checkout exact integration commit without saved credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Assert integration identity and unchanged release markers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Takuetsu/codex-dd-astra') { throw 'Wrong repository' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration') { throw 'Wrong branch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          if ((Get-Content 'codex-rs/codexdd-version.txt' -Raw).Trim() -ne '0.4.4') { throw 'Production version marker unexpectedly advanced' }
          if ((Get-Content 'codex-rs/upstream-codex-release.txt' -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Tracked upstream marker unexpectedly advanced' }

      # setup-ci provisions a Dev Drive unsupported by hosted windows-2022.
      # Reuse its proven temporary paths and Windows longpath approach instead.
      - name: Configure isolated Windows paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'codexdd045'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CI_BUILD_ROOT=$root"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable long Windows paths' }

      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install DotSlash for Rust dependency tools
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Cache integration-only Cargo sources and artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codexdd045/target
          key: codexdd045-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            codexdd045-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-
            codexdd045-${{ runner.os }}-
          save-always: true

      - name: Verify exact pinned Cargo resolver graph before native compilation
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Cargo.lock does not match the 0.163 manifests' }

      - name: Verify repository-pinned Windows V8 binding
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Compile TUI library and capture compiler diagnostics
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'codexdd045-windows-cargo-check.log'
          # The 0.163 Windows-resolved dependency lockfile is committed and audited.
          # --locked prevents Cargo from silently revising it in the runner.
          # --keep-going compiles independent dependencies after an error so one
          # diagnostic run exposes more upstream integration incompatibilities.
          $cmd = 'cargo check --locked --keep-going -p codex-tui --lib > "' + $log + '" 2>&1'
          & cmd.exe /d /c $cmd
          $rc = $LASTEXITCODE
          Write-Host "Cargo exit code: $rc"
          if (-not (Test-Path -LiteralPath $log)) { throw 'Cargo log was not created' }
          if ($rc -ne 0) {
            # The last 180 lines hid 26 of 36 errors in the previous run.
            # Emit ALL error headings with source spans, without dumping noisy dependency output.
            $clean = [regex]::Replace([IO.File]::ReadAllText($log), '\x1b\[[0-9;]*[A-Za-z]', '')
            $sourceLines = $clean -split '\r?\n'
            $report = Join-Path $env:RUNNER_TEMP 'codexdd045-compiler-diagnostics.txt'
            $blocks = [System.Collections.Generic.List[string]]::new()
            for ($idx = 0; $idx -lt $sourceLines.Length; $idx++) {
              if ($sourceLines[$idx] -match '^\s*error(\[E[0-9]+\])?:') {
                $stop = [Math]::Min($idx + 22, $sourceLines.Length - 1)
                $blocks.Add((($sourceLines[$idx..$stop]) -join [Environment]::NewLine))
              }
            }
            Write-Host "Rust error headings found: $($blocks.Count)"
            $blocks -join ([Environment]::NewLine + [Environment]::NewLine) |
              Set-Content -LiteralPath $report -Encoding utf8
            Get-Content -LiteralPath $report
            throw "Native Windows TUI compile failed (exit $rc); inspect the full diagnostic artifact"
          }
          Get-Content -LiteralPath $log -Tail 45

      - name: Capture resolved lockfile diff for separate review
        if: always()
        shell: pwsh
        run: |
          git diff -- codex-rs/Cargo.lock |
            Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'codexdd045-lock-diff.txt') -Encoding utf8

      - name: Upload compiler log and unaccepted lockfile
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-windows-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codexdd045-windows-cargo-check.log
            ${{ runner.temp }}/codexdd045-compiler-diagnostics.txt
            ${{ runner.temp }}/codexdd045-lock-diff.txt
            codex-rs/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
