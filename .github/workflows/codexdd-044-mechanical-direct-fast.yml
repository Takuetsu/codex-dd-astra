# Temporary, narrow Windows source contract check for CodexDD 0.4.4.
# No cargo build, no native Worker profile, no 21-stage release profile.
name: CodexDD 0.4.4 mechanical direct-tool fast check

on:
  push:
    branches:
      - dd/codexdd-0.4.4-native-tool-direct-guidance
    paths:
      - .github/workflows/codexdd-044-mechanical-direct-fast.yml
      - codex-rs/core/src/tools/mod.rs
      - codex-rs/core/src/tools/spec_plan_tests.rs
      - codex-rs/tui/src/chatwidget/adaptive_admission.rs
      - scripts/codexdd-test-release.ps1

permissions:
  contents: read

concurrency:
  group: codexdd-044-mechanical-direct-tool-fast
  cancel-in-progress: true

jobs:
  windows-contract:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify unchanged product boundary and protected direct-mode contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected checkout' }
          git merge-base --is-ancestor a79378618728a5ad63fbf7b204ae9a0ea1fecb29 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PR #53 baseline ancestry not preserved' }
          $allowed = @(
            '.github/workflows/codexdd-044-mechanical-direct-fast.yml',
            'codex-rs/core/src/tools/mod.rs',
            'codex-rs/core/src/tools/spec_plan_tests.rs',
            'codex-rs/tui/src/chatwidget/adaptive_admission.rs',
            'scripts/codexdd-test-release.ps1'
          )
          $changes = @(git diff --name-only a79378618728a5ad63fbf7b204ae9a0ea1fecb29 HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Source diff failed' }
          foreach ($item in $changes) {
            if ($allowed -notcontains $item) { throw "Unexpected changed file: $item" }
          }
          if ($changes.Count -ne $allowed.Count) { throw 'Expected exact narrow candidate changes' }
          if ((Get-Content -Raw codex-rs/codexdd-version.txt).Trim() -ne '0.4.4') { throw 'Wrong version' }
          $mode = Get-Content -Raw codex-rs/core/src/tools/mod.rs
          $tests = Get-Content -Raw codex-rs/core/src/tools/spec_plan_tests.rs
          $registry = Get-Content -Raw codex-rs/core/src/tools/registry.rs
          if ($mode -notmatch 'turn_trigger.as_deref\(\)' -or
              $mode -notmatch 'CODEXDD_ADAPTIVE_MECHANICAL_VALIDATION_TURN_TRIGGER' -or
              $mode -notmatch 'return ToolMode::Direct') { throw 'Protected direct-mode gate missing' }
          if ($tests -notmatch 'codexdd_mechanical_turn_forces_direct_tools_without_widening_other_turns' -or
              $tests -notmatch 'mechanical.tool_mode, ToolMode::Direct' -or
              $tests -notmatch 'reconnaissance.tool_mode, ToolMode::CodeModeOnly') {
            throw 'Core turn isolation regression missing'
          }
          if ($registry -notmatch 'adaptive_mechanical_validation_rejection' -or
              $registry -notmatch '"run_codexdd_validation"') {
            throw 'No-write dispatch allowlist changed or missing'
          }
          $release = Get-Content -Raw scripts/codexdd-test-release.ps1
          $errs = $null; $toks = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($release, [ref]$toks, [ref]$errs)
          if ($errs.Count -gt 0) { throw ('PowerShell parse failed: ' + ($errs -join '; ')) }
          if ([regex]::Matches($release, 'New-CodexDDValidationStage -Name').Count -ne 21) {
            throw 'Release-stage count changed'
          }
          if ($release -notmatch '"codex-cli", "-p", "codex-code-mode-host", "--release", "--locked"') {
            throw 'Locked companion-host release stage missing'
          }

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Check Rust formatting without compiling
        shell: pwsh
        working-directory: codex-rs
        run: |
          & cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting check failed' }

      - name: Verify source remains clean
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { $dirty | Write-Host; throw 'Source checkout changed during check' }
