# NONRELEASE: source-pinned 3F.88 TUI replay authority acceptance.
# A cheap source/format gate must pass before native Windows compilation starts.
name: CodexDD 0.4.5 3F.88 TUI replay/approval authority (NONRELEASE)
run-name: 3F.88 TUI replay/approval authority on Windows (NONRELEASE)
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-3f88-tui-replay-authority
    paths:
      - .github/workflows/codexdd-045-3f88-tui-replay-authority-windows-native.yml
permissions:
  contents: read
concurrency:
  group: codexdd045-3f88-tui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 25
          persist-credentials: false
      - name: Verify frozen candidate, security graph and protected production version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.5-3f88-tui-replay-authority'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app.rs)" = '2c4ef89f8aef22193ae8d5f57996a948db987659'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/thread_routing.rs)" = 'fbca3e0e7efa0f11385297027c12b6a5d96a8632'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/tests.rs)" = 'd7f541ced9d91f184a7de3a527a55c804b62a672'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app_server_session.rs)" = 'db8a394b652fd18d61807a8b656e6b7463f07521'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/thread_events.rs)" = '4ee8f4a0446c8c0cfd41dd234457a299c89d242c'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/thread_event_buffer.rs)" = '1857941dba71f611256dc9e782b9b9c428fecaec'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/thread_event_buffer_tests.rs)" = '5b3aa1c6e156748975356ecffeeada3dee97752c'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/pending_interactive_replay.rs)" = 'cdbc8512fabe55cb509146dc9a3193d4b77086bf'
          test "$(git rev-parse HEAD:codex-rs/tui/Cargo.toml)" = 'ea0894b3e1d3777f4c598727b03199c1f69cbd05'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          git diff --check 01f853ccf5e327e4008b9743c72c25859fa59a0a HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('docs/upstream-candidates/codexdd-045-3f88-tui-replay-authority-candidate.json').read_text())
          assert ledger['release_approved'] is False
          assert ledger['formal_owner_signoffs'] == 0
          assert ledger['tui_high_risk_owner_holds_after'] == 9
          assert ledger['base_3f87_head'] == '01f853ccf5e327e4008b9743c72c25859fa59a0a'
          assert ledger['status'] == 'SOURCE_AUDIT_COMPLETE_NATIVE_SELECTED_TESTS_PENDING'
          assert len(ledger['native_selectors']) == 12
          for case in ledger['native_selectors']:
              source=Path(case['test_path']).read_text()
              selector=case['selector'].rsplit('::',1)[-1]
              assert source.count('fn ' + selector + '(') == 1, selector
          buffer=Path('codex-rs/tui/src/app/thread_event_buffer.rs').read_text()
          assert 'push_request_checked' in buffer
          assert 'is_unresolved_interactive_event' in buffer
          assert 'THREAD_EVENT_REPLAY_MAX_WIRE_BYTES' in buffer
          print('3F88_SOURCE_GUARD_PASS: 12 selectors and exact TUI authority sources; owner hold unchanged')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Rustfmt check only (no compilation)
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check

  windows-native:
    needs: cheap-source
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: "never"
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Retain the 3F.87 acceptance ancestor for source-bound review.
          fetch-depth: 25
          persist-credentials: false
      - name: Configure bounded Windows logs and Cargo scratch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'codexdd045-3f88-tui'
          $target=Join-Path $root 'target'
          $temp=Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force $target,$temp,'native-evidence' | Out-Null
          @(
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
          ) | Add-Content $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Restore Cargo sources only (no oversized target cache)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-3f73-source-static
          restore-keys: |
            codexdd045-3f12-source-
            codexdd045-crypto-msvc-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Execute all TUI replay authority regressions on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          $cases = @(
            'app::thread_event_buffer::tests::retained_replay_byte_budget_evicts_old_messages_but_keeps_pending_approval',
            'app::thread_event_buffer::tests::unresolved_request_retention_exhaustion_fails_before_mutating_approval_state',
            'app::thread_event_buffer::tests::refresh_recounts_replay_bytes_after_stripping_replayed_message_text',
            'app::pending_interactive_replay::tests::thread_event_snapshot_drops_resolved_exec_approval_after_server_resolution',
            'app::pending_interactive_replay::tests::thread_event_snapshot_drops_pending_approvals_when_turn_completes',
            'app::thread_events::tests::saturated_queue_retains_fifo_approval_and_completion_once',
            'app::thread_events::tests::live_queue_rejects_oversized_voice_audio_before_buffering_without_silent_drop',
            'app::tests::inactive_thread_overflow_does_not_starve_foreground_or_block_switch',
            'app::tests::inactive_thread_approval_bubbles_into_active_view',
            'app::tests::resolved_buffered_approval_does_not_become_actionable_after_drain',
            'app::tests::replay_thread_snapshot_restores_draft_and_queued_input',
            'app_server_session::tests::thread_resume_params_can_rejoin_without_overriding_existing_settings'
          )
          $cargo=(Get-Command cargo.exe -ErrorAction Stop).Source
          $results=New-Object 'System.Collections.Generic.List[object]'
          $index=0
          foreach ($case in $cases) {
            $index++
            $stdout=Join-Path $env:GITHUB_WORKSPACE ("native-evidence\case-$index-stdout.log")
            $stderr=Join-Path $env:GITHUB_WORKSPACE ("native-evidence\case-$index-stderr.log")
            Write-Host "BEGIN 3F.88 TUI case $($index): $case"
            $arguments=@('test','--locked','-p','codex-tui','--lib',$case,'--','--exact','--nocapture')
            $proc=Start-Process -FilePath $cargo -ArgumentList $arguments -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE 'codex-rs') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if ($proc.ExitCode -ne 0) {
              Get-Content $stdout -Tail 60 -ErrorAction SilentlyContinue
              Get-Content $stderr -Tail 100 -ErrorAction SilentlyContinue
              throw "TUI case $($index) failed with exit $($proc.ExitCode)"
            }
            $output=(Get-Content $stdout -Raw)+(Get-Content $stderr -Raw)
            if (-not [regex]::IsMatch($output, 'test result: ok\.\s+1 passed;\s+0 failed;')) {
              throw "TUI case $($index) did not execute exactly one test"
            }
            $pattern='test\s+'+[regex]::Escape($case)+'\s+\.\.\.\s+ok'
            if (-not [regex]::IsMatch($output,$pattern)) {
              throw "TUI case $($index) missing matching passing test name"
            }
            $results.Add([pscustomobject]@{Selector=$case;Passed=1;Stdout=$stdout;Stderr=$stderr})
            Write-Host "PASS 3F.88 TUI case $($index): $case" -ForegroundColor Green
          }
          $receipt=[pscustomobject]@{
            kind='codexdd045_3f88_tui_replay_authority_native_nonrelease'
            source_head=$env:GITHUB_SHA
            utc=(Get-Date).ToUniversalTime().ToString('o')
            passed=$results.Count
            failed=0
            selectors=$results.ToArray()
            release_approved=$false
            formal_owner_signoffs=0
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content native-evidence/3f88-receipt.json -Encoding utf8
          Write-Host "3F.88 TUI REPLAY AUTHORITY TESTS GREEN: $($results.Count)/$($cases.Count)" -ForegroundColor Green
      - name: Preserve focused native logs and nonrelease receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f88-tui-replay-authority-nonrelease
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
