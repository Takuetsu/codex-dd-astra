name: rustls security update runner

on:
  push:
    branches:
      - dd/rustls-security-update-20260916

permissions:
  contents: write

jobs:
  update-rustls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Update rustls lockfile on base
        shell: bash
        run: |
          git fetch origin dd/astra-policy-v2
          git checkout -B dd/astra-policy-v2 origin/dd/astra-policy-v2
          cargo update --manifest-path codex-rs/Cargo.toml -p rustls --precise 0.23.45
          grep -A3 'name = "rustls"' codex-rs/Cargo.lock | grep 'version = "0.23.45"'
          git diff --check
          git diff -- codex-rs/Cargo.lock

      - name: Validate cargo-deny
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml

      - name: Validate locked metadata
        shell: bash
        run: cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps > /dev/null

      - name: Commit and push base update
        shell: bash
        run: |
          test -n "$(git status --porcelain -- codex-rs/Cargo.lock)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock
          git commit -m "deps: update rustls to 0.23.45"
          git push origin HEAD:dd/astra-policy-v2
