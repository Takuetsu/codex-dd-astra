# One-shot source-only TUI test reconciliation. No Rust compile, package or release.
name: CodexDD 0.4.5 0.163 Daybreak/WebSocket TUI test restoration (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f34-session-test-source.yml"]
permissions:
  contents: read
jobs:
  test-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'cab5bf8db870e3ab9997e126b0e777afdfd74315'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable reviewed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify protected source and exact additive TUI test changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'cab5bf8db870e3ab9997e126b0e777afdfd74315'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f34_session_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f25_dynamic_auth_regression.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f14_owner_matrix.py' -v
          test -z "$(git status --porcelain)"
