# One shot two independent Windows runners. Cache remains nonrelease and bounded.
name: CodexDD 0.4.5 medium real Rust cross-runner immutable action cache probe (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f42b-medium-optimized-cache-probe.yml"]
permissions:
  contents: read
jobs:
  source-contract:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '2948bf0c5fcb196b183dee30496ee12fe7c05f76'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source with no credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate source and live cache transport contract before Windows spending
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '2948bf0c5fcb196b183dee30496ee12fe7c05f76'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f42b_manual_cache_contract.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f42a_windows_archive_verifier.py' -v
          test -z "$(git status --porcelain)"
  seed:
    needs: source-contract
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: windows-2022
    timeout-minutes: 29
    outputs:
      path_sha: ${{ steps.compile.outputs.path_sha }}
    steps:
      - name: Checkout frozen candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact nonrelease source and locked security graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected source SHA' }
          if ((git rev-parse HEAD^).Trim() -ne '2948bf0c5fcb196b183dee30496ee12fe7c05f76') { throw 'Unexpected workflow parent' }
          $pinned = @{
            'MODULE.bazel' = 'd178d9882169a5c06e42869338c99c4300e4e791'
            'MODULE.bazel.lock' = 'ac964e1ac4f455d6277063e235556a1387e8ba19'
            'codex-rs/config/BUILD.bazel' = '2b540027532dd9e48f3f846671eff3f4f08feaeb'
            'codex-rs/config/Cargo.toml' = 'b4be94bb585c6757234299a78f8b42a02b3d2017'
            'bazel/rules/runtime_package.bzl' = 'ba4cdad58f916f04602109c7b4d2512e83da5485'
            'codex-rs/Cargo.toml' = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
            'codex-rs/Cargo.lock' = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
            'codex-rs/deny.toml' = 'f282c7c55d05201e308e60804f85754c8522d462'
            '.bazelrc' = 'b7698b896e8d0830b60477999d330b115cf5ee8e'
          }
          foreach ($path in $pinned.Keys) {
            if ((git rev-parse ('HEAD:' + $path)).Trim() -ne $pinned[$path]) { throw "Protected source changed: $path" }
          }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Production marker advanced' }
          if ((Get-Content codex-rs/upstream-codex-release.txt -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Upstream marker advanced' }
          if ($env:BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA) { throw 'No SDK license override permitted' }
          if (git status --porcelain --untracked-files=no) { throw 'Dirty tracked worktree' }
      - name: Configure pinned Bazelisk without automatic immutable disk cache saves
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-save: false
      - name: Initialize preinstalled Windows MSVC (no SDK install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $where = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $where)) { throw 'MSVC discovery utility absent' }
          $vs = & $where -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Required hosted MSVC toolchain missing' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $dev)) { throw 'Hosted VsDevCmd missing' }
          $names = @('PATH','INCLUDE','LIB','LIBPATH','SystemRoot','WindowsSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsSDKVersion')
          $pairs = & cmd.exe /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $dev)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize preinstalled MSVC' }
          foreach ($entry in $pairs) {
            if ($entry -match '^(.*?)=(.*)$' -and $names -contains $matches[1]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          Write-Host 'PASS: hosted MSVC x64 env initialized without toolchain downloads'

      - name: Compile real optimized Rust config crate (bounded cold seed)
        id: compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The MSVC Bazel action key includes PATH. Normalize only hosted Ruby
          # drift that invalidated the prior cross-runner action-cache probe.
          $parts = @($env:PATH -split ';' | Where-Object { $_ })
          $ruby = @($parts | Where-Object { $_ -match '(?i)^[A-Z]:\\hostedtoolcache\\windows\\Ruby\\' })
          if ($ruby.Count -ne 1) { throw "Expected exactly one unrelated hosted Ruby PATH, found $($ruby.Count)" }
          $env:PATH = (@($parts | Where-Object { $_ -notin $ruby }) -join ';')
          $shaBytes = [System.Text.Encoding]::UTF8.GetBytes($env:PATH)
          $pathSha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($shaBytes)).ToLowerInvariant()
          Write-Host "BAZEL_ACTION_PATH_SHA256=$pathSha"
          "path_sha=$pathSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          
          $bazel = (Get-Command bazel).Source
          if (-not (Test-Path -LiteralPath $bazel)) { throw 'Pinned Bazelisk not found' }
          $version = (& bazel --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'bazel 9.2.0') { throw "Unexpected Bazel: $version" }
          $cache = 'D:/_bazel-disk'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP 'codexdd045-3f42b-config'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $stdout = Join-Path $dir 'seed-stdout.log'
          $stderr = Join-Path $dir 'seed-stderr.log'
          $combined = Join-Path $dir 'seed-combined.log'
          $args = @(
            '--noexperimental_remote_repo_contents_cache',
            'build',
            '--lockfile_mode=error',
            '--config=ci-windows-msvc',
            '--config=release',
            '--platforms=//:windows_x86_64_msvc',
            '--host_platform=//:local_windows_msvc',
            '--//codex-rs:runtime_package_build_mode=release',
            '--disk_cache=D:/_bazel-disk',
            '--jobs=2',
            '--verbose_failures',
            '--announce_rc',
            '//codex-rs/config:config'
          )
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $bazel -ArgumentList $args -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(960000)) {
            $ErrorActionPreference = 'Continue'
            & taskkill.exe /PID $proc.Id /T /F *> $null
            $ErrorActionPreference = 'Stop'
            throw 'BOUND_OPT_CONFIG_TIMEOUT: 16min soft limit; no CLI release attempted'
          }
          $proc.Refresh()
          $exit = $proc.ExitCode
          $watch.Stop()
          if (-not (Test-Path $stdout) -or -not (Test-Path $stderr)) { throw 'Missing Rust build log' }
          @((Get-Content -LiteralPath $stdout), (Get-Content -LiteralPath $stderr)) | Set-Content -LiteralPath $combined -Encoding utf8
          Get-Content -LiteralPath $combined -Tail 35 | ForEach-Object { Write-Host ([string]$_).Substring(0,[Math]::Min(600,([string]$_).Length)) }
          if ($exit -ne 0) { throw "Real optimized Rust config library failed: $exit" }
          if (-not (Select-String -LiteralPath $combined -Pattern 'Build completed successfully' -Quiet)) { throw 'No optimized compilation receipt' }
          if (-not (Select-String -LiteralPath $combined -Pattern 'Target //codex-rs/config:config up-to-date:' -Quiet)) { throw 'Wrong target success receipt' }
          if (-not (Select-String -LiteralPath $combined -SimpleMatch '--compilation_mode=opt' -Quiet)) { throw 'No opt release profile evidence' }
          if (-not (Select-String -LiteralPath $combined -SimpleMatch '--@rules_rust//rust/settings:lto=thin' -Quiet)) { throw 'No thin LTO evidence' }
          if (-not (Select-String -LiteralPath $combined -SimpleMatch '--disk_cache=D:/_bazel-disk' -Quiet)) { throw 'Disk-cache command override missing' }
          $summary = (Select-String -LiteralPath $combined -Pattern 'INFO: [0-9]+ processes:' | Select-Object -Last 1).Line
          if (-not $summary) { throw 'No Bazel process summary' }
          if ($summary -notmatch '(^|,\s*)[1-9][0-9]* local([.,]|$)') { throw "Seed run lacked any local actions: $summary" }
          $stats = Get-ChildItem -LiteralPath $cache -File -Recurse | Measure-Object -Property Length -Sum
          $size = [long]$stats.Sum
          if ($size -le 0 -or $size -gt 1073741824) { throw "Action cache outside 0..1GiB bound: $size" }
          if (git status --porcelain --untracked-files=no) { throw 'Tracked source changed during Rust build' }
          Write-Host "3F42B_SEED_RELEASE_BUILD_SECONDS=$($watch.Elapsed.TotalSeconds)"
          Write-Host "3F42B_SEED_CACHE_SIZE_BYTES=$size"
          Write-Host "3F42B_SEED_CACHE_SUMMARY=$summary"
          Write-Host 'NONRELEASE: no optimized CLI/PDB/combined archive built or published'

      - name: Save only bounded Bazel action disk cache under unique seed key
        if: success()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:/_bazel-disk
          key: codexdd045-3f42b-config-${{ github.run_id }}-seed
      - name: Upload bounded Rust diagnostics only
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f42b-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/codexdd045-3f42b-config/*.log
          if-no-files-found: warn
          retention-days: 3

  restore:
    needs: seed
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: windows-2022
    timeout-minutes: 29
    steps:
      - name: Checkout identical frozen candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact nonrelease source and locked security graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected source SHA' }
          if ((git rev-parse HEAD^).Trim() -ne '2948bf0c5fcb196b183dee30496ee12fe7c05f76') { throw 'Unexpected workflow parent' }
          $pinned = @{
            'MODULE.bazel' = 'd178d9882169a5c06e42869338c99c4300e4e791'
            'MODULE.bazel.lock' = 'ac964e1ac4f455d6277063e235556a1387e8ba19'
            'codex-rs/config/BUILD.bazel' = '2b540027532dd9e48f3f846671eff3f4f08feaeb'
            'codex-rs/config/Cargo.toml' = 'b4be94bb585c6757234299a78f8b42a02b3d2017'
            'bazel/rules/runtime_package.bzl' = 'ba4cdad58f916f04602109c7b4d2512e83da5485'
            'codex-rs/Cargo.toml' = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
            'codex-rs/Cargo.lock' = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
            'codex-rs/deny.toml' = 'f282c7c55d05201e308e60804f85754c8522d462'
            '.bazelrc' = 'b7698b896e8d0830b60477999d330b115cf5ee8e'
          }
          foreach ($path in $pinned.Keys) {
            if ((git rev-parse ('HEAD:' + $path)).Trim() -ne $pinned[$path]) { throw "Protected source changed: $path" }
          }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Production marker advanced' }
          if ((Get-Content codex-rs/upstream-codex-release.txt -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Upstream marker advanced' }
          if ($env:BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA) { throw 'No SDK license override permitted' }
          if (git status --porcelain --untracked-files=no) { throw 'Dirty tracked worktree' }
      - name: Configure pinned Bazelisk without automatic immutable disk cache saves
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-save: false
      - name: Initialize preinstalled Windows MSVC (no SDK install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $where = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $where)) { throw 'MSVC discovery utility absent' }
          $vs = & $where -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Required hosted MSVC toolchain missing' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $dev)) { throw 'Hosted VsDevCmd missing' }
          $names = @('PATH','INCLUDE','LIB','LIBPATH','SystemRoot','WindowsSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsSDKVersion')
          $pairs = & cmd.exe /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $dev)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize preinstalled MSVC' }
          foreach ($entry in $pairs) {
            if ($entry -match '^(.*?)=(.*)$' -and $names -contains $matches[1]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          Write-Host 'PASS: hosted MSVC x64 env initialized without toolchain downloads'

      - name: Restore the exact previous runner disk cache (no prefix fallback)
        id: cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:/_bazel-disk
          key: codexdd045-3f42b-config-${{ github.run_id }}-seed
          fail-on-cache-miss: true
      - name: Verify exact cache key and prior PATH fingerprint
        shell: pwsh
        run: |
          if ('${{ steps.cache.outputs.cache-hit }}' -ne 'true') { throw 'Exact GitHub cache restore not confirmed' }
          if (-not '${{ needs.seed.outputs.path_sha }}') { throw 'Missing prior MSVC action PATH checksum' }
      - name: Build same real optimized Rust config crate without local recompilation
        id: compile
        shell: pwsh
        env:
          EXPECTED_PATH_SHA: ${{ needs.seed.outputs.path_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The MSVC Bazel action key includes PATH. Normalize only hosted Ruby
          # drift that invalidated the prior cross-runner action-cache probe.
          $parts = @($env:PATH -split ';' | Where-Object { $_ })
          $ruby = @($parts | Where-Object { $_ -match '(?i)^[A-Z]:\\hostedtoolcache\\windows\\Ruby\\' })
          if ($ruby.Count -ne 1) { throw "Expected exactly one unrelated hosted Ruby PATH, found $($ruby.Count)" }
          $env:PATH = (@($parts | Where-Object { $_ -notin $ruby }) -join ';')
          $shaBytes = [System.Text.Encoding]::UTF8.GetBytes($env:PATH)
          $pathSha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($shaBytes)).ToLowerInvariant()
          Write-Host "BAZEL_ACTION_PATH_SHA256=$pathSha"
