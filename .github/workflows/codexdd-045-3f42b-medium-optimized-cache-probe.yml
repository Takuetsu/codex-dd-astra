          Write-Host "3F42B_RESTORE_RELEASE_BUILD_SECONDS=$($watch.Elapsed.TotalSeconds)"
          Write-Host "3F42B_RESTORE_CACHE_SIZE_BYTES=$size"
          Write-Host "3F42B_RESTORE_CACHE_SUMMARY=$summary"
          Write-Host 'NONRELEASE: no optimized CLI/PDB/combined archive built or published'

      - name: Upload bounded Rust diagnostics only
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f42b-restore-${{ github.run_id }}
          path: ${{ runner.temp }}/codexdd045-3f42b-config/*.log
