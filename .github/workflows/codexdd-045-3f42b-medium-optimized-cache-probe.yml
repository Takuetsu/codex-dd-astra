          $proc = Start-Process -FilePath $bazel -ArgumentList $args -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(960000)) {
            $ErrorActionPreference = 'Continue'
            & taskkill.exe /PID $proc.Id /T /F *> $null
            $ErrorActionPreference = 'Stop'
            throw 'BOUND_OPT_CONFIG_TIMEOUT: 16min soft limit; no CLI release attempted'
          }
          $proc.Refresh()
          $exit = $proc.ExitCode
          $watch.Stop()
          if (-not (Test-Path $stdout) -or -not (Test-Path $stderr)) { throw 'Missing Rust build log' }
