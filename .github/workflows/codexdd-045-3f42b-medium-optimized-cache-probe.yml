          if ($pathSha -ne $env:EXPECTED_PATH_SHA) { throw "PATH changed between independent Windows runners: $pathSha" }
          $bazel = (Get-Command bazel).Source
          if (-not (Test-Path -LiteralPath $bazel)) { throw 'Pinned Bazelisk not found' }
          $version = (& bazel --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'bazel 9.2.0') { throw "Unexpected Bazel: $version" }
          $cache = 'D:/_bazel-disk'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP 'codexdd045-3f42b-config'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $stdout = Join-Path $dir 'restore-stdout.log'
          $stderr = Join-Path $dir 'restore-stderr.log'
          $combined = Join-Path $dir 'restore-combined.log'
          $args = @(
            '--noexperimental_remote_repo_contents_cache',
            'build',
            '--lockfile_mode=error',
            '--config=ci-windows-msvc',
