name: RC3 isolated URL cookie and ZIP security validation
on:
  push:
    branches: [dd/codexdd-v0.4.6-rc3-security-lab]
    paths: [.github/workflows/codexdd-046-rc3-security-lab.yml]
permissions:
  contents: read
jobs:
  archive-http-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - name: Verify SQLite checkpoint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = 73cc315adc65e0c6eaa96e9c15085eafb67f0d3f
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 1c4fdaf5ee58dcae368fab55d14ab72408ef8764
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Resolve compatible URL and cookie updates
        id: http
        run: |
          set -euo pipefail
          cargo update -p url --precise 2.5.9
          cargo update -p cookie --precise 0.18.3
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --check
          echo 'RC3-HTTP-DIFF-BEGIN'
          git diff --no-ext-diff --binary -- Cargo.toml Cargo.lock
          echo 'RC3-HTTP-DIFF-END'
      - name: Resolve ZIP security migration candidate
        id: zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          text = p.read_text()
          old = '\nzip = "2.4.2"\n'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '\nzip = "=9.0.5"\n'))
          PY
          cargo update -p zip --precise 9.0.5
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          python3 - <<'PY'
          import tomllib
          with open('Cargo.lock', 'rb') as f:
              packages = tomllib.load(f)['package']
          for name, expected in {'url':'2.5.9', 'cookie':'0.18.3', 'zip':'9.0.5','libsqlite3-sys':'0.39.1','sqlx':'0.9.1'}.items():
              versions = [p['version'] for p in packages if p['name'] == name]
              print(name, versions)
              assert versions == [expected], (name, versions)
          PY
          git diff --check
          git grep -n -E 'zip::|ZipArchive|ZipWriter' -- core-plugins || true
      - name: Record combined candidate patch
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        run: |
          git diff --stat
          echo 'RC3-CANDIDATE-DIFF-BEGIN'
          git diff --no-ext-diff --binary -- Cargo.toml Cargo.lock
          echo 'RC3-CANDIDATE-DIFF-END'
      - name: Full unchanged security policy
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
      - name: Focused HTTP regressions
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        run: cargo test --locked -p codex-http-client --lib
      - name: Focused plugin archive regressions
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        run: cargo test --locked -p codex-core-plugins --lib
