# Temporary, owner-scoped Cargo.lock regeneration only for 3E.2.
# Remove this write-capable workflow once the generated lockfile is verified.
name: CodexDD 0.4.3 generated Cargo lockfile

on:
  push:
    branches:
      - dd/codexdd-v0.4.3-upstream-0.162.0-integration
    paths:
      - .github/workflows/codexdd-043-lockfile-generation.yml

permissions:
  contents: write

concurrency:
  group: codexdd-043-lockfile-generation
  cancel-in-progress: false

jobs:
  generate-cargo-lockfile:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact nonproduction source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Assert fork branch and unpromoted provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.2'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.159.2'
          test -z "$(git status --porcelain)"
          echo "Cargo lock generation input: $GITHUB_SHA"

      - name: Configure repository build dependencies
        uses: ./.github/actions/setup-ci

      - name: Use pinned repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Resolve existing manifest dependencies and regenerate only Cargo.lock
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Review and fail closed on any non-lock drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'codex-rs/Cargo.lock'
          test -z "$(git ls-files --others --exclude-standard)"
          test -n "$(git diff -- codex-rs/Cargo.lock)"
          git diff --check
          git diff --stat -- codex-rs/Cargo.lock
          echo "Generated lockfile SHA256:"
          sha256sum codex-rs/Cargo.lock
          echo "Source file modifications are prohibited in this packet."

      - name: Commit only the generated lockfile to the integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration | cut -f1)" = "$GITHUB_SHA"
          git add -- codex-rs/Cargo.lock
          test "$(git diff --cached --name-only)" = 'codex-rs/Cargo.lock'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(codexdd 0.4.3): regenerate 0.162 Cargo.lock from pinned manifests'
          git push origin 'HEAD:refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
