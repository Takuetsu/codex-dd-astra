# Single-use, branch-scoped generated-artifact acceptance. Commits only exact files from
# the reviewed, hashed, read-only generator artifact. No handwritten code, Cargo.lock,
# version, releases, publication, tags or deployment may be changed by this job.
name: CodexDD 0.4.5 accept pinned generated schemas (nonrelease)

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - '.github/workflows/codexdd-045-accept-generated-artifact.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: codexdd045-once-generated-accept-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept-reviewed-generator-output:
    name: Accept SHA-pinned 31 generated outputs only
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision for single guarded commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assert branch, unchanged generated baseline, no release authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Takuetsu/codex-dd-astra"
          test "$GITHUB_REF" = "refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "b14742f3a9203fe7453092527f739ac3b4d26db6"
          git cat-file -e f3a5fbc3b5de5886d8d8f7f76fc7a90a61c31ec4^{commit}
          git diff --quiet f3a5fbc3b5de5886d8d8f7f76fc7a90a61c31ec4 HEAD -- \
            codex-rs/app-server-protocol/schema codex-rs/core/config.schema.json \
            sdk/python/src/openai_codex/generated
          test "$(git hash-object codex-rs/Cargo.lock)" = "096939fcec32cb259bccc0cb36c5d4120701da57"
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = "0.4.4"
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = "rust-v0.162.0"
          test -z "$(git status --porcelain)"

      - name: Download one exact immutable GitHub Actions generator artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/Takuetsu/codex-dd-astra/actions/artifacts/12235229160/zip' \
            --output "$RUNNER_TEMP/codexdd045-generated.zip"
          printf '%s  %s\n' \
            e67bc0a1f3ebde2018b9feaec5b1460de3adf5bb217aaae60626f496546098bd \
            "$RUNNER_TEMP/codexdd045-generated.zip" | sha256sum --check

      - name: Verify 0.163 provenance, allowlist and ZIP checksum; stage only generated bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import zipfile

          artifact = Path(os.environ["RUNNER_TEMP"]) / "codexdd045-generated.zip"
          prefix = "codexdd045-generated-candidate/"
          with zipfile.ZipFile(artifact) as archive:
              manifest_bytes = archive.read(prefix + "manifest.json")
              assert hashlib.sha256(manifest_bytes).hexdigest() == (
                  "931a32afbb7cdbfbfd1c828408750cb8f55cfbcdd981987909e3201c019c102c"
              )
              manifest = json.loads(manifest_bytes)
              assert manifest["head_sha"] == "f3a5fbc3b5de5886d8d8f7f76fc7a90a61c31ec4"
              assert manifest["cargo_lock_blob"] == "096939fcec32cb259bccc0cb36c5d4120701da57"
              assert manifest["deleted"] == [] and manifest["forbidden"] == []
              paths = sorted(manifest["changed"])
              assert len(paths) == 31 and len(set(paths)) == 31
              assert hashlib.sha256("\n".join(paths).encode()).hexdigest() == (
                  "233d0d2890b71a8d72372587da7b50e662a4432bdc1cfe602a2b56a6392e7fe6"
              )
              for path in paths:
                  p = PurePosixPath(path)
                  assert not p.is_absolute() and ".." not in p.parts and "\\" not in path
                  assert (path.startswith("codex-rs/app-server-protocol/schema/")
                          or path == "codex-rs/core/config.schema.json"
                          or path.startswith("sdk/python/src/openai_codex/generated/"))
                  info = archive.getinfo(prefix + path)
                  assert not (info.external_attr >> 16) & 0o170000 == 0o120000
                  assert info.file_size < 8_000_000
                  payload = archive.read(info)
                  target = Path(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
              subprocess.run(["git", "add", "--", *paths], check=True)
              staged = subprocess.run(["git", "diff", "--cached", "--name-only"],
                                      check=True, text=True, capture_output=True).stdout.splitlines()
              assert staged == paths, (staged, paths)
              status = subprocess.run(["git", "status", "--porcelain", "--untracked-files=all"],
                                      check=True, text=True, capture_output=True).stdout
              assert all(line[3:] in paths for line in status.splitlines()), status
              print("PASS: original generator source SHA and archive checksum verified")
              print("PASS: exactly 31 allowlisted, generated files staged; no unrelated changes")
          PY
          git diff --cached --check
          test "$(git hash-object codex-rs/Cargo.lock)" = "096939fcec32cb259bccc0cb36c5d4120701da57"
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = "0.4.4"
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = "rust-v0.162.0"

      - name: Commit only approved outputs to integration branch (never release)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(codexdd 0.4.5): accept 31 exact 0.163 generated schema and SDK outputs'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 31
          git push origin HEAD:refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration
          echo 'Accepted 31 generated files only. Release still 0.4.4; no publication.'
