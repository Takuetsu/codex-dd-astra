# Bounded 3F.52 audit: only source Git blobs and Python; no Rust/Windows build.
name: CodexDD 0.4.5 3F.52 complete app-server source owner audit (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f52-appserver-owner-source-closure]
    paths: [".github/workflows/codexdd-045-3f52-source-review.yml"]
permissions:
  contents: read
jobs:
  owner-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '31cdaa8ed5a6b7594e2a82dddf1d4d39b2b73c5e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact fork source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove all eleven source deltas and prior generated transport compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f52_appserver_owner_source.py -v
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f51_exact_upstream_semantic_deltas.py -q
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f51_generated_protocol_parity.py -q
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f51_appserver_event_semantics.py -q
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
