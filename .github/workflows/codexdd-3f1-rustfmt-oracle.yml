name: CodexDD 3F.1 exact rustfmt oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-3f1-rustfmt-oracle.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Apply exact work-packet rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt -- --config imports_granularity=Item
          cd ..
          if git diff --quiet; then
            echo "NO_DIFF"
            exit 0
          fi
          echo "Formatter changed:"
          git diff --stat
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs
          git commit -m "style: apply exact 3F.1 work-packet rustfmt"
          git push origin HEAD:dd/codexdd-v0.4.0-local-validation-orchestrator
