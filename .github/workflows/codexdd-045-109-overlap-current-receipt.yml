# Read-only exact 109-overlap source review. NEVER marks semantic acceptance.
name: CodexDD 0.4.5 109 overlap current-source inventory (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-109-overlap-current-receipt.yml"]
permissions:
  contents: read
jobs:
  source-inventory:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'a10030c7265481167162e0e566aa852132e146a0'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate, no credential persistence
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact nonrelease source parent and marker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a10030c7265481167162e0e566aa852132e146a0'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test "$(git hash-object codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test -z "$(git status --porcelain)"
      - name: Reconcile 109 historical overlaps and 15 true conflicts with current stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overlap109"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import os
          root=Path(".")
          prior=json.loads((root/"docs/upstream-candidates/codexdd-upstream-rust-v0.163.0-overlap-source-receipt.json").read_text())
          direct=json.loads((root/"docs/upstream-candidates/codexdd-upstream-rust-v0.163.0-original-direct-conflicts.json").read_text())
          assert prior["upstream_fork_overlap_paths"]==109
          assert len(prior["overlaps"])==109 and len(direct["conflicts"])==15
          assert direct["total_direct_conflicts"]==15
          raw=subprocess.check_output(["git","ls-tree","-r","-z","HEAD"])
          tree={}
          for item in raw.split(b"\0"):
              if not item: continue
              identity,path=item.split(b"\t",1)
              mode,kind,sha=identity.split()
              assert kind==b"blob"
              tree[path.decode()]=sha.decode()
          recorded={entry["path"]:entry for entry in prior["overlaps"]}
          conflicts={entry["path"]:entry for entry in direct["conflicts"]}
          assert len(recorded)==109 and len(conflicts)==15
          assert set(conflicts).issubset(recorded)
          unchanged=[]; updated=[]; reverted=[]; missing=[]
          for path,old in sorted(recorded.items()):
              current=tree.get(path)
              if not current: missing.append(path); continue
              if current==old["production_044_blob"]: reverted.append(path)
              if current==old["reviewed_045_blob"]: unchanged.append(path)
              else: updated.append({
                  "path":path,
                  "historical_reviewed_blob":old["reviewed_045_blob"],
                  "current_blob":current,
                  "is_original_direct_conflict":path in conflicts,
                  "requires_review":True,
              })
          assert not missing, "missing 109-overlap sources: "+repr(missing)
          assert not reverted, "production identity reversion: "+repr(reverted)
          assert len(unchanged)+len(updated)==109
          output={
              "result":"SOURCE IDENTITY CHECK ONLY: ALL SEMANTIC GATES STILL OPEN",
              "source_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "historical_snapshot":prior["refs"]["integration_snapshot"],
              "total_original_overlaps":109,
              "total_original_direct_conflicts":15,
              "unchanged_from_frozen_receipt":len(unchanged),
              "changed_since_receipt":len(updated),
              "unreviewed_source_updates":updated,
              "original_15_current":[
                  {"path":p,"current_blob":tree[p],"historical_reviewed_blob":conflicts[p]["integration_reviewed_blob"],
                   "historical_native_gate":conflicts[p]["remaining_native_gate"],
                   "release_status":"NOT_ACCEPTED"}
                  for p in sorted(conflicts)
              ],
          }
          path=Path(os.environ["RUNNER_TEMP"])/"overlap109"
          (path/"current-source-inventory.json").write_text(json.dumps(output,indent=2)+"\n")
          report=[
              "# 0.4.5 current 109-overlap semantic review queue",
              "Nonrelease SOURCE IDENTITY ONLY. No semantic or release signoff.",
              f"Current source: {output['source_commit']}",
              f"109 present, {len(unchanged)} historical identities, {len(updated)} changed since reviewed receipt",
              "## Source changes requiring renewed review",
          ]
          report+=["- "+e["path"]+" ("+e["current_blob"]+")" for e in updated]
          report+=["## Original 15 direct conflicts (all still NOT_ACCEPTED)"]
          report+=["- "+e["path"]+": "+e["historical_native_gate"]
                   for e in output["original_15_current"]]
          (path/"source-review-queue.md").write_text("\n".join(report)+"\n")
          print("\n".join(report)[:16000])
          print("PASS: exact 109 source inventory and 15 direct-conflict boundary; semantic signoff still pending")
          PY
          git diff --exit-code
      - name: Upload nonrelease source inventory
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-current-109-semantic-review-source-only
          path: ${{ runner.temp }}/overlap109
          if-no-files-found: warn
          retention-days: 7
