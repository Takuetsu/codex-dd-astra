# Temporary read-only diagnostic for docs-only Prettier mismatch.
# Prints formatter-generated diff; does not commit, push, or modify production.
name: CodexDD 0.4.3 runbook repeat-Prettier diagnostic
on:
  push:
    branches:
      - docs/codexdd-ssh-safe-release-validation
    paths:
      - .github/workflows/codexdd-043-runbook-prettier-oracle.yml
permissions:
  contents: read
jobs:
  exact-prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Use exact frozen package lock
        run: pnpm install --frozen-lockfile
      - name: Compare prior and repeated Prettier output
        shell: bash
        run: |
          set -euo pipefail
          echo "GIT HEAD: $(git rev-parse HEAD)"
          git hash-object docs/codexdd-ssh-safe-native-release-validation.md
          echo '=== CODEXDD_FMT_BEFORE ==='
          pnpm run format || true
          pnpm exec prettier --write docs/codexdd-ssh-safe-native-release-validation.md
          echo '=== CODEXDD_REPEAT_PRETTIER_PATCH_BEGIN ==='
          git diff --no-ext-diff --unified=2 -- docs/codexdd-ssh-safe-native-release-validation.md
          echo '=== CODEXDD_REPEAT_PRETTIER_PATCH_END ==='
          echo '=== CODEXDD_FMT_AFTER ==='
          pnpm run format || true
