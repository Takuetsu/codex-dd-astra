# Temporary isolated read-only release-profile contract check.
# This is NOT the 21-stage release run or a production candidate.
name: CodexDD 0.4.4 release companion-host static gate

on:
  push:
    branches:
      - dd/codexdd-0.4.4-release-companion-host-guard
    paths:
      - .github/workflows/codexdd-044-release-host-static-gate.yml
      - scripts/codexdd-test-release.ps1

permissions:
  contents: read

jobs:
  windows-static:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-0.4.4-release-companion-host-guard'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated source boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected checkout SHA' }
          git merge-base --is-ancestor a79378618728a5ad63fbf7b204ae9a0ea1fecb29 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate ancestry was not preserved' }
          git diff --quiet a79378618728a5ad63fbf7b204ae9a0ea1fecb29 HEAD -- codex-rs
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected product Rust source change' }
          if ((Get-Content -Raw codex-rs/codexdd-version.txt).Trim() -ne '0.4.4') { throw 'Wrong product identity' }

      - name: Assert 21-stage release profile and companion host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/codexdd-test-release.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors -join '; ') }
          $source = Get-Content -LiteralPath $path -Raw
          $stageCount = [regex]::Matches($source, 'New-CodexDDValidationStage -Name').Count
          if ($stageCount -ne 21) { throw "Unexpected release stage count: $stageCount" }
          $buildLine = @($source -split "\r?\n" | Where-Object { $_ -match 'New-CodexDDValidationStage -Name "cli-release-build"' })
          if ($buildLine.Count -ne 1) { throw 'Missing or duplicate CLI release stage' }
          if ($buildLine[0] -notmatch '"codex-cli", "-p", "codex-code-mode-host", "--release", "--locked"') {
            throw 'Release cargo stage did not include both locked executables'
          }
          Write-Host 'RELEASE_COMPANION_HOST_STATIC_GATE_PASS: 21 unchanged stage names, CLI + companion, parsed PS syntax'

      - name: Confirm read-only source
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (git status --porcelain) { git status --short; throw 'Static gate modified source' }
