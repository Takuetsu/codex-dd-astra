# Branch-local native Windows core authority/continuation regression checks; no release authority.
# Never publish, package, deploy, merge, or advance CodexDD 0.4.4 product markers.
name: CodexDD 0.4.5 Windows core authority safety

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - ".github/workflows/codexdd-045-windows-core-authority.yml"
      - "codex-rs/core/src/client_tests.rs"
      - "codex-rs/core/src/session/rollout_reconstruction_tests.rs"
      - "codex-rs/core/src/session/step_activation.rs"
      - "codex-rs/core/src/session/step_activation_tests.rs"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexdd-045-core-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-authority:
    name: Windows core adaptive authority and replay (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout exact integration SHA without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Assert branch, pinned Cargo lock, no release marker promotion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Takuetsu/codex-dd-astra') { throw 'Wrong repository' }
          if ($env:GITHUB_REF -ne 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration') { throw 'Wrong branch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          if ((git hash-object -- codex-rs/Cargo.toml).Trim() -ne 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4') { throw 'Unreviewed Cargo manifest' }
          if ((git hash-object -- codex-rs/Cargo.lock).Trim() -ne 'a6cd27b0b70fde2f2be9c1777f3666ad3fa318bb') { throw 'Unreviewed Cargo.lock' }
          if ((git hash-object -- codex-rs/deny.toml).Trim() -ne 'ea7fdc149fc880c6b36d75c29851641034289a4e') { throw 'Unreviewed advisory policy' }
          if ((Get-Content 'codex-rs/codexdd-version.txt' -Raw).Trim() -ne '0.4.4') { throw 'Production version changed' }
          if ((Get-Content 'codex-rs/upstream-codex-release.txt' -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Release upstream changed' }
          if ((git hash-object -- codex-rs/core/src/context_manager/history_tests.rs).Trim() -ne '4f8415b4ce3f3994d4fe8eb87bcbd22e6588848d') { throw 'Unreviewed inherited history conflict' }
          if ((git hash-object -- codex-rs/core/src/context_manager/normalize.rs).Trim() -ne '4ca88c6a668e9896df06ca81940a0e41e357898d') { throw 'Unreviewed history-normalization conflict' }
          if ((git hash-object -- codex-rs/core/src/tools/registry.rs).Trim() -ne 'fc75b3bbf91f1881bd32faaaca93356fbb598b5e') { throw 'Unreviewed protected tool-registry conflict' }

      - name: Configure native Windows scratch paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'codexdd045'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CI_BUILD_ROOT=$root"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git long paths unavailable' }

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Reuse integration-only Cargo test artifact cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codexdd045/target
          key: codexdd045-core-authority-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            codexdd045-native-focused-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-
            codexdd045-tests-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-
            codexdd045-tests-${{ runner.os }}-

      - name: Verify exact locked Cargo resolver
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock drift' }

      - name: Configure repository-pinned Windows Rusty V8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Run 15 focused native core authority and original-conflict regressions
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          # Native behavior, not source-marker matching. Stop on first failure.
          $cases = @(
            'validation_terminalization_requests_required_tool_choice',
            'reasoning_effort_for_requests_uses_multi_agent_override_for_ultra',
            'reasoning_effort_for_requests_falls_back_for_missing_or_invalid_override',
            'resumed_history_recovers_orphan_custom_tool_call_without_panicking',
            'record_initial_history_ignores_security_risk_scores',
            'delayed_activation_does_not_retarget_a_task',
            'reviewer_only_activation_enforces_managed_authority',
            'activation_must_match_the_retained_turn_authority',
            'guardian_v2_classification_settings_match_the_admitted_authority',
            'delivered_assistant_context_invalidates_reviews_without_changing_authorization',
            'checkpoint_replayed_messages_keep_legacy_review_when_the_source_survives',
            'legacy_inter_agent_assistant_messages_are_not_turn_boundaries',
            'adaptive_reconnaissance_rejects_hook_rewritten_write_command',
            'adaptive_reconnaissance_rejection_finishes_blocked_without_start',
            'adaptive_validation_terminalization_allows_only_trusted_signal_tool'
          )
          $index = 0
          foreach ($case in $cases) {
            $path = Join-Path $env:RUNNER_TEMP ("codexdd045-core-authority-{0:D2}.log" -f $index)
            Write-Host "CASE $($index+1)/$($cases.Count): $case"
            $command = 'cargo test --locked -p codex-core --lib ' + $case + ' -- --test-threads=1 > "' + $path + '" 2>&1'
            & cmd.exe /d /c $command
            $rc = $LASTEXITCODE
            if (-not (Test-Path -LiteralPath $path)) { throw "No log for $case" }
            $tail = (Get-Content -LiteralPath $path -Tail 80) -join "`n"
            Write-Host $tail
            if ($rc -ne 0) { throw "Core authority native test $case failed with exit $rc; see artifact" }
            if ($tail -notmatch '(?m)^test result: ok\.\s+[1-9][0-9]* passed;') {
              throw "No tests matched core authority filter $case"
            }
            $index++
          }
          Write-Host "PASS: $index/$($cases.Count) native core authority and original-conflict regressions."

      - name: Upload native core authority logs without publishing
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-core-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexdd045-core-authority-*.log
          if-no-files-found: warn
          retention-days: 7
