# NONRELEASE. One source-bound Windows native acceptance after the green 3F.73 cheap source gate.
name: CodexDD 0.4.5 3F.76 bounded payload Windows native acceptance (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f76-bounded-payload-and-switch]
    paths:
      [".github/workflows/codexdd-045-3f73-bounded-fifo-windows-native.yml"]
permissions:
  contents: read

jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'e239b13581b510e1aeca3b00ff0d343932c13519'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pin immutable runtime source, test identities and unwaived holds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e239b13581b510e1aeca3b00ff0d343932c13519'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root=Path("codex-rs/tui/src")
          events=(root/"app/thread_events.rs").read_text()
          routing=(root/"app/thread_routing.rs").read_text()
          startup=(root/"app/startup.rs").read_text()
          app=(root/"app.rs").read_text()
          assert "mpsc::unbounded_channel()" not in events
          assert "THREAD_EVENT_LIVE_CAPACITY: usize = 64;" in app
          assert "THREAD_EVENT_PENDING_LIMIT: usize = 16;" in app
          assert "queue_live_event" in routing and "flush_pending_live_thread_events" in startup
          assert "live_event_backpressure" in startup
          assert "ThreadInterruptWarning" in (root/"app_event.rs").read_text()
          assert "THREAD_EVENT_MAX_WIRE_BYTES: usize = 2 * 1024 * 1024;" in app
          assert "THREAD_EVENT_PENDING_PRIMARY_LIMIT: usize = 128;" in app
          assert "ensure_notification_budget(&notification)?" in routing
          assert "ensure_history_budget(&event)?" in routing
          assert "serialized_live_event_bytes" in events
          tests=[
            "live_thread_event_queue_keeps_adaptive_terminal_before_turn_completed_past_replay_capacity",
            "saturated_queue_retains_fifo_approval_and_completion_once",
            "saturated_queue_count_remains_bounded_and_fifo_over_repeated_drains",
            "bounded_live_queue_fails_closed_if_owner_task_would_overflow",
            "saturated_queue_preserves_feedback_between_approval_and_completion",
            "live_queue_rejects_oversized_voice_audio_before_buffering_without_silent_drop",
            "live_queue_limits_oversized_history_without_rejecting_small_history",
          ]
          for test in tests:
            assert len(re.findall(r"\bfn\s+"+test+r"\s*\(",events))==1,test
          app_tests=(root/"app/tests.rs").read_text()
          for test in [
            "enqueue_thread_event_does_not_block_when_channel_full",
            "inactive_thread_overflow_does_not_starve_foreground_or_block_switch",
            "oversized_live_notification_is_rejected_before_replay_is_mutated",
            "pre_session_thread_staging_is_bounded_and_fails_closed",
          ]:
            assert len(re.findall(r"\bfn\s+"+test+r"\s*\(",app_tests))==1,test
          spec=json.loads(Path("docs/upstream-candidates/codexdd-045-3f68-native-test-cases.json").read_text())
          formal=json.loads(Path("docs/upstream-candidates/codexdd-045-3f55-formal-owner-approvals.json").read_text())
          assert spec["expected_tui"]==25==len(spec["cases"]["tui"])
          assert formal["approved_owner_count"]==0 and len(formal["pending_native_or_semantic_restoration"])==13
          print("PASS: 25 trust + 11 bounded FIFO/payload selector identities; no owner waiver")
          PY
          git diff --check
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - name: Cheap source format check without compilation
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check

  windows-native:
    needs: cheap-source
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact code identity and production isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected native source' }
          if ((git rev-parse HEAD:codex-rs/Cargo.lock).Trim() -cne '13bc15ff844e93dfaf7777c73bb7313b35bb3b81') { throw 'Lockfile drift' }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Version promoted' }
          if (git status --porcelain --untracked-files=no) { throw 'Dirty tracked files' }
      - name: Configure bounded scratch and long paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP 'codexdd045-3f73'
          New-Item -ItemType Directory -Force -Path (Join-Path $base 'target'),(Join-Path $base 'tmp') | Out-Null
          New-Item -ItemType Directory -Force -Path 'native-evidence' | Out-Null
          @(
            "CARGO_TARGET_DIR=$(Join-Path $base 'target')"
            "TEMP=$(Join-Path $base 'tmp')"
            "TMP=$(Join-Path $base 'tmp')"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
          ) | Add-Content $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Restore Cargo sources only (no giant build outputs)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-3f73-source-static
          restore-keys: |
            codexdd045-3f12-source-
            codexdd045-crypto-msvc-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Compile one true Windows TUI libtest binary (fail fast)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:GITHUB_WORKSPACE 'native-evidence/tui-lib-compile.log'
          Push-Location codex-rs
          try {
            & cmd.exe /d /c ('cargo test --locked -p codex-tui --lib --no-run > "'+$log+'" 2>&1')
            if ($LASTEXITCODE -ne 0) {
              Write-Host ((Get-Content $log -Tail 90) -join [Environment]::NewLine)
              throw 'Native TUI test compile failed; no selector attempts'
            }
          } finally { Pop-Location }
          Write-Host 'PASS: PRECOMPILE_TUI_LIB'
      - name: Run prior 25 Windows trust tests and 11 true queue/payload regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $logRoot=Join-Path $root 'native-evidence'
          $failed=@()
          & .github/scripts/codexdd-045-3f68-run-native-tests.ps1 -ExpectedHead $env:GITHUB_SHA -Group Tui -LogRoot $logRoot
          if ($LASTEXITCODE -ne 0) { $failed+=@('25-case-tui-suite') }
          $selectors=@(
            'live_thread_event_queue_keeps_adaptive_terminal_before_turn_completed_past_replay_capacity',
            'saturated_queue_retains_fifo_approval_and_completion_once',
            'saturated_queue_count_remains_bounded_and_fifo_over_repeated_drains',
            'bounded_live_queue_fails_closed_if_owner_task_would_overflow',
            'saturated_queue_preserves_feedback_between_approval_and_completion',
            'live_queue_rejects_oversized_voice_audio_before_buffering_without_silent_drop',
            'live_queue_limits_oversized_history_without_rejecting_small_history',
            'enqueue_thread_event_does_not_block_when_channel_full',
            'inactive_thread_overflow_does_not_starve_foreground_or_block_switch',
            'oversized_live_notification_is_rejected_before_replay_is_mutated',
            'pre_session_thread_staging_is_bounded_and_fails_closed'
          )
          $cases=@()
          Push-Location codex-rs
          try {
            foreach($selector in $selectors) {
              $log=Join-Path $logRoot ($selector+'.log')
              & cmd.exe /d /c ('cargo test --locked -p codex-tui --lib '+$selector+' -- --test-threads=1 > "'+$log+'" 2>&1')
              $status=[int]$LASTEXITCODE
              $tail=(Get-Content -LiteralPath $log -Tail 50) -join [Environment]::NewLine
              $match=[regex]::Match($tail,'(?m)^test result: ok\.\s+([1-9][0-9]*) passed;\s+0 failed;')
              $pass=($status -eq 0 -and $match.Success -and [int]$match.Groups[1].Value -eq 1)
              $cases+=@{selector=$selector;passed=$pass;native_exit=$status}
              Write-Host ('NATIVE_FIFO: '+$selector+' '+$(if($pass){'PASS'}else{'FAIL'}))
              if(-not $pass){Write-Host $tail;$failed+=@($selector)}
            }
          } finally { Pop-Location }
          $receipt=[ordered]@{
            kind='CODEXDD_045_3F76_BOUNDED_PAYLOAD_NONRELEASE'
            tested_head=$env:GITHUB_SHA
            prior_tui_selectors=25
            new_fifo_selectors=11
            cases=@($cases)
            failures=@($failed)
            release_approved=$false
            formal_owner_approvals=0
            done_utc=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $logRoot '3f76-receipt.json') -Encoding utf8
          if($failed.Count -gt 0){throw ('Native acceptance red: '+($failed -join ', '))}
          Write-Host 'CODEXDD_045_3F76_NATIVE=PASS_36_OF_36_NONRELEASE'
      - name: Always upload source-bound logs and acceptance receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f76-payload-native-evidence
          path: native-evidence/*
          if-no-files-found: warn
          compression-level: 3
          retention-days: 7
