# One-shot cheap source-only proof; native Windows test follows only after source is green.
name: CodexDD 0.4.5 dynamic auth TUI source receipts (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f25-session-source.yml"]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'ebb6975b7ee78e00299cfd3f9bd2f33fa5fc9789'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read exact source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate exact parent and nonrelease pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ebb6975b7ee78e00299cfd3f9bd2f33fa5fc9789'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(cat codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
      - name: Prove narrow auth test restoration and existing correction guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f25_dynamic_auth_regression.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f14_owner_matrix.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f20_startup_timeout_guard.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f23_govcloud_restore.py' -v
          test -z "$(git status --porcelain)"
