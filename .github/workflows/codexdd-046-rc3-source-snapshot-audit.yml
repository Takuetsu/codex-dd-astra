# Cheap, audit-only source inventory for all ThreadSettingsSnapshot literals.
# No production test, permission change, signing, or release approval.
name: CodexDD 0.4.6 RC3 snapshot constructor inventory

on:
  push:
    branches:
      - dd/codexdd-v0.4.6-3f1-audit
    paths:
      - .github/workflows/codexdd-046-rc3-source-snapshot-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-constructor-inventory:
    name: Exact RC3 all Rust ThreadSettingsSnapshot constructor inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 2acc2209b65f3186b00490b1c4b0cc444a636f4c
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm exact candidate and inventory snapshot constructors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2acc2209b65f3186b00490b1c4b0cc444a636f4c'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.6'
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("codex-rs")
          locations = []
          for p in sorted(root.rglob("*.rs")):
              s = p.read_text(encoding="utf-8")
              for m in re.finditer(r"\bThreadSettingsSnapshot\s*\{", s):
                  line = s.count("\n", 0, m.start()) + 1
                  near = s[m.end():].splitlines()[:58]
                  previous = s[max(0, m.start() - 180):m.start()]
                  # A function return type plus body is not a struct literal.
                  is_method = bool(re.search(r"->\s*$", previous))
                  inherited = any(re.match(r"^\s*\.\.\s*[A-Za-z_]\w*", x) for x in near)
                  present = any("codexdd_first_worker" in x for x in near)
                  classification = ("return-type" if is_method else
                                    "struct-update" if inherited else
                                    "explicit-marker" if present else "MISSING_MARKER")
                  locations.append((str(p), line, classification))
          for path, line, classification in locations:
              print(f"SNAPSHOT_REFERENCE {path}:{line} class={classification}")
          missing = [(p, n) for p, n, cls in locations if cls == "MISSING_MARKER"]
          print(f"REVIEW_COUNTS total={len(locations)} missing_explicit_constructor_fields={len(missing)}")
          if missing:
              print("REVIEW_MISSING_SNAPSHOT_FIELDS", missing)
              raise SystemExit(1)
          PY
          git diff --check
