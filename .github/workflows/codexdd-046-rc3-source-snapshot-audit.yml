# Nonproduction, source-only inventory of RC3 ThreadSettingsSnapshot references.
# This intentionally checks exact RC3 implementation source, not the audit branch.
# Not a security signoff or permission to merge, install, sign or release.
name: CodexDD 0.4.6 RC3 source snapshot constructor audit

on:
  push:
    branches:
      - dd/codexdd-v0.4.6-3f1-audit
    paths:
      - .github/workflows/codexdd-046-rc3-source-snapshot-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-constructor-inventory:
    name: Exact RC3 Rust ThreadSettingsSnapshot constructor inventory
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 2acc2209b65f3186b00490b1c4b0cc444a636f4c
          persist-credentials: false
      - name: Confirm exact RC3 source and enumerate constructors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2acc2209b65f3186b00490b1c4b0cc444a636f4c'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.6'
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("codex-rs")
          records = []
          for path in sorted(root.rglob("*.rs")):
              source = path.read_text(encoding="utf-8")
              for m in re.finditer(r"\bThreadSettingsSnapshot\s*\{", source):
                  line = source.count("\n", 0, m.start()) + 1
                  prefix = source[max(0, m.start() - 80):m.start()]
                  # A function return type followed by a body is not a literal.
                  if re.search(r"->\s*$", prefix):
                      classification = "return-type"
                  else:
                      # A struct-update expression inherits omitted fields.
                      fragment = "\n".join(source[m.end():].splitlines()[:58])
                      inherited = bool(re.search(r"(?m)^\s*\.\.\s*[A-Za-z_]\w*", fragment))
                      explicit = "codexdd_first_worker" in fragment
                      classification = (
                          "struct-update" if inherited else
                          "explicit-marker" if explicit else
                          "MISSING_MARKER"
                      )
                  records.append((str(path), line, classification))
                  print(f"SNAPSHOT_REFERENCE {path}:{line} class={classification}")

          missing = [(p, n) for p, n, c in records if c == "MISSING_MARKER"]
          print(f"REVIEW_COUNTS total={len(records)} missing_explicit_constructor_fields={len(missing)}")
          if not records or missing:
              print("REVIEW_MISSING_SNAPSHOT_FIELDS", missing)
              raise SystemExit(1)
          PY
          git diff --check
          test -z "$(git status --porcelain)"
