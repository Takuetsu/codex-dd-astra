# Temporary branch-only, cheap-before-release regression gate for the trusted
# phase transition. This workflow is removed before promotion to PR #53.
name: CodexDD 0.4.4 mechanical handoff fast check

on:
  push:
    branches:
      - dd/codexdd-0.4.4-mechanical-handoff-visibility
    paths:
      - .github/workflows/codexdd-044-mechanical-handoff-fast.yml
      - codex-rs/tui/src/chatwidget/adaptive_admission.rs
      - codex-rs/tui/src/chatwidget/adaptive_runtime_bridge.rs
      - codex-rs/tui/src/chatwidget/tests/adaptive_effort_tests.rs
      - codex-rs/core/src/tools/handlers/adaptive_signal.rs
      - codex-rs/core/src/tools/handlers/adaptive_signal_tests.rs

permissions:
  contents: read

concurrency:
  group: codexdd-044-mechanical-handoff-fast
  cancel-in-progress: true

jobs:
  bounded-handoff:
    name: Focused Windows mechanical phase and tool-spec regressions
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout isolated handoff correction
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify source branch and exact parent candidate
        shell: pwsh
        working-directory: .
        run: |
          if ('${{ github.ref_name }}' -ne 'dd/codexdd-0.4.4-mechanical-handoff-visibility') {
            throw 'Only the isolated handoff branch is authorized.'
          }
          git merge-base --is-ancestor 9f502bfa6f861a5b091ca87f7a0e0fa2ca1fe9b5 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source is not based on accepted PR #53 candidate.' }

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Fail-fast complete Rust formatting gate
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: TUI helper enforces validation-only transition prompt
        run: cargo test --locked -p codex-tui --lib accepted_complexity_implementation_prompts_validation_only_mechanical_handoff

      - name: TUI actual successor includes trusted signal instruction
        run: cargo test --locked -p codex-tui --lib accepted_routine_complexity_successor_explains_how_to_expose_native_validator

      - name: Other Workers do not gain mechanical authority
        run: cargo test --locked -p codex-tui --lib nonimplementation_continuation_does_not_gain_mechanical_validation_authority

      - name: Core signal schema explains validation-only tool visibility
        run: cargo test --locked -p codex-core --lib tool_spec_documents_repository_handoff_terminal_mapping

      - name: Preserve clean source
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
