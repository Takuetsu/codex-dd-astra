# Source-only 3F.59 private state/memory review; no Cargo/Bazel build.
name: CodexDD 0.4.5 3F.59 private persistence memory upstream review (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f59-persistence-semantic-review]
    paths: [".github/workflows/codexdd-045-3f59-source-review.yml"]
permissions:
  contents: read
jobs:
  source-review:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'a2fe67b13c6546d2ec2cdc453cd833a8784cb61c'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove exact upstream 0.163 source reconstructions, private-state non-leakage and owner boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f59_persistence_memory_semantics.py -v
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f58_seven_binary_evidence.py -q
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f57_cli_state_semantics.py -q
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f55_formal_owner_approvals.py -q
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
