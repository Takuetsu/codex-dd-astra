name: pr-fast

# Focused pre-merge validation for this fork. Windows is the supported runtime
# target, so PR-fast validates the adaptive feature and codex-cli on Windows.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows-adaptive:
    name: Windows adaptive validation
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Parse F2 daemon smoke-test PowerShell
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\codexdd-f2-daemon-smoke.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Invalid PowerShell smoke-test syntax'
          }

      - name: Validate 21-stage release PowerShell syntax
        shell: powershell
        run: |
          foreach ($relative in @(
            'scripts\codexdd-test-release.ps1',
            'scripts\codexdd-test-app-server-release.ps1',
            'scripts\codexdd-prepare-rusty-v8.ps1',
            'scripts\codexdd-test-cli-release.ps1'
          )) {
            $source = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.ToString() }
              throw "Invalid release PowerShell syntax: $relative"
            }
          }
          $release = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'scripts\codexdd-test-release.ps1') -Raw
          $stageCount = ([regex]::Matches($release, 'New-CodexDDValidationStage -Name')).Count
          if ($stageCount -ne 21) { throw "Release profile must retain 21 stages; found $stageCount" }

      - name: Build codex-cli
        run: cargo build -p codex-cli

      - name: Core adaptive signal tests
        run: cargo test -p codex-core adaptive_signal --lib --no-fail-fast

      - name: Core CodexDD native LVO contract regressions
        run: cargo test --locked -p codex-core codexdd_validation --lib --no-fail-fast

      - name: Mechanical Validation command-policy regressions
        run: cargo test --locked -p codex-core adaptive_mechanical_validation_shell_gate --lib --no-fail-fast

      - name: TUI adaptive controller tests
        run: cargo test -p codex-tui adaptive_controller_tests --lib --no-fail-fast

      - name: TUI trusted adaptive signal tests
        run: cargo test -p codex-tui adaptive_trusted_signal --lib --no-fail-fast

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
