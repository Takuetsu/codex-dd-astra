# One-shot upstream 0.163 Windows SQLite + CLI Bazel compatibility/lock validation.
# Only the fork's 0.4.5 integration branch; never merge, release, or publish.
name: CodexDD 0.4.5 Windows SQLite Bazel reconciliation

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - '.github/workflows/codexdd-045-bazel-sqlite-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: codexdd045-sqlite-bazel
  cancel-in-progress: false

jobs:
  module-and-target:
    name: Verify SQLite Bazel graph and reconcile lock (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANCHOR_PARENT: '1a4f49a275357932841825bdb964a29f665f3de4'
      EXPECTED_MODULE_BLOB: 'd178d9882169a5c06e42869338c99c4300e4e791'
      INITIAL_LOCK_BLOB: '40c46197d71c93d3ea7fbdea1930c9bf394ae6df'
    steps:
      - name: Checkout exact development commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assert source boundary, immutable pins and Windows-only annotation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Takuetsu/codex-dd-astra'
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ANCHOR_PARENT" "$GITHUB_SHA"
          test "$(git hash-object MODULE.bazel)" = "$EXPECTED_MODULE_BLOB"
          test "$(git hash-object defs.bzl)" = 'b2f384d0687cbb81d0c2e8a257cc3d0d6aa469a4'
          grep -Fq '        build_script_env = {},' defs.bzl
          grep -Fq '            build_script_env = build_script_env,' defs.bzl
          test "$(git hash-object MODULE.bazel.lock)" = "$INITIAL_LOCK_BLOB"
          test "$(git hash-object codex-rs/Cargo.toml)" = 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'a8eb8a076276cb3db5674b33c67d743b1c3d21fc'
          test "$(git hash-object codex-rs/deny.toml)" = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          grep -Fq "SQLITE_DISABLE_INTRINSIC" MODULE.bazel
          grep -Fq '"x86_64-pc-windows-msvc"' MODULE.bazel
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git ls-remote origin refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration | cut -f1)" = "$GITHUB_SHA"

      - name: Install repository-pinned Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1

      - name: Regenerate/verify lock and load packaging closure (retry after CLI macro fix)

        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codexdd045-sqlite"
          update_log="$RUNNER_TEMP/codexdd045-sqlite/update.log"
          verify_log="$RUNNER_TEMP/codexdd045-sqlite/verify.log"
          query_log="$RUNNER_TEMP/codexdd045-sqlite/query.log"
          bazel --version
          if ! bazel --noexperimental_remote_repo_contents_cache mod deps --lockfile_mode=update > "$update_log" 2>&1; then
            tail -n 110 "$update_log"
            exit 1
          fi
          if ! bazel --noexperimental_remote_repo_contents_cache mod deps --lockfile_mode=error > "$verify_log" 2>&1; then
            tail -n 110 "$verify_log"
            exit 1
          fi
          if ! bazel --noexperimental_remote_repo_contents_cache query --lockfile_mode=error 'deps(//codex-rs:runtime_package_combined, 1)' > "$query_log" 2>&1; then
            tail -n 110 "$query_log"
            exit 1
          fi
          grep -Fx '//codex-rs:runtime_package_combined' "$query_log"
          tail -n 18 "$query_log"
          echo 'PASS: 0.163 SQLite annotation accepted by Bazel graph'

      - name: Verify and checkpoint only the fork Bazel lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          original = json.loads(subprocess.check_output(["git", "show", "HEAD:MODULE.bazel.lock"]))
          current = json.loads(Path("MODULE.bazel.lock").read_text(encoding="utf-8"))
          assert isinstance(original, dict) and isinstance(current, dict)
          if original.get("lockFileVersion") != current.get("lockFileVersion"):
              raise SystemExit("Unreviewed Bazel lock format change")
          top = sorted(k for k in set(original) | set(current) if original.get(k) != current.get(k))
          print("LOCK_TOP_LEVEL_DIFF_KEYS:", top)
          print("LOCKFILE_BYTES:", Path("MODULE.bazel.lock").stat().st_size)
          PY
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -n "$changed" && "$changed" != 'MODULE.bazel.lock' ]]; then
            echo "Unexpected modified paths: $changed" >&2
            exit 1
          fi
          if [[ -z "$changed" ]]; then
            echo 'PASS: Bazel lock unchanged and exact-source error-mode verified'
            exit 0
          fi
          new_blob="$(git hash-object MODULE.bazel.lock)"
          test "$new_blob" != "$INITIAL_LOCK_BLOB"
          remote="$(git ls-remote origin refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MODULE.bazel.lock
          test "$(git diff --cached --name-only)" = 'MODULE.bazel.lock'
          git commit -m 'build(codexdd 0.4.5): update validated Bazel lock for Windows SQLite rules'
          git push origin HEAD:refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration
          echo "PASS: committed lock-only update $new_blob"

      - name: Capture module diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-bazel-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexdd045-sqlite/*.log
          if-no-files-found: warn
          retention-days: 7
