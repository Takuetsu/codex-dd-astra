# Read-only 3B.4 / 3F generated-code reproducibility gate.
# No source, Cargo.lock, candidate ref, production or installation write.
name: CodexDD 0.4.3 generated artifacts exact drift

on:
  push:
    branches:
      - dd/codexdd-v0.4.3-upstream-0.162.0-integration
    paths:
      - .github/workflows/codexdd-043-generated-drift.yml

permissions:
  contents: read

jobs:
  generator-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout isolated 0.162 source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert pinned 0.4.3 product and no runtime changes after green tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.3-upstream-0.162.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 16fdc9826e800ebabab920eadd8e1d976d2f645f HEAD
          git diff --quiet 32ab09a141d626df5851965a557e0dce877ac2ec HEAD -- codex-rs sdk/python/src/openai_codex/generated
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.3'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test -z "$(git status --porcelain)"

      - name: Configure same pinned generator environment as accepted 3B.4
        uses: ./.github/actions/setup-ci

      - name: Configure repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install same pinned uv as original successful generator
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Verify lockfile resolves without alteration before generation
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Regenerate stable app-server protocol schemas and Python SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/app-server-protocol/scripts/write_schema_fixtures.py

      - name: Regenerate experimental compressed protocol schemas
        shell: bash
        run: |
          set -euo pipefail
          python3 codex-rs/app-server-protocol/scripts/write_schema_fixtures.py --experimental

      - name: Regenerate core configuration JSON schema from source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo run --locked -p codex-config-schema --bin codex-write-config-schema

      - name: Verify official schema tests including compressed exports
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-app-server-protocol --lib schema_fixtures_tests::
          cargo test --locked -p codex-app-server-protocol --lib precomputed_exports_tests::

      - name: Verify generated SDK Python compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv run --project sdk/python --frozen --only-group test python -m pytest sdk/python/tests/test_contract_generation.py -q

      - name: Require all 13 generated blobs and lockfile to match checkout exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          history = json.loads(Path("docs/codexdd-0.4.3-packet-3a3-overlap-ownership.json").read_bytes())
          generated = sorted(row["path"] for row in history["rows"] if row["packet_owner"] == "3B.4")
          if len(generated) != 13 or len(set(generated)) != 13:
              raise SystemExit("Expected exactly 13 owned generated outputs")
          allowed = [*generated, "codex-rs/Cargo.lock"]
          result = subprocess.run(["git", "diff", "--exit-code", "--", *allowed], check=False)
          if result.returncode != 0:
              raise SystemExit("Generated output or Cargo.lock drift detected; blocked, no commit")
          tracked = subprocess.run(["git", "status", "--porcelain"], check=True,
                                  capture_output=True, text=True).stdout.strip()
          if tracked:
              raise SystemExit(f"Unexpected source / generated changes after drift run:\n{tracked}")
          print("PASS: 13 source-generated protocol/config/SDK blobs reproducible byte-for-byte")
          print("PASS: Cargo.lock and every other tracked or untracked file unchanged")
          PY

# The generator executes in an ephemeral runner; this job cannot write back to GitHub.
