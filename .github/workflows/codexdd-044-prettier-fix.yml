# Temporary, isolated format-only PR preparation; removed before promotion.
name: CodexDD 0.4.4 docs prettier fix

on:
  push:
    branches:
      - dd/codexdd-0.4.4-native-tool-direct-guidance
    paths:
      - .github/workflows/codexdd-044-prettier-fix.yml

permissions:
  contents: write

jobs:
  format-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only the 0.4.4 design note
        run: |
          pnpm exec prettier --write docs/codexdd-0.4.4-dd-bl-006-reconnaissance.md
          pnpm exec prettier --check docs/codexdd-0.4.4-dd-bl-006-reconnaissance.md
          git diff --check
          echo "FORMATTING DIFF:"
          git diff --stat
          git diff -- docs/codexdd-0.4.4-dd-bl-006-reconnaissance.md
      - name: Commit only formatted design note
        run: |
          test "$(git diff --name-only)" = 'docs/codexdd-0.4.4-dd-bl-006-reconnaissance.md'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/codexdd-0.4.4-dd-bl-006-reconnaissance.md
          git commit -m "docs(0.4.4): format release evidence with pinned Prettier"
          git push origin "HEAD:refs/heads/dd/codexdd-0.4.4-native-tool-direct-guidance"
