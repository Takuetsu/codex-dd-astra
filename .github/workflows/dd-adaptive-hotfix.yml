name: dd-adaptive-hotfix

on:
  pull_request:
    branches:
      - "dd/astra-policy-v2"

permissions:
  contents: write

jobs:
  adaptive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: "dd/hotfix-premature-worker-turn"
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Apply hotfix
        run: python3 .github/scripts/apply_adaptive_hotfix.py
      - name: Format
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item
      - name: Check diff
        run: git diff --check
      - name: Adaptive test suite
        working-directory: codex-rs
        run: cargo test -p codex-tui adaptive_ --lib
      - name: Commit passing hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_adaptive_hotfix.py
          rm .github/workflows/dd-adaptive-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "codex-dd: continue unfinished adaptive worker turns"
          git push origin HEAD:dd/hotfix-premature-worker-turn
