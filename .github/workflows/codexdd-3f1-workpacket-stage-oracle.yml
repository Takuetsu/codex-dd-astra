name: CodexDD 3F.1 work-packet stage oracle

on:
  push:
    branches:
      - dd/codexdd-v0.4.0-local-validation-orchestrator
    paths:
      - ".github/workflows/codexdd-3f1-workpacket-stage-oracle.yml"

permissions:
  contents: read

jobs:
  windows-format-clippy:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - name: Exact work-packet rustfmt stage
        shell: pwsh
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Exact work-packet core/tui clippy stage
        shell: pwsh
        run: cargo clippy --tests -p codex-core -p codex-tui
