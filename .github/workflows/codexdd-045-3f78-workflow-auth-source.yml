# NONRELEASE. Source policy check before any compiled or native acceptance.
name: CodexDD 0.4.5 3F.78 workflow mutation authority cheap source (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f78-thread-workflow-auth-gate]
    paths: [".github/workflows/codexdd-045-3f78-workflow-auth-source.yml"]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '7363b3f418ee0ad1a8b9929d5d321073e4f0e42c'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Source-bound authority gate and unwaived owner ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7363b3f418ee0ad1a8b9929d5d321073e4f0e42c'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("codex-rs/app-server/src")
          processor=(root/"request_processors/turn_processor.rs").read_text()
          dispatch=(root/"message_processor.rs").read_text()
          policy=(root/"request_processors/thread_input.rs").read_text()
          handler=processor.split("pub(crate) async fn thread_workflow_state_update(",1)[1].split("pub(crate) async fn thread_settings_update(",1)[0]
          assert "request_id: &ConnectionRequestId" in handler
          assert "self.ensure_direct_input_allowed(request_id, thread.as_ref())" in handler
          assert "subscribed_connection_ids(thread_id)" in handler
          assert "workflow_mutation_is_authorized_connection(request_id, &subscribers)" in handler
          assert "workflow_mutation_rejects_foreign_and_unsubscribed_connections" in processor
          assert "thread_workflow_state_update(&request_id, params)" in dispatch
          assert "v2_spawned_agent_rejects_direct_workflow_mutations_but_regular_threads_continue" in policy
          suite=Path("codex-rs/app-server/tests/suite/v2/thread_fork_multi_agent_tests.rs").read_text()
          assert "workflow_state_update_preserves_authorized_top_level_cli_mutation" in suite
          assert "ThreadWorkflowStateOperation::SetReadyForOwnerQa" in suite
          ledger=json.loads(Path("docs/upstream-candidates/codexdd-045-3f55-formal-owner-approvals.json").read_text())
          assert ledger["approved_owner_count"]==0 and len(ledger["pending_native_or_semantic_restoration"])==13
          print("PASS: workflow mutation handler enforces V2 direct-input gate; owner holds unchanged")
          PY
          git diff --check
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - name: Cheap Rustfmt source check only
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check
