# NONRELEASE: source-pinned 3F.90 Windows reconnect end-to-end acceptance.
# A cheap source/format gate must pass before native Windows compilation starts.
name: CodexDD 0.4.5 3F.90 Windows reconnect end-to-end (NONRELEASE)
run-name: 3F.90 Windows reconnect end-to-end on Windows (NONRELEASE)
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-3f90-windows-reconnect-e2e
    paths:
      - .github/workflows/codexdd-045-3f90-windows-reconnect-e2e-native.yml
permissions:
  contents: read
concurrency:
  group: codexdd045-3f90-reconnect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 25
          persist-credentials: false
      - name: Verify frozen candidate, security graph and protected production version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.5-3f90-windows-reconnect-e2e'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/tests/navigation_reconnect_tests.rs)" = '6e7bf006705d71d620e2695086123ce6b1d12f88'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/tests/active_reconnect_tests.rs)" = '078ffc77b2d271ad0d642f5266462040ce83d3e9'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/tests/disconnect_tests.rs)" = '662967de32dc64517b250dc180baafd1da4dd36a'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/tests.rs)" = '2c2c256f2dac830cb28cb4d322eecf05e62ba7f8'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/reconnect.rs)" = '97e8d65d11f1722955e17ddf92080a9b00191fef'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app_server_session.rs)" = 'db8a394b652fd18d61807a8b656e6b7463f07521'
          test "$(git rev-parse HEAD:codex-rs/tui/src/lib.rs)" = 'f45b01a668998d817abec91313f425f2fa6a9ad7'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app.rs)" = '2c4ef89f8aef22193ae8d5f57996a948db987659'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/thread_events.rs)" = '4ee8f4a0446c8c0cfd41dd234457a299c89d242c'
          test "$(git rev-parse HEAD:codex-rs/tui/src/app/thread_event_buffer.rs)" = '1857941dba71f611256dc9e782b9b9c428fecaec'
          test "$(git rev-parse HEAD:codex-rs/tui/Cargo.toml)" = 'ea0894b3e1d3777f4c598727b03199c1f69cbd05'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          git diff --check eec4fee2aebfa15b18e3b3f2837b3e9b655003dd HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('docs/upstream-candidates/codexdd-045-3f90-windows-reconnect-e2e-candidate.json').read_text())
          assert ledger['status'] == 'SNAPSHOT_COLUMN_ALIGNMENT_FIXED_AGGREGATE_NATIVE_RETRY_PENDING'
          assert ledger['release_approved'] is False
          assert ledger['formal_owner_signoffs'] == 0
          assert ledger['remaining_high_risk_tui_review_holds'] == 9
          assert ledger['remaining_high_risk_core_review_holds'] == 4
          assert len(ledger['test_cases']) == 8
          assert ledger['baseline_commit'] == 'eec4fee2aebfa15b18e3b3f2837b3e9b655003dd'
          source=Path('codex-rs/tui/src/app/tests.rs').read_text()
          marker='#[path = "tests/navigation_reconnect_tests.rs"]\nmod navigation_reconnect;'
          assert marker in source
          assert '#[cfg(unix)]\n'+marker not in source
          nav=Path('codex-rs/tui/src/app/tests/navigation_reconnect_tests.rs').read_text()
          assert 'TcpListener::bind("127.0.0.1:0").await?' in nav
          assert 'tokio_tungstenite::accept_async(stream)' in nav
          assert 'AppServerTarget::LocalDaemon' in nav
          assert 'UnixListener' not in nav
          assert 'channel.sender.send(event).await?;' in nav
          assert '.replace(r"C:\\tmp\\project  2", "/tmp/project  2  ")' in nav
          assert '.replace(r"C:\\tmp\\project", "/tmp/project")' in nav
          # Preserve both task-column alignment and detail text when normalizing paths.
          row='  C:\\tmp\\project  2                                       │ Selected task'
          normalized=row.replace('C:\\tmp\\project  2','/tmp/project  2  ').replace('C:\\tmp\\project','/tmp/project')
          assert normalized == '  /tmp/project  2                                         │ Selected task'
          assert nav.count('normalize_reconnect_snapshot_path(render_bottom_popup(') == 4
          assert 'channel.sender.send(event)?;' not in nav
          for case in ledger['test_cases']:
              lines=Path(case['path']).read_text().splitlines()
              symbol=case['selector'].rsplit('::',1)[-1]
              matches=[i for i,line in enumerate(lines) if 'fn '+symbol+'(' in line]
              assert len(matches) == 1, case['selector']
              attrs='\n'.join(lines[max(0,matches[0]-5):matches[0]])
              for excluded in ('#[cfg(unix)]','#[cfg(target_os = "macos")]','#[cfg(not(windows))]'):
                  assert excluded not in attrs, (case['selector'],excluded)
          print('3F90_SOURCE_PASS: cross-platform daemon reconnect, 8 exact selectors, release holds retained')
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Rustfmt check only (no compilation)
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check

  windows-native:
    needs: cheap-source
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: "never"
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Retain the prior acceptance ancestor for source-bound review.
          fetch-depth: 25
          persist-credentials: false
      - name: Configure bounded Windows logs and Cargo scratch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'codexdd045-3f90-reconnect'
          $target=Join-Path $root 'target'
          $temp=Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force $target,$temp,'native-evidence' | Out-Null
          @(
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
          ) | Add-Content $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Restore Cargo sources only (no oversized target cache)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-3f73-source-static
          restore-keys: |
            codexdd045-3f12-source-
            codexdd045-crypto-msvc-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Compile TUI unit test binary before enforcing test timeouts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          $cargo=(Get-Command cargo.exe -ErrorAction Stop).Source
          $cwd=Join-Path $env:GITHUB_WORKSPACE 'codex-rs'
          $stdout=Join-Path $env:GITHUB_WORKSPACE 'native-evidence\compile-stdout.log'
          $stderr=Join-Path $env:GITHUB_WORKSPACE 'native-evidence\compile-stderr.log'
          Write-Host 'BEGIN 3F.90 single cold Windows compilation (no tests executed)'
          $arguments=@('test','--locked','-p','codex-tui','--lib','--no-run')
          $proc=Start-Process -FilePath $cargo -ArgumentList $arguments -WorkingDirectory $cwd -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (-not $proc.WaitForExit(3900000)) {
              $proc.Kill($true)
              $proc.WaitForExit()
              Get-Content $stdout -Tail 40 -ErrorAction SilentlyContinue
              Get-Content $stderr -Tail 100 -ErrorAction SilentlyContinue
              throw '3F.90 cold TUI test compilation exceeded 65 minutes; tests never started'
            }
            if ($proc.ExitCode -ne 0) {
              Get-Content $stdout -Tail 60 -ErrorAction SilentlyContinue
              Get-Content $stderr -Tail 150 -ErrorAction SilentlyContinue
              throw "3F.90 Windows TUI compile failed with exit $($proc.ExitCode)"
            }
            Get-Content $stderr -Tail 14 -ErrorAction SilentlyContinue
            Write-Host '3F.90 WINDOWS TEST COMPILATION GREEN (no tests yet)' -ForegroundColor Green
          } finally {
            $proc.Dispose()
          }
      - name: Execute eight exact reconnect cases after compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          $cases = @(
            'app::tests::navigation_reconnect::reconnect_daemon_command_center_after_connection_replacement_without_a_conversation',
            'app::tests::active_reconnect::reconnect_restores_history_permissions_and_resumes_unsent_input',
            'app::tests::active_reconnect::reconnect_reconciles_offscreen_pending_profile_before_restoring_permissions',
            'app::tests::active_reconnect::reconnect_exhaustion_and_unknown_initial_thread_stay_offline',
            'app::tests::active_reconnect::reconnect_allows_slow_hydration_but_bounds_a_stalled_server',
            'app::tests::active_reconnect::reconnect_restores_launch_reviewer_without_a_profile_override',
            'app::tests::disconnect::lost_mutation_reply_preserves_work_without_resubmitting',
            'app::tests::disconnect::lost_initial_thread_reply_keeps_startup_draft_offline'
          )
          $cargo=(Get-Command cargo.exe -ErrorAction Stop).Source
          $results=New-Object 'System.Collections.Generic.List[object]'
          $index=0
          $failures=0
          foreach ($case in $cases) {
            $index++
            $stdout=Join-Path $env:GITHUB_WORKSPACE ("native-evidence\case-$index-stdout.log")
            $stderr=Join-Path $env:GITHUB_WORKSPACE ("native-evidence\case-$index-stderr.log")
            Write-Host "BEGIN 3F.90 reconnect case $($index): $case"
            $arguments=@('test','--locked','-p','codex-tui','--lib',$case,'--','--exact','--nocapture')
            $reason=$null
            $proc=Start-Process -FilePath $cargo -ArgumentList $arguments -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE 'codex-rs') -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              if (-not $proc.WaitForExit(240000)) {
                $proc.Kill($true)
                $proc.WaitForExit()
                $reason="Case $($index) exceeded four-minute execution limit"
              } elseif ($proc.ExitCode -ne 0) {
                $reason="Case $($index) failed with exit $($proc.ExitCode)"
              }
            } finally {
              $proc.Dispose()
            }
            if (-not $reason) {
              $output=(Get-Content $stdout -Raw)+(Get-Content $stderr -Raw)
              if (-not [regex]::IsMatch($output, 'test result: ok\.\s+1 passed;\s+0 failed;')) {
                $reason="Case $($index) did not execute exactly one passing test"
              } else {
                $pattern='test\s+'+[regex]::Escape($case)+'\s+\.\.\.\s+ok'
                if (-not [regex]::IsMatch($output,$pattern)) {
                  $reason="Case $($index) missing matching passing selector name"
                }
              }
            }
            if ($reason) {
              $failures++
              Write-Host "FAILED 3F.90 reconnect case $($index): $reason" -ForegroundColor Red
              Get-Content $stdout -Tail 70 -ErrorAction SilentlyContinue
              Get-Content $stderr -Tail 90 -ErrorAction SilentlyContinue
              $results.Add([pscustomobject]@{Selector=$case;Passed=0;Reason=$reason;Stdout=$stdout;Stderr=$stderr})
              continue
            }
            $results.Add([pscustomobject]@{Selector=$case;Passed=1;Reason=$null;Stdout=$stdout;Stderr=$stderr})
            Write-Host "PASS 3F.90 reconnect case $($index): $case" -ForegroundColor Green
          }
          $receipt=[pscustomobject]@{
            kind='codexdd045_3f90_windows_reconnect_e2e_native_nonrelease'
            source_head=$env:GITHUB_SHA
            utc=(Get-Date).ToUniversalTime().ToString('o')
            passed=($results.Count - $failures)
            failed=$failures
            selectors=$results.ToArray()
            release_approved=$false
            formal_owner_signoffs=0
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content native-evidence/3f90-receipt.json -Encoding utf8
          Write-Host "3F.90 WINDOWS RECONNECT SUMMARY: $($results.Count - $failures)/$($cases.Count) passed, $failures failed"
          if ($failures -ne 0) { throw "3F.90 reconnect suite failed $failures/$($cases.Count) cases; inspect per-case artifacts" }
          Write-Host "3F.90 WINDOWS RECONNECT TESTS GREEN: $($results.Count)/$($cases.Count)" -ForegroundColor Green
      - name: Preserve focused native logs and nonrelease receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f90-windows-reconnect-nonrelease
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
