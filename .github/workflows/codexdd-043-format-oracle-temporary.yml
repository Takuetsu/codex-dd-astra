name: codexdd-043-format-oracle-temporary

on:
  pull_request:
    branches: [dd/astra-policy-v2]

permissions:
  contents: read

jobs:
  format-three-docs:
    if: github.head_ref == 'dd/codexdd-v0.4.3-upstream-recovery-tooling'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Emit exact formatted Markdown as bounded JSON evidence
        shell: bash
        run: |
          pnpm exec prettier --write \
            docs/codexdd-0.4.3-fixed-target-discovery-tooling.md \
            docs/codexdd-0.4.3-upstream-0.162.0-design.md \
            docs/codexdd-elevated-windows-f2-hotfix.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          for relative in (
              "docs/codexdd-0.4.3-fixed-target-discovery-tooling.md",
              "docs/codexdd-0.4.3-upstream-0.162.0-design.md",
              "docs/codexdd-elevated-windows-f2-hotfix.md",
          ):
              print(
                  "CODEXDD_FORMATTED_DOC "
                  + json.dumps(
                      {"path": relative, "content": Path(relative).read_text(encoding="utf-8")},
                      ensure_ascii=True,
                  )
              )
          PY
