name: codexdd-043-format-oracle-temporary

# Read-only source-format oracle. The workflow itself is removed after use.
on:
  push:
    branches: [dd/codexdd-v0.4.3-v2-reconciliation-tooling]
    paths:
      - .github/workflows/codexdd-043-format-oracle-temporary.yml

permissions:
  contents: read

jobs:
  exact-formatter-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact tooling branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install repository-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Run repo-pinned Ruff on only new v2 helper Python files
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format \
            .github/scripts/upstream_reconciliation*.py \
            .github/scripts/test_upstream_reconciliation*.py
      - name: Install pinned Prettier through repository dependencies
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Run repo-pinned Prettier on only added v2 documentation/workflows
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            docs/codexdd-0.4.3-v2-reconciliation-tooling-packet-3e4a.md \
            .github/workflows/codexdd-043-v2-reconciliation-tests.yml \
            .github/workflows/upstream-reconcile-publish.yml \
            .github/workflows/upstream-reconcile-promote.yml
      - name: Emit formatter-exact changed file contents as machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          relative_paths = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD", "--",
               ".github/scripts", ".github/workflows", "docs"],
              text=True,
          ).splitlines()
          print("CODEXDD_FORMATTED_COUNT", len(relative_paths))
          for relative in relative_paths:
              path = Path(relative)
              if path.suffix not in {".py", ".yml", ".md"}:
                  raise SystemExit("Unexpected formatter-changed path: " + relative)
              print("CODEXDD_FORMATTED_FILE_JSON " + json.dumps(
                  {"path": relative, "content": path.read_text(encoding="utf-8")},
                  ensure_ascii=True,
              ))
          PY
