# Read-only, bounded Linux musl prerequisite probe for WebRTC 0.21 tests.
name: CodexDD 0.4.5 bounded musl prerequisites (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-rtc021-owner-compat]
    paths: ['.github/workflows/codexdd-045-musl-prereq-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '97b160cf2dde7011e72c9429c7cc473386ed57f3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect preinstalled musl cross C compiler
        run: |
          set -euo pipefail
          if command -v musl-gcc; then
            echo "musl-gcc already installed"
          else
            echo "musl-gcc absent; test tightly bounded APT installation"
          fi
      - name: Install musl-tools with bounded network operations
        run: |
          set -euo pipefail
          timeout 75s sudo apt-get update -qq
          timeout 75s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends musl-tools
          command -v musl-gcc
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/codexdd045-musl-check.c"
          musl-gcc -c "$RUNNER_TEMP/codexdd045-musl-check.c" -o "$RUNNER_TEMP/codexdd045-musl-check.o"
          echo 'PASS: bounded musl prerequisite available; WebRTC source compile still pending'
