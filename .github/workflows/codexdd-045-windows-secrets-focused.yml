# One-shot native Windows smoke for age-backed local secrets after 0.163 integration.
# Read-only and NONRELEASE: not a replacement for the all-target cargo-deny audit.
name: CodexDD 0.4.5 Windows secrets smoke
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - ".github/workflows/codexdd-045-windows-secrets-focused.yml"
permissions:
  contents: read
jobs:
  secrets:
    name: Windows secrets library native regressions (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration' && github.event.before == '5e6dbfa7e74cd31bbccaf67945cafe7bbbca586c'
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout exact branch source with no persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact accepted Cargo lock, audit policy and release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          if ((git rev-parse HEAD^).Trim() -ne '5e6dbfa7e74cd31bbccaf67945cafe7bbbca586c') { throw 'Unexpected one-shot parent' }
          if ((git hash-object -- codex-rs/Cargo.toml).Trim() -ne 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4') { throw 'Unreviewed manifest changed' }
          if ((git hash-object -- codex-rs/Cargo.lock).Trim() -ne 'a8eb8a076276cb3db5674b33c67d743b1c3d21fc') { throw 'Unreviewed lock changed' }
          if ((git hash-object -- codex-rs/deny.toml).Trim() -ne 'ea7fdc149fc880c6b36d75c29851641034289a4e') { throw 'Security policy changed' }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -ne '0.4.4') { throw 'Product marker advanced' }
          if ((Get-Content codex-rs/upstream-codex-release.txt -Raw).Trim() -ne 'rust-v0.162.0') { throw 'Upstream marker advanced' }
      - name: Configure isolated native Windows scratch paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'codexdd045-secrets'
          $target = Join-Path $root 'target'
          $temp = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force -Path $target, $temp | Out-Null
          @(
            "CI_BUILD_ROOT=$root"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
            "CARGO_TARGET_DIR=$target"
            "TEMP=$temp"
            "TMP=$temp"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git long paths unavailable' }
      - name: Install pinned Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Reuse Cargo dependency downloads only (no unreviewed build artifacts)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-secrets-registry-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.toml', 'codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            codexdd045-secrets-registry-${{ runner.os }}-
      - name: Verify exact locked Cargo resolver
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock drift' }
      - name: Run unfiltered secrets library regression set (stop on failure)
        shell: pwsh
        working-directory: codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'codexdd045-secrets-native.log'
          $command = 'cargo test --locked -p codex-secrets --lib -- --test-threads=1 > "' + $log + '" 2>&1'
          & cmd.exe /d /c $command
          $rc = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log)) { throw 'Missing secrets test log' }
          $tail = (Get-Content -LiteralPath $log -Tail 150) -join "`n"
          Write-Host $tail
          if ($rc -ne 0) { throw "Secrets native tests failed with exit $rc; inspect uploaded log" }
          if ($tail -notmatch '(?m)^test result: ok\.\s+[1-9][0-9]* passed; 0 failed;') {
            throw 'No positive, failure-free secrets test summary found'
          }
          Write-Host 'PASS: native Windows codex-secrets --lib test set; not a dependency advisory waiver.'
      - name: Upload focused diagnostic log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-secrets-native
          path: ${{ runner.temp }}/codexdd045-secrets-native.log
          if-no-files-found: warn
          retention-days: 7
