name: windows-release

on:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - ".github/scripts/package_codexdd_windows.ps1"
      - "codex-rs/**"
  workflow_dispatch:
  push:
    tags:
      - "codexdd-v*"

permissions:
  contents: read

jobs:
  build-package:
    name: Build and package Windows codexdd
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Build release codexdd
        run: cargo build -p codex-cli --release

      - name: Verify codexdd version reporting
        run: cargo test -p codex-cli --test version_reporting

      - name: Package Windows release
        id: package
        shell: pwsh
        working-directory: .
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          ./.github/scripts/package_codexdd_windows.ps1 `
            -BinaryPath "codex-rs/target/release/codex.exe" `
            -VersionFile "codex-rs/codexdd-version.txt" `
            -OutputDirectory "dist" `
            -ExpectedTag "$env:RELEASE_TAG"

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/${{ steps.package.outputs.zip_name }}
            dist/${{ steps.package.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/codexdd-v')
    needs: build-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codexdd-windows-x86_64-*
          path: dist
          merge-multiple: true

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
