# NONRELEASE: source-pinned 3F.81 Windows native workflow authorization acceptance.
# Trigger only when this workflow file is added/changed. No publication or promotion.
name: CodexDD 0.4.5 3F.81 Windows app-server authorization tests (NONRELEASE)
run-name: 3F.81 five native Windows authorization tests (NONRELEASE)
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-3f80-queue-auth-integrated
    paths:
      - .github/workflows/codexdd-045-3f81-workflow-auth-windows-native.yml
permissions:
  contents: read
concurrency:
  group: codexdd045-3f81-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pin exact integrated source and retain nonrelease owner holds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '8212d2a447a0bd6b4f54381b47d052f650e555de'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(git rev-parse HEAD:codex-rs/Cargo.toml)" = 'cfebd9b784ef9ff027b274aa9f7101c9c2496613'
          test "$(git rev-parse HEAD:codex-rs/deny.toml)" = 'f282c7c55d05201e308e60804f85754c8522d462'
          test "$(cat codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(cat codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('.')
          formal=json.loads((base/'docs/upstream-candidates/codexdd-045-3f55-formal-owner-approvals.json').read_text())
          assert formal['approved_owner_count'] == 0
          assert len(formal['pending_native_or_semantic_restoration']) == 13
          src=(base/'codex-rs/app-server/src/request_processors/turn_processor.rs').read_text()
          assert 'workflow_mutation_matches_known_turn(' in src
          assert 'subscribed_connection_ids(thread_id)' in src
          tests=(base/'codex-rs/app-server/tests/suite/v2/connection_handling_websocket.rs').read_text()
          assert 'websocket_workflow_state_write_rejects_foreign_and_unsubscribed_connections' in tests
          assert (base/'.github/scripts/test_codexdd_045_3f80_local_validation.py').is_file()
          print('SOURCE_PIN_PASS_NONRELEASE')
          PY
          git diff --check
      - name: Cheap regression checks for validator and legacy fixtures
        shell: bash
        run: python3 -m unittest discover -s .github/scripts -p test_codexdd_045_3f80_local_validation.py -v
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - name: Cheap Rust formatting check (no compilation)
        shell: bash
        working-directory: codex-rs
        run: cargo fmt --all -- --check

  windows-native:
    needs: cheap-source
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "16777216"
      CARGO_TERM_COLOR: "never"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and protected security identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected Windows source commit' }
          if ((git rev-parse HEAD^).Trim() -cne '8212d2a447a0bd6b4f54381b47d052f650e555de') { throw 'Wrong integrated source parent' }
          if ((git rev-parse HEAD:codex-rs/Cargo.lock).Trim() -cne '13bc15ff844e93dfaf7777c73bb7313b35bb3b81') { throw 'Protected Cargo.lock drift' }
          if ((git rev-parse HEAD:codex-rs/Cargo.toml).Trim() -cne 'cfebd9b784ef9ff027b274aa9f7101c9c2496613') { throw 'Protected workspace manifest drift' }
          if ((git rev-parse HEAD:codex-rs/deny.toml).Trim() -cne 'f282c7c55d05201e308e60804f85754c8522d462') { throw 'Protected security policy drift' }
          if ((Get-Content codex-rs/codexdd-version.txt -Raw).Trim() -cne '0.4.4') { throw 'Unexpected production promotion' }
          if (git status --porcelain --untracked-files=no) { throw 'Dirty tracked source' }
      - name: Configure bounded Windows scratch, logs, and long paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP 'codexdd045-3f81-native'
          New-Item -ItemType Directory -Force -Path (Join-Path $base 'target'),(Join-Path $base 'tmp'),'native-evidence' | Out-Null
          @(
            "CARGO_TARGET_DIR=$(Join-Path $base 'target')"
            "TEMP=$(Join-Path $base 'tmp')"
            "TMP=$(Join-Path $base 'tmp')"
            "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE"
          ) | Add-Content $env:GITHUB_ENV -Encoding utf8
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Restore cargo sources (avoid oversized build caches)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codexdd045-3f73-source-static
          restore-keys: |
            codexdd045-3f12-source-
            codexdd045-crypto-msvc-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Compile integrated app-server tests once, capture all diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $out=Join-Path $root 'native-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log=Join-Path $out 'app-server-test-all-compile.log'
          $digest=Join-Path $out 'compiler-errors.txt'
          $receipt=Join-Path $out '3f80-integrated-compile-receipt.json'
          $watch=[Diagnostics.Stopwatch]::StartNew()
          $status=1
          $errorLines=@()
          try {
            Push-Location (Join-Path $root 'codex-rs')
            try {
              & cmd.exe /d /c ('cargo test --locked -p codex-app-server --test all --no-run > "'+$log+'" 2>&1')
              $status=[int]$LASTEXITCODE
            } finally { Pop-Location }
            $lines=@(Get-Content -LiteralPath $log)
            $errorLines=@($lines | Where-Object { $_ -match '^error(\[E[0-9]+\])?:|^\s*-->\s+.*:\d+:\d+' })
            if ($errorLines.Count -eq 0 -and $status -ne 0) {
              $errorLines=@($lines | Select-Object -Last 100)
            }
            $errorLines | Set-Content -LiteralPath $digest -Encoding utf8
            Write-Host ('COMPILE_EXIT_CODE: '+$status)
            Write-Host ('ERROR_AND_LOCATION_LINES: '+$errorLines.Count)
            Write-Host ('COMPILER_ERROR_DIGEST: '+$digest)
            Write-Host ('FULL_COMPILE_LOG: '+$log)
            if ($status -ne 0) {
              Write-Host (($errorLines | Select-Object -First 100) -join [Environment]::NewLine)
              throw 'Integrated app-server Windows test binary did not compile'
            }
            Write-Host 'CODEXDD_045_3F80_WINDOWS_INTEGRATED_COMPILE=PASS_NONRELEASE'
          }
          finally {
            $watch.Stop()
            [ordered]@{
              kind='CODEXDD_045_3F80_WINDOWS_INTEGRATED_COMPILE_NONRELEASE'
              tested_head=$env:GITHUB_SHA
              source_parent='8212d2a447a0bd6b4f54381b47d052f650e555de'
              platform='windows-2022'
              compile_only=$true
              compile_exit_code=$status
              passed=($status -eq 0)
              formal_owner_approvals=0
              release_approved=$false
              elapsed_seconds=[Math]::Round($watch.Elapsed.TotalSeconds,1)
              done_utc=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $receipt -Encoding utf8
            Write-Host ('COMPILE_RECEIPT: '+$receipt)
          }
      - name: Run all five native workflow authorization regressions (one pass per selector)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'native-evidence'
          $receipt=Join-Path $out '3f81-auth-native-receipt.json'
          $watch=[Diagnostics.Stopwatch]::StartNew()
          $results=@()
          $passed=$false
          $failureReason=''
          $cases=@(
            @{ selector='workflow_mutation_rejects_foreign_and_unsubscribed_connections'; kind='--lib' }
            @{ selector='workflow_mutation_rejects_stale_source_turn_without_blocking_valid_or_cold_resume'; kind='--lib' }
            @{ selector='v2_spawned_agent_rejects_direct_workflow_mutations_but_regular_threads_continue'; kind='--lib' }
            @{ selector='workflow_state_update_preserves_authorized_top_level_cli_mutation'; kind='--test all' }
            @{ selector='websocket_workflow_state_write_rejects_foreign_and_unsubscribed_connections'; kind='--test all' }
          )
          try {
            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'codex-rs')
            try {
              foreach ($case in $cases) {
                $name=[string]$case.selector
                $log=Join-Path $out ($name+'.log')
                $command='cargo test --locked -p codex-app-server '+$case.kind+' '+$name+' -- --test-threads=1'
                Write-Host ('NATIVE_BEGIN: '+$name)
                & cmd.exe /d /c ($command+' > "'+$log+'" 2>&1')
                $code=[int]$LASTEXITCODE
                $onePassed=[regex]::IsMatch(
                  (Get-Content -LiteralPath $log -Raw),
                  '(?m)^test result:\s*ok\.\s+1 passed;\s+0 failed;'
                )
                $ok=($code -eq 0 -and $onePassed)
                $results+= [ordered]@{
                  selector=$name
                  harness=[string]$case.kind
                  exit_code=$code
                  exactly_one_passed=$onePassed
                  passed=$ok
                  log_file=(Split-Path $log -Leaf)
                }
                Write-Host ('NATIVE_CASE: '+$name+' exit='+$code+' one_passed='+$onePassed)
                if (-not $ok) {
                  Get-Content -LiteralPath $log -Tail 100 | ForEach-Object { Write-Host $_ }
                  throw ('Native authorization test failed: '+$name)
                }
              }
            }
            finally { Pop-Location }
            if ($results.Count -ne 5) { throw 'Not all five selectors executed' }
            $passed=$true
            Write-Host 'CODEXDD_045_3F81_NATIVE_AUTH=PASS_5_OF_5_NONRELEASE'
          }
          catch {
            $failureReason=$_.Exception.Message
            throw
          }
          finally {
            $watch.Stop()
            [ordered]@{
              kind='CODEXDD_045_3F81_WINDOWS_NATIVE_AUTH_NONRELEASE'
              tested_head=$env:GITHUB_SHA
              source_parent='8212d2a447a0bd6b4f54381b47d052f650e555de'
              previous_compile_run_id=41650547740
              previous_compiled_head='ee570f802e3943b4efab14ce79300220ebf916c1'
              cases=@($results)
              expected_case_count=5
              passed=$passed
              reason=$failureReason
              owner_approvals=0
              release_approved=$false
              elapsed_seconds=[Math]::Round($watch.Elapsed.TotalSeconds,1)
              done_utc=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            } | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath $receipt -Encoding utf8
            Write-Host ('NATIVE_AUTH_RECEIPT: '+$receipt)
          }
      - name: Always upload exact-source native compiler log and receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f81-auth-windows-native-evidence
          path: native-evidence/*
          if-no-files-found: warn
          compression-level: 3
          retention-days: 7
