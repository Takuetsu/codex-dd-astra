# Four-owner security closure graph, disposable checkout only.
# Does not approve source trust, bypass cargo-deny, or change a release.
name: CodexDD 0.4.5 combined crypto-bigint closure graph (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-combined-crypto-graph-preview]
    paths: ['.github/workflows/codexdd-045-combined-crypto-graph.yml']
permissions:
  contents: read
jobs:
  combined:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '97b160cf2dde7011e72c9429c7cc473386ed57f3'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact source without write token
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check source, markers, original protections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '97b160cf2dde7011e72c9429c7cc473386ed57f3'
          test "$(git hash-object codex-rs/Cargo.toml)" = 'd46347640b6ca6e43e96a12ee14eec894178af4f'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'b08006b6928d98eff75ea764db71ea281cb5df3e'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/combined-crypto"
          git hash-object codex-rs/deny.toml > "$RUNNER_TEMP/combined-crypto/original-security-policy-blob.txt"
      - name: Use reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Freeze published AWS source checksum and extract under scratch-only vendor
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path codex-rs/Cargo.toml --package aws-config --precise 1.13.0
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.crates.io/crates/aws-config/aws-config-1.13.0.crate \
            -o "$RUNNER_TEMP/combined-crypto/aws-config-1.13.0.crate"
          python3 - <<'PY'
          import hashlib, os, tomllib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"]) / "combined-crypto"
          pkgs=tomllib.loads(Path("codex-rs/Cargo.lock").read_text())["package"]
          aws=[p for p in pkgs if p["name"]=="aws-config"]
          assert len(aws)==1 and aws[0]["version"]=="1.13.0"
          digest=hashlib.sha256((root/"aws-config-1.13.0.crate").read_bytes()).hexdigest()
          assert aws[0]["checksum"]==digest=="939e256cfe0ed68e96d32f194339d88210d5c10685cff0787400158f852c6819"
          print("PASS: published AWS source SHA-256:",digest)
          PY
          mkdir -p codex-rs/vendor/aws-config-1.13.0
          tar -xzf "$RUNNER_TEMP/combined-crypto/aws-config-1.13.0.crate" \
            -C codex-rs/vendor/aws-config-1.13.0 --strip-components=1
      - name: Apply exact upstream age, clatter and AWS DPoP dependency moves
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("codex-rs/Cargo.toml")
          s=p.read_text()
          old='clatter = { version = "2.2.0", default-features = false, features = ['
          assert s.count(old)==1
          s=s.replace(old,old.replace("2.2.0","3.0.0"))
          marker="[patch.crates-io]\n"
          assert s.count(marker)==1
          ar="b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f"
          cr="9a8d15c4f80d5911ca0403aa22e0de99ea59df08"
          add=(
              f'age = {{ git = "https://github.com/str4d/rage", rev = "{ar}" }}\n'
              f'age-core = {{ git = "https://github.com/str4d/rage", rev = "{ar}" }}\n'
              f'clatter = {{ git = "https://github.com/jmlepisto/clatter", rev = "{cr}" }}\n'
              'aws-config = { path = "vendor/aws-config-1.13.0" }\n'
          )
          p.write_text(s.replace(marker,marker+add))
          root=Path("codex-rs/vendor/aws-config-1.13.0")
          p=root/"Cargo.toml"
          s=p.read_text()
          for name,new in (("p256","0.14.0"),("rand","0.10.1")):
              m=re.search(r'(?m)^\[dependencies\.'+name+r'\]\n[\s\S]*?(?=^\[|\Z)',s)
              assert m,"missing AWS dep "+name
              part=m.group(0)
              oldv=re.search(r'(?m)^version = "([^"]+)"$',part)
              assert oldv and oldv.group(1) in (("0.13.2" if name=="p256" else "0.8.5"),)
              s=s[:m.start()]+part.replace(oldv.group(0),'version = "'+new+'"',1)+s[m.end():]
          rand_def=re.search(r'(?m)^\[dependencies\.rand\]\n[\s\S]*?(?=^\[|\Z)',s)
          assert rand_def and 'features = ["std", "std_rng"]' in rand_def.group(0)
          s=s.replace('features = ["std", "std_rng"]','features = ["std", "std_rng", "sys_rng"]',1)
          p.write_text(s)
          p=root/"src/login/dpop.rs"
          s=p.read_text()
          changes={
              "use p256::elliptic_curve::sec1::ToEncodedPoint;":"use p256::elliptic_curve::sec1::ToSec1Point;",
              ".to_encoded_point(false)":".to_sec1_point(false)",
              "let mut rng = rand::rngs::StdRng::from_entropy();":
                  'let mut rng = rand::rngs::StdRng::try_from_rng(&mut rand::rngs::SysRng)'
                  '.map_err(|_| LoginTokenError::other("could not seed DPoP signer", None))?;',
          }
          for before,after in changes.items():
              assert s.count(before)==1, "unexpected published DPoP source "+before
              s=s.replace(before,after)
          p.write_text(s)
          print("SCRATCH OWNERS: pinned age + clatter stable KEM, 0.21.1 WebRTC already in source, checksum-verified AWS DPoP 0.14")
          PY
          git diff --check
      - name: Prove all-target and dual-platform vulnerable crypto-bigint is eliminated
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 \
            --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/combined-crypto/windows.json"
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/combined-crypto/linux.json"
          python3 - <<'PY'
          import os, json, tomllib
          from pathlib import Path
          pkgs=tomllib.loads(Path("codex-rs/Cargo.lock").read_text())["package"]
          names={}
          for p in pkgs:
              names.setdefault(p["name"],set()).add(p["version"])
          assert "0.5.5" not in names.get("crypto-bigint",set()),"VULNERABLE crypto-bigint 0.5.5 STILL PRESENT"
          assert names.get("crypto-bigint") and all(tuple(map(int,v.split("."))) >= (0,7,6) for v in names["crypto-bigint"])
          assert "0.13.2" not in names.get("p256",set()),"old P256 persists"
          assert "p384" not in names,"old P384 chain persists"
          assert names.get("age")=={"0.12.1"} and names.get("hpke")=={"0.14.1"}
          assert names.get("clatter")=={"3.0.0"} and names.get("kem")=={"0.3.0"}
          assert names.get("rtc")==names.get("webrtc")=={"0.21.1"}
          assert names.get("aws-config")=={"1.13.0"}
          assert names.get("zstd")=={"0.14.3"} and names.get("ctutils")=={"0.4.6"}
          for platform in ("windows","linux"):
              data=json.loads((Path(os.environ["RUNNER_TEMP"])/"combined-crypto"/(platform+".json")).read_text())
              by_id={p["id"]:p for p in data["packages"]}
              active={n["id"] for n in data["resolve"]["nodes"]}
              selected=sorted({(by_id[x]["name"],by_id[x]["version"]) for x in active if by_id[x]["name"] in (
                  "crypto-bigint","age","hpke","clatter","p256","rtc","aws-config")})
              assert not any(n=="crypto-bigint" and v=="0.5.5" for n,v in selected)
              print(platform,"SECURE CRYPTO GRAPH:",selected)
          print("SECURITY GRAPH CLOSURE CANDIDATE PASS — still nonrelease; native compatibility and unchanged all-target cargo-deny mandatory")
          PY
          git hash-object codex-rs/Cargo.toml > "$RUNNER_TEMP/combined-crypto/manifest-blob.txt"
          git hash-object codex-rs/Cargo.lock > "$RUNNER_TEMP/combined-crypto/lock-blob.txt"
          cp codex-rs/Cargo.lock "$RUNNER_TEMP/combined-crypto/generated-Cargo.lock"
          git diff -- codex-rs/Cargo.toml > "$RUNNER_TEMP/combined-crypto/manifest.patch"
          git diff -- codex-rs/Cargo.lock > "$RUNNER_TEMP/combined-crypto/lock.patch"
          test "$(git hash-object codex-rs/deny.toml)" = "$(cat "$RUNNER_TEMP/combined-crypto/original-security-policy-blob.txt")"
          git diff --check
          echo 'No source allowlist acceptance, no advisory waiver, no production merge, no release.'
      - name: Save exact disposable experiment evidence even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/combined-crypto"
          git rev-parse HEAD > "$RUNNER_TEMP/combined-crypto/source-commit.txt"
          git status --short > "$RUNNER_TEMP/combined-crypto/scratch-status.txt"
          git diff --stat > "$RUNNER_TEMP/combined-crypto/diff-stat.txt"
          if [ -f codex-rs/vendor/aws-config-1.13.0/src/login/dpop.rs ]; then
            cp codex-rs/vendor/aws-config-1.13.0/src/login/dpop.rs \
              "$RUNNER_TEMP/combined-crypto/modified-dpop.rs"
            cp codex-rs/vendor/aws-config-1.13.0/Cargo.toml \
              "$RUNNER_TEMP/combined-crypto/modified-aws-config-manifest.toml"
          fi
      - name: Upload scratch-only proof (not a release artifact)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-combined-crypto-bigint-graph-nonrelease
          path: ${{ runner.temp }}/combined-crypto/
          if-no-files-found: warn
          retention-days: 5
