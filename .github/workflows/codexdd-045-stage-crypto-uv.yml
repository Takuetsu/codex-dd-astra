# One-time protected staging of the exact Cargo-generated scratch result.
# This is NOT a release, merge, deployment, or security exception.
name: CodexDD 0.4.5 stage proven P-256 owner only (NONRELEASE)
on:
  push:
    branches:
      - dd/codexdd-v0.4.5-crypto-bigint-uv-staging
    paths:
      - '.github/workflows/codexdd-045-stage-crypto-uv.yml'

permissions:
  contents: write

jobs:
  stage-exact-uv:
    name: Import SHA-verified scratch lock into isolated branch only
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '71a906e979839c860fc224c89048ee0f77d8f65f'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact isolated staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify original source, security policy and release blockers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '71a906e979839c860fc224c89048ee0f77d8f65f'
          test "$(git hash-object codex-rs/Cargo.toml)" = 'd46347640b6ca6e43e96a12ee14eec894178af4f'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'f19b0086eac09c6830c887be83db5ae4ae11587e'
          test "$(git hash-object codex-rs/user-verification/Cargo.toml)" = 'fe4d5298f0484de68d9e417e47206f5be74fc729'
          test "$(git hash-object codex-rs/deny.toml)" = '630b9026d283705411d98eb90e0813fd25390bce'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          test -z "$(git status --porcelain)"

      - name: Apply only the exact source and guard changes from green scratch proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace_one(path, old, new):
              p = Path(path)
              source = p.read_text(encoding="utf-8")
              assert source.count(old) == 1, f"unexpected source in {p}: {old!r}"
              p.write_text(source.replace(old, new), encoding="utf-8")
          uv = "codex-rs/user-verification/Cargo.toml"
          replace_one(uv,
              'p256 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "std"] }',
              'p256 = { version = "0.14", default-features = false, features = ["arithmetic", "pkcs8", "std"] }')
          replace_one(uv,
              'p256 = { version = "0.13", features = ["ecdsa"] }',
              'p256 = { version = "0.14", features = ["ecdsa"] }')
          replace_one("codex-rs/user-verification/src/credential_tests.rs",
              ".to_encoded_point(/*compress*/ false)", ".to_sec1_point(/*compress*/ false)")
          replace_one("scripts/codexdd-045-inherited-risk-guard.py",
              '"ctutils": "0.4.4",', '"ctutils": "0.4.6",')
          replace_one("scripts/codexdd-045-dependency-security-check.py",
              '"ctutils": "0.4.4",', '"ctutils": "0.4.6",')
          PY
          test "$(git hash-object codex-rs/user-verification/Cargo.toml)" = '067af0bb9175d828c7292670e6e4acdbbaad08ff'
          test "$(git hash-object codex-rs/user-verification/src/credential_tests.rs)" = '21260463809584b64dec74dc5cd3d70389b86a58'
          git diff --check

      - name: Install same pinned Rust 1.95.0 used by green scratch test
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Reproduce Cargo-generated lock SHA and verify staging gates
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 \
            --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/codexdd045-uv-windows.json"
          test "$(git hash-object codex-rs/Cargo.lock)" = 'b08006b6928d98eff75ea764db71ea281cb5df3e'
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/codexdd045-uv-linux.json"
          python3 scripts/codexdd-045-inherited-risk-guard.py
          python3 scripts/codexdd-045-dependency-security-check.py --mode staging
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("codex-rs/Cargo.lock").read_text(encoding="utf-8"))
          by_name = {}
          for p in lock["package"]:
              by_name.setdefault(p["name"], set()).add(p["version"])
          assert by_name["crypto-bigint"] == {"0.5.5", "0.7.10"}, "unexpected crypto-bigint versions"
          assert by_name["ctutils"] == {"0.4.6"}, "unexpected ctutils"
          assert by_name["p256"] == {"0.13.2", "0.14.0"}, "unexpected P-256 owners"
          assert by_name["zstd"] == {"0.14.3"}, "Zstd security remediation changed"
          print("PASS: exact generated lock reproduces green scratch; crypto-bigint 0.5.5 remains UNWAIVED")
          PY
          test "$(git diff --name-only | sort)" = "$(printf 'codex-rs/Cargo.lock\ncodex-rs/user-verification/Cargo.toml\ncodex-rs/user-verification/src/credential_tests.rs\nscripts/codexdd-045-dependency-security-check.py\nscripts/codexdd-045-inherited-risk-guard.py')"
          git diff --check
          echo "Exact staged lock Git blob: $(git hash-object codex-rs/Cargo.lock)"
          echo 'This is a 5-file NONRELEASE owner migration only; original security issue still blocks the release.'

      - name: Commit exact reviewed candidate to its isolated feature branch only
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-remote origin refs/heads/dd/codexdd-v0.4.5-crypto-bigint-uv-staging | cut -f1)"
          test "$expected" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- codex-rs/Cargo.lock codex-rs/user-verification/Cargo.toml \
            codex-rs/user-verification/src/credential_tests.rs \
            scripts/codexdd-045-dependency-security-check.py \
            scripts/codexdd-045-inherited-risk-guard.py
          git commit -m 'test(codexdd 0.4.5): stage tested P-256 0.14 migration, secure ctutils pins [skip ci]'
          git push origin HEAD:refs/heads/dd/codexdd-v0.4.5-crypto-bigint-uv-staging
          echo "STAGED EXACT CANDIDATE COMMIT: $(git rev-parse HEAD)"
          echo 'NONRELEASE: crypto-bigint 0.5.5 remains; do not merge or install.'
