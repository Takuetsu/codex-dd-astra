# One-shot, SOURCE ONLY. No MSVC/Rust binary compilation or release.
name: CodexDD 0.4.5 3F.60 all remaining 56 Core TUI owner source reviews (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f60-core-tui-owner-closure]
    paths: [".github/workflows/codexdd-045-3f60-source-review.yml"]
permissions:
  contents: read
jobs:
  exact-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'bc8e2134a34f8c2ae774750e69ebe1dd364a9181'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify all 56 current vs upstream Git blob reverse-hunk reconstructions and release-negative gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for test in \
            test_codexdd_045_3f60_all_56_core_tui.py \
            test_codexdd_045_3f59_persistence_memory_semantics.py \
            test_codexdd_045_3f58_seven_binary_evidence.py \
            test_codexdd_045_3f57_cli_state_semantics.py \
            test_codexdd_045_3f55_formal_owner_approvals.py \
            test_codexdd_045_3f51_generated_protocol_parity.py
          do
            python3 -B -m unittest discover -s .github/scripts -p "$test" -q
          done
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'REVIEWED=109/109 SOURCE ONLY; OWNER_ACCEPTED=0; NATIVE_NOT_RUN'
