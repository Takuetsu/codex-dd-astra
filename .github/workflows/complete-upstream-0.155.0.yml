name: complete-upstream-merge-0.155.0

on:
  push:
    branches:
      - automation/upstream-sync-rust-v0.155.0
    paths:
      - .github/upstream-0155-run

permissions:
  contents: read

jobs:
  merge:
    name: Resolve and export upstream 0.155.0 merge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: automation/upstream-sync-rust-v0.155.0
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve reviewed conflict set
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/resolve_upstream_0155.py "$RUNNER_TEMP/resolve_upstream_0155.py"
          git reset --hard c76ac2952b920dfb8973c2abfa11e2d482cf6f2b
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openai/codex.git
          git fetch upstream tag rust-v0.155.0 --no-tags

          set +e
          git merge --no-ff --no-commit rust-v0.155.0
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -eq 0 ]]; then
            echo "Expected reviewed conflict set, but merge completed without conflicts." >&2
            exit 1
          fi

          git diff --name-only --diff-filter=U | sort > actual-conflicts.txt
          cat > expected-conflicts.txt <<'EOF'
          codex-rs/app-server-protocol/schema/precomputed/app-server-exports-experimental.json.zst
          codex-rs/build-info/src/build_info_tests.rs
          codex-rs/core/src/thread_manager.rs
          codex-rs/core/src/tools/context.rs
          codex-rs/tui/src/app.rs
          codex-rs/tui/src/app/startup.rs
          codex-rs/tui/src/app/test_support.rs
          codex-rs/tui/src/app/tests.rs
          codex-rs/tui/src/app/tests/startup.rs
          codex-rs/tui/src/chatwidget/input_flow.rs
          codex-rs/tui/src/slash_command.rs
          EOF
          sort -o expected-conflicts.txt expected-conflicts.txt
          if ! diff -u expected-conflicts.txt actual-conflicts.txt; then
            echo "Conflict set changed; refusing scripted resolution." >&2
            exit 1
          fi

          while IFS= read -r path; do
            [[ "$path" == *.zst ]] && continue
            git checkout --conflict=diff3 -- "$path"
          done < actual-conflicts.txt

          git checkout --theirs -- codex-rs/app-server-protocol/schema/precomputed/app-server-exports-experimental.json.zst
          python3 "$RUNNER_TEMP/resolve_upstream_0155.py"

          git add \
            codex-rs/app-server-protocol/schema/precomputed/app-server-exports-experimental.json.zst \
            codex-rs/build-info/src/build_info_tests.rs \
            codex-rs/core/src/thread_manager.rs \
            codex-rs/core/src/tools/context.rs \
            codex-rs/tui/src/app.rs \
            codex-rs/tui/src/app/startup.rs \
            codex-rs/tui/src/app/test_support.rs \
            codex-rs/tui/src/app/tests.rs \
            codex-rs/tui/src/app/tests/startup.rs \
            codex-rs/tui/src/chatwidget/input_flow.rs \
            codex-rs/tui/src/slash_command.rs

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge entries remain." >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          printf '%s\n' 'rust-v0.155.0' > codex-rs/upstream-codex-release.txt
          git add codex-rs/upstream-codex-release.txt
          rm -f actual-conflicts.txt expected-conflicts.txt
          git diff --check
          git commit -m "codexdd: integrate upstream rust-v0.155.0"

      - name: Export resolved merge tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merge-export/unique
          git diff --binary HEAD^1 HEAD > merge-export/resolved.patch
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          raw = subprocess.check_output(
              [
                  "git",
                  "diff-tree",
                  "-r",
                  "--no-commit-id",
                  "--raw",
                  "-z",
                  "--no-renames",
                  "--no-abbrev",
                  "HEAD^1",
                  "HEAD",
              ]
          )
          parts = raw.split(b"\0")
          entries = []
          i = 0
          zero = "0" * 40
          unique_root = Path("merge-export/unique")
          while i < len(parts) and parts[i]:
              header = parts[i].decode("utf-8")
              path = parts[i + 1].decode("utf-8")
              i += 2
              old_mode, new_mode, old_sha, new_sha, status = header[1:].split()[:5]
              if status == "D":
                  entries.append({
                      "path": path,
                      "status": status,
                      "mode": None,
                      "sha": None,
                      "unique": False,
                  })
                  continue
              try:
                  parent2_sha = git("rev-parse", f"HEAD^2:{path}")
              except subprocess.CalledProcessError:
                  parent2_sha = None
              unique = new_sha not in {old_sha, parent2_sha}
              entries.append({
                  "path": path,
                  "status": status,
                  "mode": new_mode,
                  "sha": new_sha,
                  "unique": unique,
              })
              if unique and new_mode != "160000":
                  dest = unique_root / path
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(subprocess.check_output(["git", "show", f"HEAD:{path}"]))

          manifest = {
              "commit": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "parent1": git("rev-parse", "HEAD^1"),
              "parent2": git("rev-parse", "HEAD^2"),
              "entries": entries,
              "unique_count": sum(1 for entry in entries if entry["unique"]),
          }
          Path("merge-export/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "commit": manifest["commit"],
              "tree": manifest["tree"],
              "parent1": manifest["parent1"],
              "parent2": manifest["parent2"],
              "entry_count": len(entries),
              "unique_count": manifest["unique_count"],
          }, indent=2))
          PY

      - name: Upload resolved merge export
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upstream-0.155.0-resolved-export
          path: merge-export/
          include-hidden-files: true
          if-no-files-found: error

  validate:
    name: Windows debug build and Adaptive tests
    needs: merge
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: c76ac2952b920dfb8973c2abfa11e2d482cf6f2b
          fetch-depth: 0
          persist-credentials: false

      - name: Download resolved merge export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-0.155.0-resolved-export
          path: merge-export

      - name: Materialize exact resolved tree
        shell: pwsh
        run: |
          git apply --index --binary merge-export/resolved.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "validation snapshot"
          $manifest = Get-Content merge-export/manifest.json -Raw | ConvertFrom-Json
          $actualTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($actualTree -ne $manifest.tree) {
            throw "Resolved tree mismatch: expected $($manifest.tree), got $actualTree"
          }

      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: cargo fmt
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Build codex-cli
        working-directory: codex-rs
        run: cargo build -p codex-cli

      - name: Core adaptive signal tests
        working-directory: codex-rs
        run: cargo test -p codex-core adaptive_signal --lib --no-fail-fast

      - name: TUI adaptive controller tests
        working-directory: codex-rs
        run: cargo test -p codex-tui adaptive_controller_tests --lib --no-fail-fast

      - name: TUI trusted adaptive signal tests
        working-directory: codex-rs
        run: cargo test -p codex-tui adaptive_trusted_signal --lib --no-fail-fast

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
