            if ($line -match '^(.*?)=(.*)$' -and $names -contains $matches[1]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Restore exact fully-built optimized core dependency action cache
        id: restored
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: D:/_bazel-disk
          key: codexdd045-3f47-${{ github.run_id }}-core-complete
          fail-on-cache-miss: true
      - name: Check exact completed core stage cache
        shell: pwsh
        run: |
          if ('${{ steps.restored.outputs.cache-hit }}' -ne 'true') { throw 'Missing exact core optimized cache' }
      - name: Build and verify REAL release-profile codex.exe and codex.pdb
        id: cli
        shell: pwsh
        run: |
          & .github/scripts/codexdd-045-staged-optimized-windows.ps1 -Stage cli -SoftMinutes 165 -MaxCacheBytes 12884901888 -ExpectedPathSha '${{ needs.core_seed.outputs.path_sha }}'
          if (-not $?) { throw 'Physical optimized CLI/PDB check failed' }
      - name: Build and verify REAL combined optimized Windows EXE-PDB archive on same runner
        id: combined
        shell: pwsh
        run: |
          & .github/scripts/codexdd-045-staged-optimized-windows.ps1 -Stage combined -SoftMinutes 90 -MaxCacheBytes 12884901888 -ExpectedPathSha '${{ needs.core_seed.outputs.path_sha }}'
          if (-not $?) { throw 'Real optimized Windows combined archive failed' }
      - name: Verify physical package bytes before retaining nonrelease artifacts
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'codexdd045-release-staged/nonrelease-artifacts'
          $manifest=Join-Path $dir 'combined-sha256-inventory.json'
          $archive=Join-Path $dir 'runtime_package_combined.tar.gz'
          foreach($f in @($manifest,$archive,(Join-Path $dir 'codex.exe'),(Join-Path $dir 'codex.pdb'))) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing required binary/PDB/archive file: $f" }
          }
          $receipt=Get-Content $manifest -Raw | ConvertFrom-Json
          if ($receipt.file_count -ne 10 -or $receipt.release_approved -or $receipt.result -ne 'NONRELEASE_OPTIMIZED_WINDOWS_ARCHIVE_CONTENT_VERIFIED') {
            throw 'Combined Windows file manifest invalid or prematurely released'
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $receipt.archive_sha256) {
            throw 'Archive mutated after verification'
          }
          Write-Host "REAL_OPTIMIZED_CLI_PDB_COMBINED_ARCHIVE_VERIFIED=TRUE (NONRELEASE)"
      - name: Retain actual unsigned CLI, MSVC PDB and combined archive for source-frozen validation
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f47-optimized-windows-binaries-and-symbols-${{ github.run_id }}
          path: ${{ runner.temp }}/codexdd045-release-staged/nonrelease-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain stage SHA256 receipts only
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
