      - name: Upload bounded final compilation diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-3f47-final-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/codexdd045-release-staged/*.log
          if-no-files-found: warn
          retention-days: 5
