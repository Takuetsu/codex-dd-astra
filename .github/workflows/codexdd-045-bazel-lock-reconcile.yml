# Single-branch, nonrelease Bazel module-lock reconciliation.
# Trigger only on introduction/change of this workflow; never on each module edit.
# The job may commit ONLY MODULE.bazel.lock to the pinned integration branch.
name: CodexDD 0.4.5 Bazel lock reconciliation

on:
  push:
    branches:
      - dd/codexdd-v0.4.5-upstream-0.163.0-integration
    paths:
      - '.github/workflows/codexdd-045-bazel-lock-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: codexdd045-bazel-lock-reconcile
  cancel-in-progress: false

jobs:
  reconcile-lock:
    name: Regenerate and verify fork Bazel module lock (nonrelease)
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.ref == 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PARENT: 'ad34e616df5ec19e6fae2e694041317a153c807c'
      EXPECTED_MODULE_BLOB: '90e543f115133ff42472b7bc2414651c65e5c7f5'
      ORIGINAL_LOCK_BLOB: 'e5c69a07a0f5987c3cff38ff35e5ed5be3b91f1b'
    steps:
      - name: Checkout exact 0.4.5 integration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard source authority, dependency graph and release markers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Takuetsu/codex-dd-astra'
          test "$GITHUB_REF" = 'refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$GITHUB_SHA"
          test "$(git hash-object MODULE.bazel)" = "$EXPECTED_MODULE_BLOB"
          test "$(git hash-object MODULE.bazel.lock)" = "$ORIGINAL_LOCK_BLOB"
          test "$(git hash-object codex-rs/Cargo.toml)" = 'c78e1e92e3cfd21a4d16ceea2d55b43d1976e8e4'
          test "$(git hash-object codex-rs/Cargo.lock)" = 'a8eb8a076276cb3db5674b33c67d743b1c3d21fc'
          test "$(git hash-object codex-rs/deny.toml)" = 'ea7fdc149fc880c6b36d75c29851641034289a4e'
          test "$(tr -d '\r\n' < codex-rs/codexdd-version.txt)" = '0.4.4'
          test "$(tr -d '\r\n' < codex-rs/upstream-codex-release.txt)" = 'rust-v0.162.0'
          grep -Fqx 'bazel_dep(name = "rules_pkg", version = "1.0.1")' MODULE.bazel
          grep -Fq '"//patches:rules_rust_release_build_script_profile.patch"' MODULE.bazel
          grep -Fq '"//patches:rules_rust_process_wrapper_param_file.patch"' MODULE.bazel
          ! grep -Fq '"//patches:rules_rust_group_build_script_arg_files.patch"' MODULE.bazel
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git ls-remote origin refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration | cut -f1)" = "$GITHUB_SHA"

      - name: Install pinned Bazelisk and Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1

      - name: Resolve fork module graph and verify lock mode error
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codexdd045-bazel-lock"
          log="$RUNNER_TEMP/codexdd045-bazel-lock/resolve.log"
          verify="$RUNNER_TEMP/codexdd045-bazel-lock/verify.log"
          bazel --version
          if ! bazel --noexperimental_remote_repo_contents_cache mod deps --lockfile_mode=update > "$log" 2>&1; then
            tail -n 160 "$log"
            echo "FAIL: Bazel module resolver returned nonzero; lockfile NOT committed"
            exit 1
          fi
          tail -n 45 "$log"
          if ! bazel --noexperimental_remote_repo_contents_cache mod deps --lockfile_mode=error > "$verify" 2>&1; then
            tail -n 160 "$verify"
            echo "FAIL: regenerated lock did not pass Bazel error-mode verification"
            exit 1
          fi
          tail -n 35 "$verify"
          echo "PASS: Bazel lockfile regenerated and verified at current source"

      - name: Check lock-only change and publish fail-closed integration checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          original = json.loads(subprocess.check_output(["git", "show", "HEAD:MODULE.bazel.lock"]))
          updated = json.loads(Path("MODULE.bazel.lock").read_text(encoding="utf-8"))
          if not isinstance(updated, dict) or updated == original:
              raise SystemExit("Expected a nonempty lockfile update from 0.163 MODULE changes")
          if original.get("lockFileVersion") != updated.get("lockFileVersion"):
              raise SystemExit("Unexpected Bazel lockfile format change")
          changed_top = sorted(set(original) | set(updated))
          changed_top = [key for key in changed_top if original.get(key) != updated.get(key)]
          print("CHANGED_TOP_LEVEL_LOCK_KEYS:", ", ".join(changed_top))
          print("LOCK_SIZE:", Path("MODULE.bazel.lock").stat().st_size)
          PY
          test "$(git diff --name-only | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only)" = 'MODULE.bazel.lock'
          git diff --check
          new_blob="$(git hash-object MODULE.bazel.lock)"
          test "$new_blob" != "$ORIGINAL_LOCK_BLOB"
          # No merge/overwrite if another agent updated the branch while resolving.
          remote_head="$(git ls-remote origin refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MODULE.bazel.lock
          test "$(git diff --cached --name-only)" = 'MODULE.bazel.lock'
          git commit -m 'build(codexdd 0.4.5): resolve and verify fork Bazel module lock'
          # Only the lock is committed. Push is fast-forward only; no release or default branch.
          git push origin HEAD:refs/heads/dd/codexdd-v0.4.5-upstream-0.163.0-integration
          echo "PASS: committed verified lock blob $new_blob on integration branch"

      - name: Upload bounded resolver diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexdd045-bazel-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexdd045-bazel-lock/*.log
          if-no-files-found: warn
          retention-days: 7
