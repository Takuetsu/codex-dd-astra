# NONRELEASE source-only local-equivalent preflight. No Rust compilation or release.
name: CodexDD 0.4.5 3F.73 bounded FIFO source preflight (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f73-bounded-fifo-live-queue]
    paths: [".github/workflows/codexdd-045-3f73-cheap-rustfmt.yml"]
permissions:
  contents: read
jobs:
  cheap-source:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '8aa28cc64ee83d0ac9be16357e28c0c6bfa2b17f'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Exact source, production marker, immutable lock graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '8aa28cc64ee83d0ac9be16357e28c0c6bfa2b17f'
          test "$(git rev-parse HEAD:codex-rs/Cargo.lock)" = '13bc15ff844e93dfaf7777c73bb7313b35bb3b81'
          test "$(cat codex-rs/codexdd-version.txt)" = 0.4.4
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # Rust 1.95.0
        with:
          components: rustfmt
      - name: Apply pinned rustfmt and recheck
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Fail closed on any surprising source or behavior scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          valid = {
              "codex-rs/tui/src/app.rs",
              "codex-rs/tui/src/app/thread_events.rs",
              "codex-rs/tui/src/app/thread_routing.rs",
              "codex-rs/tui/src/app/startup.rs",
              "codex-rs/tui/src/app/session_lifecycle.rs",
              "codex-rs/tui/src/app/event_dispatch.rs",
              "codex-rs/tui/src/app_event.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if not changed <= valid:
              raise SystemExit(f"Unexpected rustfmt files: {changed - valid}")
          root = Path("codex-rs/tui/src")
          events = (root/"app/thread_events.rs").read_text()
          routing = (root/"app/thread_routing.rs").read_text()
          startup = (root/"app/startup.rs").read_text()
          app = (root/"app.rs").read_text()
          assert "mpsc::unbounded_channel()" not in events
          assert "mpsc::channel(capacity.clamp(1, THREAD_EVENT_LIVE_CAPACITY))" in events
          assert "THREAD_EVENT_PENDING_LIMIT" in events and "pending_live.push_front(event)" in events
          assert "queue_live_event" in routing and "drain_active_thread_events_before_detach" in routing
          assert "live_event_backpressure" in startup and "!live_event_backpressure" in startup
          assert "mpsc::Receiver<ThreadBufferedEvent>" in app
          assert "saturated_queue_retains_fifo_approval_and_completion_once" in events
          assert "saturated_queue_count_remains_bounded_and_fifo_over_repeated_drains" in events
          assert "bounded_live_queue_fails_closed_if_owner_task_would_overflow" in events
          formal = Path("docs/upstream-candidates/codexdd-045-3f55-formal-owner-approvals.json").read_text()
          import json
          ledger = json.loads(formal)
          assert ledger["approved_owner_count"] == 0 and len(ledger["pending_native_or_semantic_restoration"]) == 13
          print(f"PASS: Rustfmt-only paths {len(changed)}, bounds, FIFO test selectors, source authority unchanged")
          PY
      - name: Publish formatting only (nonrelease)
        shell: bash
        run: |
          set -euo pipefail
          branch='dd/codexdd-v0.4.5-3f73-bounded-fifo-live-queue'
          expected="$GITHUB_SHA"
          remote="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$remote" = "$expected"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- codex-rs/tui/src/
            git commit -m "style(0.4.5): rustfmt bounded FIFO event queue candidate"
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo 'Source preflight green; no native result, approvals or release.'
