name: codexdd-3b2-generate-precomputed-exports
# retry after 3B compile prerequisite repair

on:
  push:
    branches:
      - dd/codexdd-v0.3.14-upstream-0.159.2
    paths:
      - .github/workflows/codexdd-3b2-generate-precomputed-exports.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and validate 3B.2 exports
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Regenerate stable precomputed exports in scratch schema root
        shell: bash
        env:
          CODEX_APP_SERVER_SCHEMA_ROOT: ${{ runner.temp }}/codexdd-3b2-schema
          CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL: "0"
        run: |
          set -euo pipefail
          cargo test -p codex-app-server-protocol --lib schema_fixtures_tests::write_schema_fixtures_from_env -- --exact --ignored

      - name: Regenerate experimental precomputed exports in scratch schema root
        shell: bash
        env:
          CODEX_APP_SERVER_SCHEMA_ROOT: ${{ runner.temp }}/codexdd-3b2-schema
          CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cargo test -p codex-app-server-protocol --lib schema_fixtures_tests::write_schema_fixtures_from_env -- --exact --ignored

      - name: Install regenerated precomputed exports only
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/codexdd-3b2-schema/precomputed/app-server-exports-stable.json.zst" app-server-protocol/schema/precomputed/
          cp "${RUNNER_TEMP}/codexdd-3b2-schema/precomputed/app-server-exports-experimental.json.zst" app-server-protocol/schema/precomputed/

      - name: Verify 3B.2 changed-path boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "codex-rs/app-server-protocol/schema/precomputed/app-server-exports-stable.json.zst",
              "codex-rs/app-server-protocol/schema/precomputed/app-server-exports-experimental.json.zst",
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1"], text=True
              ).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(
                  "unexpected 3B.2 changed paths:\n"
                  + "\n".join(sorted(changed))
                  + "\nexpected:\n"
                  + "\n".join(sorted(expected))
              )
          print("3B.2 changed-path boundary verified")
          PY

      - name: Validate stable precomputed export consistency
        shell: bash
        run: cargo test -p codex-app-server-protocol --lib schema_fixtures_tests::stable_precomputed_exports_match_schema_fixtures -- --exact

      - name: Validate experimental precomputed export consistency
        shell: bash
        run: cargo test -p codex-app-server-protocol --lib schema_fixtures_tests::experimental_precomputed_exports_match_generated -- --exact

      - name: Commit generated 3B.2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app-server-protocol/schema/precomputed/app-server-exports-stable.json.zst             app-server-protocol/schema/precomputed/app-server-exports-experimental.json.zst
          git commit -m "codexdd 0.3.14: regenerate app-server precomputed exports"
          git push origin HEAD:${GITHUB_REF_NAME}
