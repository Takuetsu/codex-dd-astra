# One-shot source receipt gate, no native rebuild, publication or release.
name: CodexDD 0.4.5 3F.58 verified seven-program unsigned distribution receipt (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-3f58-seven-binary-evidence]
    paths: [".github/workflows/codexdd-045-3f58-binary-evidence.yml"]
permissions:
  contents: read
jobs:
  receipt:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == 'NOT_ARMED_3F58'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact 14 member hashes, source provenance and pending formal decisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f58_seven_binary_evidence.py -v
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f57_cli_state_semantics.py -q
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f55_formal_owner_approvals.py -q
          python3 -B -m unittest discover -s .github/scripts -p test_codexdd_045_3f50_distribution_gate.py -q
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
