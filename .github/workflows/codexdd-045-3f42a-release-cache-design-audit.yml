# Source-only archive verifier and immutable protected packaging policy. NO Bazel/Cargo.
name: CodexDD 0.4.5 release cache and Windows archive verification design audit (NONRELEASE)
on:
  push:
    branches: [dd/codexdd-v0.4.5-109-overlap-semantic-review]
    paths: [".github/workflows/codexdd-045-3f42a-release-cache-design-audit.yml"]
permissions:
  contents: read
jobs:
  source-audit:
    if: github.repository == 'Takuetsu/codex-dd-astra' && github.event.before == '8d6d3a6db54ab80bb6a337c1ae09833a7122b87e'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate bounded packaging plan and archive-failure test cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '8d6d3a6db54ab80bb6a337c1ae09833a7122b87e'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f42a_windows_archive_verifier.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f41a_windows_package_inventory.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_codexdd_045_3f14_owner_matrix.py' -v
          test -z "$(git status --porcelain)"
